name: Robot Test Gates

on:
  push:
    branches: [main, develop, 'feature/*']
  pull_request:
    branches: [main, develop]

jobs:
  detect-changes:
    name: Detect Robot Changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.changes.outputs.backend }}
      frontend: ${{ steps.changes.outputs.frontend }}
      database: ${{ steps.changes.outputs.database }}
      infrastructure: ${{ steps.changes.outputs.infrastructure }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v2
        id: changes
        with:
          filters: |
            backend:
              - 'SOURCE/backend/**'
              - 'SOURCE/tests/**/backend/**'
            frontend:
              - 'SOURCE/frontend/**'
              - 'SOURCE/tests/**/frontend/**'
            database:
              - 'SOURCE/database/**'
              - 'SOURCE/tests/**/database/**'
            infrastructure:
              - 'SOURCE/infrastructure/**'
              - 'SOURCE/tests/**/infrastructure/**'

  luc-infrastructure-tests:
    name: 🤖 Luc (DevOps) - Infrastructure Tests
    needs: detect-changes
    if: needs.detect-changes.outputs.infrastructure == 'true'
    runs-on: ubuntu-latest
    
    services:
      mongodb:
        image: mongo:latest
        ports:
          - 27017:27017
        options: >-
          --health-cmd mongosh --eval "db.adminCommand('ping')"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: SOURCE/backend/package-lock.json
      
      - name: Install dependencies
        run: |
          cd SOURCE/infrastructure
          npm ci || echo "No package.json found in infrastructure"
      
      - name: Run Environment Validation Tests
        run: |
          echo "🔧 Running infrastructure tests for Luc..."
          cd SOURCE/infrastructure
          
          # Test MongoDB connection
          if [ -f "test-db-connection.js" ]; then
            node test-db-connection.js
          fi
          
          # Test environment configuration
          if [ -f "test-env-config.js" ]; then
            node test-env-config.js
          fi
          
          # Run infrastructure unit tests
          if [ -f "package.json" ]; then
            npm test
          fi
      
      - name: Check Test Coverage
        run: |
          cd SOURCE/infrastructure
          if [ -f "package.json" ]; then
            npm run test:coverage || npm test -- --coverage || echo "No coverage script found"
          fi
      
      - name: Report to Roma
        if: always()
        run: |
          echo "📊 Luc's Infrastructure Test Results"
          echo "Status: ${{ job.status }}"
          echo "Tests: Infrastructure validation and environment setup"

  ashok-database-tests:
    name: 🤖 Ashok (Data) - Database Tests
    needs: detect-changes
    if: needs.detect-changes.outputs.database == 'true'
    runs-on: ubuntu-latest
    
    services:
      mongodb:
        image: mongo:latest
        ports:
          - 27017:27017
        options: >-
          --health-cmd mongosh --eval "db.adminCommand('ping')"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: SOURCE/backend/package-lock.json
      
      - name: Install dependencies
        run: |
          cd SOURCE/database
          npm ci || {
            echo "Installing from backend package.json"
            cd ../backend && npm ci
          }
      
      - name: Run Database Schema Tests
        env:
          MONGODB_URI: mongodb://localhost:27017/test_db
        run: |
          echo "🗄️ Running database tests for Ashok..."
          cd SOURCE/database
          
          # Run schema validation tests
          if [ -f "test-schemas.js" ]; then
            node test-schemas.js
          fi
          
          # Run migration tests
          if [ -f "test-migrations.js" ]; then
            node test-migrations.js
          fi
          
          # Run model validation tests
          npm run test:models || npm test || echo "Running tests from backend directory"
          
          if [ ! -f "package.json" ]; then
            cd ../backend
            npm run test:database || npm test -- --testPathPattern=database
          fi
      
      - name: Check Database Test Coverage
        env:
          MONGODB_URI: mongodb://localhost:27017/test_db
        run: |
          echo "📊 Checking Ashok's database test coverage..."
          cd SOURCE/database
          
          if [ -f "package.json" ]; then
            npm run test:coverage || echo "No coverage script, checking backend coverage"
          fi
          
          if [ ! -f "package.json" ]; then
            cd ../backend
            npm run test:coverage -- --testPathPattern=database || echo "Coverage check completed"
          fi
      
      - name: Validate Schema Integrity
        env:
          MONGODB_URI: mongodb://localhost:27017/test_db
        run: |
          echo "🔍 Validating schema integrity..."
          cd SOURCE/backend
          
          # Test that all models can be loaded without errors
          node -e "
            const fs = require('fs');
            const path = require('path');
            if (fs.existsSync('src/models')) {
              const models = fs.readdirSync('src/models');
              models.forEach(model => {
                if (model.endsWith('.js')) {
                  console.log('Loading model:', model);
                  require('./src/models/' + model);
                }
              });
              console.log('✅ All models loaded successfully');
            } else {
              console.log('No models directory found');
            }
          "

  reena-backend-tests:
    name: 🤖 Reena (Backend) - API Tests
    needs: detect-changes
    if: needs.detect-changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    
    services:
      mongodb:
        image: mongo:latest
        ports:
          - 27017:27017
        options: >-
          --health-cmd mongosh --eval "db.adminCommand('ping')"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: SOURCE/backend/package-lock.json
      
      - name: Install backend dependencies
        run: |
          cd SOURCE/backend
          npm ci
      
      - name: Run API Contract Tests
        env:
          NODE_ENV: test
          MONGODB_URI: mongodb://localhost:27017/test_db
          PORT: 8090
        run: |
          echo "🔌 Running API tests for Reena..."
          cd SOURCE/backend
          
          # Run API contract tests first
          npm run test:contracts || echo "No contract tests found"
          
          # Run unit tests
          npm run test:unit || npm test -- --testPathPattern="unit|spec"
          
          # Run integration tests
          npm run test:integration || npm test -- --testPathPattern="integration"
      
      - name: Check API Test Coverage
        env:
          NODE_ENV: test
          MONGODB_URI: mongodb://localhost:27017/test_db
        run: |
          echo "📊 Checking Reena's API test coverage..."
          cd SOURCE/backend
          
          npm run test:coverage || npm test -- --coverage
          
          # Check if coverage meets 80% threshold
          if [ -f "coverage/coverage-summary.json" ]; then
            node -e "
              const coverage = require('./coverage/coverage-summary.json');
              const total = coverage.total;
              const threshold = 80;
              
              console.log('Coverage Summary:');
              console.log('Lines:', total.lines.pct + '%');
              console.log('Functions:', total.functions.pct + '%');
              console.log('Branches:', total.branches.pct + '%');
              console.log('Statements:', total.statements.pct + '%');
              
              if (total.lines.pct < threshold) {
                console.log('❌ Coverage below threshold:', threshold + '%');
                process.exit(1);
              } else {
                console.log('✅ Coverage meets threshold:', threshold + '%');
              }
            "
          fi
      
      - name: Test API Endpoints
        env:
          NODE_ENV: test
          MONGODB_URI: mongodb://localhost:27017/test_db
          PORT: 8090
        run: |
          echo "🧪 Testing API endpoints..."
          cd SOURCE/backend
          
          # Start server in background for endpoint testing
          npm start &
          SERVER_PID=$!
          
          # Wait for server to start
          sleep 5
          
          # Test basic endpoints
          curl -f http://localhost:8090/api/v1/health || echo "Health endpoint test"
          curl -f http://localhost:8090/api/v1/projects || echo "Projects endpoint test"
          
          # Stop server
          kill $SERVER_PID || true

  charlie-frontend-tests:
    name: 🤖 Charlie (Frontend) - Flutter Tests
    needs: detect-changes
    if: needs.detect-changes.outputs.frontend == 'true'
    runs-on: macos-latest  # macOS for Flutter desktop
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.16.0'
          channel: 'stable'
      
      - name: Enable macOS desktop
        run: |
          flutter config --enable-macos-desktop
      
      - name: Install dependencies
        run: |
          cd SOURCE/frontend
          flutter pub get
      
      - name: Analyze code
        run: |
          echo "🔍 Running Flutter analysis for Charlie..."
          cd SOURCE/frontend
          flutter analyze
      
      - name: Run Unit Tests
        run: |
          echo "🧪 Running Flutter unit tests..."
          cd SOURCE/frontend
          flutter test --coverage
      
      - name: Run Widget Tests
        run: |
          echo "🎨 Running Flutter widget tests..."
          cd SOURCE/frontend
          flutter test test/widget_test/ --coverage || echo "No widget tests found"
      
      - name: Check Flutter Test Coverage
        run: |
          echo "📊 Checking Charlie's Flutter test coverage..."
          cd SOURCE/frontend
          
          if [ -f "coverage/lcov.info" ]; then
            # Install lcov for coverage reporting
            brew install lcov || true
            
            # Generate coverage report
            genhtml coverage/lcov.info -o coverage/html || echo "Coverage report generation failed"
            
            # Check coverage percentage
            flutter test --coverage --coverage-path=coverage/lcov.info
          fi
      
      - name: Test macOS Build
        run: |
          echo "🖥️ Testing macOS build..."
          cd SOURCE/frontend
          flutter build macos --debug
      
      - name: Upload Coverage
        uses: codecov/codecov-action@v3
        if: always()
        with:
          file: SOURCE/frontend/coverage/lcov.info
          flags: frontend
          name: charlie-flutter-coverage

  test-summary:
    name: 📊 Test Summary Report
    needs: [luc-infrastructure-tests, ashok-database-tests, reena-backend-tests, charlie-frontend-tests]
    if: always()
    runs-on: ubuntu-latest
    
    steps:
      - name: Generate Test Summary
        run: |
          echo "🤖 ROME Robot Test Summary"
          echo "=========================="
          echo "Luc (Infrastructure): ${{ needs.luc-infrastructure-tests.result }}"
          echo "Ashok (Database): ${{ needs.ashok-database-tests.result }}"
          echo "Reena (Backend): ${{ needs.reena-backend-tests.result }}"
          echo "Charlie (Frontend): ${{ needs.charlie-frontend-tests.result }}"
          echo ""
          
          # Check if any tests failed
          if [[ "${{ needs.luc-infrastructure-tests.result }}" == "failure" ]] || \
             [[ "${{ needs.ashok-database-tests.result }}" == "failure" ]] || \
             [[ "${{ needs.reena-backend-tests.result }}" == "failure" ]] || \
             [[ "${{ needs.charlie-frontend-tests.result }}" == "failure" ]]; then
            echo "❌ Some robot tests failed - Roma enforcement required"
            exit 1
          else
            echo "✅ All robot tests passed - Ready for integration"
          fi