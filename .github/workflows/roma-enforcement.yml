name: Roma Test Enforcement

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main, develop]

jobs:
  roma-test-compliance:
    name: 🤖 Roma - Test Coverage Enforcement
    runs-on: ubuntu-latest
    
    services:
      mongodb:
        image: mongo:latest
        ports:
          - 27017:27017
        options: >-
          --health-cmd mongosh --eval "db.adminCommand('ping')"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: SOURCE/backend/package-lock.json
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.16.0'
          channel: 'stable'
      
      - name: Install Backend Dependencies
        run: |
          cd SOURCE/backend
          npm ci
      
      - name: Install Frontend Dependencies
        run: |
          cd SOURCE/frontend
          flutter pub get
      
      - name: 🚨 Contract Test Compliance Check
        id: contract-check
        run: |
          echo "🔍 Roma checking contract test compliance..."
          
          COMPLIANCE_SCORE=100
          ISSUES=""
          
          # Check if contract tests exist
          if [ ! -d "SOURCE/tests/contracts" ]; then
            COMPLIANCE_SCORE=$((COMPLIANCE_SCORE - 50))
            ISSUES="$ISSUES\n❌ Missing contract tests directory"
          else
            CONTRACT_COUNT=$(find SOURCE/tests/contracts -name "*.test.js" | wc -l)
            if [ "$CONTRACT_COUNT" -eq 0 ]; then
              COMPLIANCE_SCORE=$((COMPLIANCE_SCORE - 40))
              ISSUES="$ISSUES\n❌ No contract tests found"
            fi
          fi
          
          # Check for implementation without tests
          NEW_IMPL=$(git diff --name-only origin/main..HEAD | grep -E 'src/(controllers|models|routes)' | grep -v test || true)
          if [ ! -z "$NEW_IMPL" ]; then
            for file in $NEW_IMPL; do
              TEST_FILE=$(echo $file | sed 's/src/test/' | sed 's/\.js/.test.js/')
              if [ ! -f "$TEST_FILE" ]; then
                COMPLIANCE_SCORE=$((COMPLIANCE_SCORE - 10))
                ISSUES="$ISSUES\n⚠️  Implementation without test: $file"
              fi
            done
          fi
          
          echo "CONTRACT_COMPLIANCE=$COMPLIANCE_SCORE" >> $GITHUB_OUTPUT
          echo "CONTRACT_ISSUES<<EOF" >> $GITHUB_OUTPUT
          echo -e "$ISSUES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
      
      - name: 📊 Backend Coverage Analysis
        id: backend-coverage
        env:
          NODE_ENV: test
          MONGODB_URI: mongodb://localhost:27017/test_db
        run: |
          echo "📈 Roma analyzing backend test coverage..."
          cd SOURCE/backend
          
          # Run tests with coverage
          npm run test:coverage || npm test -- --coverage || {
            echo "BACKEND_COVERAGE=0" >> $GITHUB_OUTPUT
            echo "BACKEND_STATUS=failed" >> $GITHUB_OUTPUT
            exit 0
          }
          
          # Parse coverage
          if [ -f "coverage/coverage-summary.json" ]; then
            COVERAGE=$(node -e "
              const coverage = require('./coverage/coverage-summary.json');
              console.log(Math.round(coverage.total.lines.pct));
            ")
            echo "BACKEND_COVERAGE=$COVERAGE" >> $GITHUB_OUTPUT
            echo "BACKEND_STATUS=success" >> $GITHUB_OUTPUT
          else
            echo "BACKEND_COVERAGE=0" >> $GITHUB_OUTPUT
            echo "BACKEND_STATUS=no-coverage" >> $GITHUB_OUTPUT
          fi
      
      - name: 🎨 Frontend Coverage Analysis
        id: frontend-coverage
        run: |
          echo "📱 Roma analyzing frontend test coverage..."
          cd SOURCE/frontend
          
          # Run Flutter tests with coverage
          flutter test --coverage || {
            echo "FRONTEND_COVERAGE=0" >> $GITHUB_OUTPUT
            echo "FRONTEND_STATUS=failed" >> $GITHUB_OUTPUT
            exit 0
          }
          
          # Parse Flutter coverage (basic check)
          if [ -f "coverage/lcov.info" ]; then
            # Rough coverage calculation from lcov.info
            LINES_FOUND=$(grep -c "LF:" coverage/lcov.info || echo "0")
            LINES_HIT=$(grep -c "LH:" coverage/lcov.info || echo "0")
            
            if [ "$LINES_FOUND" -gt 0 ]; then
              COVERAGE=$(( (LINES_HIT * 100) / LINES_FOUND ))
            else
              COVERAGE=0
            fi
            
            echo "FRONTEND_COVERAGE=$COVERAGE" >> $GITHUB_OUTPUT
            echo "FRONTEND_STATUS=success" >> $GITHUB_OUTPUT
          else
            echo "FRONTEND_COVERAGE=0" >> $GITHUB_OUTPUT
            echo "FRONTEND_STATUS=no-coverage" >> $GITHUB_OUTPUT
          fi
      
      - name: 🧪 Integration Test Validation
        id: integration-tests
        env:
          NODE_ENV: test
          MONGODB_URI: mongodb://localhost:27017/test_db
        run: |
          echo "🔗 Roma running integration tests..."
          cd SOURCE/backend
          
          # Start server for integration tests
          npm start &
          SERVER_PID=$!
          sleep 5
          
          # Basic integration tests
          INTEGRATION_PASSED=true
          
          # Test API health
          curl -f http://localhost:8090/api/v1/health || INTEGRATION_PASSED=false
          
          # Test database connection through API
          curl -f http://localhost:8090/api/v1/projects || echo "Projects endpoint check"
          
          # Stop server
          kill $SERVER_PID || true
          
          if [ "$INTEGRATION_PASSED" = true ]; then
            echo "INTEGRATION_STATUS=passed" >> $GITHUB_OUTPUT
          else
            echo "INTEGRATION_STATUS=failed" >> $GITHUB_OUTPUT
          fi
      
      - name: 🚨 Roma's Final Verdict
        env:
          CONTRACT_COMPLIANCE: ${{ steps.contract-check.outputs.CONTRACT_COMPLIANCE }}
          CONTRACT_ISSUES: ${{ steps.contract-check.outputs.CONTRACT_ISSUES }}
          BACKEND_COVERAGE: ${{ steps.backend-coverage.outputs.BACKEND_COVERAGE }}
          BACKEND_STATUS: ${{ steps.backend-coverage.outputs.BACKEND_STATUS }}
          FRONTEND_COVERAGE: ${{ steps.frontend-coverage.outputs.FRONTEND_COVERAGE }}
          FRONTEND_STATUS: ${{ steps.frontend-coverage.outputs.FRONTEND_STATUS }}
          INTEGRATION_STATUS: ${{ steps.integration-tests.outputs.INTEGRATION_STATUS }}
        run: |
          echo "🤖 Roma's Test Enforcement Report"
          echo "================================="
          echo ""
          
          # Overall assessment
          OVERALL_PASS=true
          CRITICAL_ISSUES=""
          
          # Contract compliance
          echo "📋 Contract Compliance: $CONTRACT_COMPLIANCE%"
          if [ "$CONTRACT_COMPLIANCE" -lt 80 ]; then
            OVERALL_PASS=false
            CRITICAL_ISSUES="$CRITICAL_ISSUES\n🚨 Contract compliance below 80%"
          fi
          
          if [ ! -z "$CONTRACT_ISSUES" ]; then
            echo "Contract Issues:"
            echo -e "$CONTRACT_ISSUES"
          fi
          
          echo ""
          
          # Backend coverage
          echo "⚙️  Backend Coverage: $BACKEND_COVERAGE% (Status: $BACKEND_STATUS)"
          if [ "$BACKEND_COVERAGE" -lt 80 ] && [ "$BACKEND_STATUS" != "no-coverage" ]; then
            OVERALL_PASS=false
            CRITICAL_ISSUES="$CRITICAL_ISSUES\n🚨 Backend coverage below 80%"
          fi
          
          # Frontend coverage
          echo "🎨 Frontend Coverage: $FRONTEND_COVERAGE% (Status: $FRONTEND_STATUS)"
          if [ "$FRONTEND_COVERAGE" -lt 80 ] && [ "$FRONTEND_STATUS" != "no-coverage" ]; then
            OVERALL_PASS=false
            CRITICAL_ISSUES="$CRITICAL_ISSUES\n🚨 Frontend coverage below 80%"
          fi
          
          # Integration tests
          echo "🔗 Integration Tests: $INTEGRATION_STATUS"
          if [ "$INTEGRATION_STATUS" = "failed" ]; then
            OVERALL_PASS=false
            CRITICAL_ISSUES="$CRITICAL_ISSUES\n🚨 Integration tests failed"
          fi
          
          echo ""
          echo "📊 Roma's Assessment:"
          
          if [ "$OVERALL_PASS" = true ]; then
            echo "✅ ALL QUALITY GATES PASSED"
            echo "🚀 Ready for deployment"
          else
            echo "❌ QUALITY GATES FAILED"
            echo "🚨 Critical Issues:"
            echo -e "$CRITICAL_ISSUES"
            echo ""
            echo "🔒 BLOCKED: Fix issues before proceeding"
            exit 1
          fi
      
      - name: 💬 Comment on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          CONTRACT_COMPLIANCE: ${{ steps.contract-check.outputs.CONTRACT_COMPLIANCE }}
          BACKEND_COVERAGE: ${{ steps.backend-coverage.outputs.BACKEND_COVERAGE }}
          FRONTEND_COVERAGE: ${{ steps.frontend-coverage.outputs.FRONTEND_COVERAGE }}
          INTEGRATION_STATUS: ${{ steps.integration-tests.outputs.INTEGRATION_STATUS }}
        with:
          script: |
            const contractCompliance = process.env.CONTRACT_COMPLIANCE;
            const backendCoverage = process.env.BACKEND_COVERAGE;
            const frontendCoverage = process.env.FRONTEND_COVERAGE;
            const integrationStatus = process.env.INTEGRATION_STATUS;
            
            const overallPass = contractCompliance >= 80 && 
                               backendCoverage >= 80 && 
                               frontendCoverage >= 80 && 
                               integrationStatus === 'passed';
            
            const status = overallPass ? '✅ APPROVED' : '❌ BLOCKED';
            const emoji = overallPass ? '🚀' : '🚨';
            
            const comment = `## 🤖 Roma's Test Enforcement Report ${emoji}
            
            ### Test Coverage Analysis
            | Robot | Coverage | Status |
            |-------|----------|--------|
            | 🔧 Luc (Infrastructure) | Contract: ${contractCompliance}% | ${contractCompliance >= 80 ? '✅' : '❌'} |
            | 🗄️ Ashok (Database) | Included in Backend | ${backendCoverage >= 80 ? '✅' : '❌'} |
            | ⚙️ Reena (Backend) | ${backendCoverage}% | ${backendCoverage >= 80 ? '✅' : '❌'} |
            | 🎨 Charlie (Frontend) | ${frontendCoverage}% | ${frontendCoverage >= 80 ? '✅' : '❌'} |
            
            ### Integration Tests
            ${integrationStatus === 'passed' ? '✅' : '❌'} Integration Status: ${integrationStatus}
            
            ### Roma's Verdict: ${status}
            
            ${overallPass ? 
              '🚀 **All quality gates passed!** Ready for merge and deployment.' : 
              '🚨 **Quality gates failed!** Fix the issues above before proceeding.\n\n**Roma enforces 80% minimum coverage and passing integration tests.**'
            }
            
            ---
            *Roma's TDD-ROME enforcement ensures zero integration failures*`;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
      
      - name: 📈 Upload Coverage Reports
        uses: codecov/codecov-action@v3
        if: always()
        with:
          files: SOURCE/backend/coverage/lcov.info,SOURCE/frontend/coverage/lcov.info
          flags: backend,frontend
          name: roma-coverage-report