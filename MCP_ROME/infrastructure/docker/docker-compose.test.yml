version: '3.8'

services:
  weaviate:
    container_name: weaviate-test
    environment:
      PERSISTENCE_DATA_PATH: '/var/lib/weaviate_test'
      LOG_LEVEL: 'debug'
    volumes:
      - weaviate_test_data:/var/lib/weaviate_test
    ports:
      - "8082:8080"

  mcp-server:
    container_name: mcp-server-test
    environment:
      NODE_ENV: test
      WEAVIATE_URL: http://weaviate:8080
      TEST_MODE: 'true'
    command: npm test
    depends_on:
      - weaviate

  vector-db:
    container_name: vector-db-test
    environment:
      PERSISTENCE_DATA_PATH: '/var/lib/weaviate_test'
    volumes:
      - vector_db_test_data:/var/lib/weaviate_test
    ports:
      - "8083:8080"

volumes:
  weaviate_test_data:
    driver: local
  vector_db_test_data:
    driver: local