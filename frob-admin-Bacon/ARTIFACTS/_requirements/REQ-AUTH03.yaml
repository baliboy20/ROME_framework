ID: REQ-AUTH03
Actor: Guide
Intent: submit device-identity

Preconditions:
  - the Guide operates an issued device that asserts a device identity

Conditions:
  - the device identity must match a device registered to a guide

Postconditions:
  - the request is scoped to the guide that owns the recognised device

Outcomes:
  - Guide sees tour functions available on a recognised device
  - Guide is refused on an unrecognised device

Invariants:
  - a device identity maps to exactly one guide
  - an unrecognised device is never granted access

NonFunctional:
  Security:
    - device identity is validated on every request

Errors:
  - error: "device identity not registered"
    message: "This device isn't registered — contact the owner"
    httpCode: 403
    userAction: "Contact the owner to register the device"
  - error: "device identity missing"
    message: "This device can't be identified"
    httpCode: 400
    userAction: "Reconnect with a device that asserts an identity"

ScopeBoundary:
  InScope:
    - per-device guide recognition
  OutOfScope:
    - guide passwords
    - device self-registration

OpenQuestions:
  - question: "Is device identity alone sufficient guide authentication at v1?"
    status: RESOLVED
    resolution: "Yes at v1; revisit if devices are shared (Decision Record DR-3)."

CopilotMode: STRICT
