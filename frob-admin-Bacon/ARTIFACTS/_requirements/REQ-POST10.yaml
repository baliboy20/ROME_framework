ID: REQ-POST10
Actor: Customer
Intent: update marketing-preferences
Preconditions:
  - a signed preferences link is presented, from any retention message
Conditions:
  - preference controls are granular
  - changes take effect immediately for future sends
Postconditions:
  - marketing preferences are updated
  - a consent record is appended
Outcomes:
  - Customer sees their updated preferences confirmed
  - future sends respect the new preferences immediately
Invariants:
  - transactional messages, including booking confirmations, refunds, weather advisories, and the completed-tour thank-you, are never affected by a marketing-only unsubscribe
NonFunctional:
  Security:
    - the preference link identifies the customer without requiring login
Errors:
  - error: the signed link is expired or tampered
    message: This link has expired - request a new one.
    httpCode: 400
    userAction: Request a new preferences link, subject to rate limiting
ScopeBoundary:
  InScope:
    - granular preference management
    - unsubscribe-all
  OutOfScope:
    - a data-deletion request or erasure mechanism, deliberately not built this pass
CopilotMode: STRICT
OpenQuestions:
  - question: none
    status: RESOLVED
    resolution: GDPR retention policy stated, not built as a process this pass (DR-PT4); non-prospect erasure gap remains open and unowned outside this module
