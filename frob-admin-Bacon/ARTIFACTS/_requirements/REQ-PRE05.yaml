ID: REQ-PRE05
Actor: Owner
Intent: reply to enquiry
Preconditions:
  - An enquiry exists in open or acknowledged status
Conditions:
  - When the prospect's preferred channel is email, the reply is authored and sent from within the admin tool (DR-17, EML reintegration) — the same in-tool compose/send mechanism as REQ-NOTIF09 thread-reply — routed through the shared send() path (REQ-NOTIF01)
  - When the prospect's preferred channel is phone or WhatsApp (REQ-PRE04), the reply still happens off-system on that channel; the admin tool only records that the enquiry was responded
  - The reply addresses the specific question(s) the prospect asked, not a generic acknowledgement (BR-09)
Postconditions:
  - The enquiry moves to responded, with the response time recorded against its target
  - For an email-channel reply, a sent message is logged against the enquiry (via message/NOTIF01) and delivered to the prospect
Outcomes:
  - Prospect receives a reply addressing their specific question(s) — by email in-tool, or by their chosen off-system channel
  - Owner sees the enquiry marked responded, with response performance visible as on time or overdue
Invariants:
  - An enquiry's response time is never earlier than its creation time
  - An empty email reply is never sent — send is blocked until reply text is supplied
NonFunctional:
  Reliability:
    - Overdue enquiries remain visible until responded, never silently dropped from view
Errors:
  - error: Empty reply on the email channel
    message: Add a reply before sending.
    httpCode: 422
    userAction: Enter the reply text and resend
  - error: Off-system channel (phone/WhatsApp)
    message: Not applicable — the reply happens off-system on the prospect's chosen channel; this requirement records the status update only.
    httpCode: 200
    userAction: None
ScopeBoundary:
  InScope:
    - Authoring and sending an email-channel reply from the admin tool
    - Marking an enquiry responded on any channel
  OutOfScope:
    - Phone/WhatsApp reply content (off-system, per the prospect's channel choice — REQ-PRE04)
    - Booking-linked thread replies (REQ-NOTIF09, post-booking)
    - Automated/AI-assisted reply drafting
OpenQuestions:
  - question: None
    status: RESOLVED
    resolution: >-
      DR-17 (2026-07-26, EML reintegration): in-tool, admin-composed reply supersedes the prior
      off-system model for the email channel. Prior text ("the reply itself happens off-system;
      this requirement only covers the status update") no longer holds for email. REQ-PRE04's
      phone/WhatsApp channel options are unaffected. Source:
      _user_input/raw-requirements/EML-reintegration-handover/1-decision-record/EML_Reintegration_Analysis_2026-07-25.md §5b.
CopilotMode: STRICT
