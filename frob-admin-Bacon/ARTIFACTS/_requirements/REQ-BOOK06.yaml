ID: REQ-BOOK06
Actor: Customer
Intent: update booking
Preconditions:
  - the booking is confirmed or provisionally-confirmed
  - the modification is requested outside the cancellation cut-off
Conditions:
  - only a date or time change is self-service
  - party-size or attendee changes are not self-service and route to Owner contact instead
  - a new date/time must have available capacity for the party size
  - a price difference triggers a refund when price drops or an additional charge when price rises
Postconditions:
  - the booking's date and time are updated
Outcomes:
  - Customer sees the date change confirmed with any price difference clearly stated
  - Owner sees the modification reflected in departure capacity, with the old slot released and the new slot held
Invariants:
  - a modification never leaves two departures simultaneously holding capacity for the same booking
NonFunctional:
  Reliability:
    - capacity release-and-reacquire is atomic across the old and new departure
Errors:
  - error: requested change is within the cancellation cut-off
    message: Changes aren't available this close to departure — you can still cancel under the standard policy
  - error: the new date/time has no capacity for the party size
    message: alternatives are suggested for a date with available capacity
  - error: Customer requests a party-size or attendee change
    message: Contact William to change your party size or attendee details
ScopeBoundary:
  InScope:
    - self-service date and time changes only
  OutOfScope:
    - party-size or attendee changes, which are Owner-assisted, not this requirement
    - splitting one booking into multiple bookings
OpenQuestions:
  - question: what is the self-service booking modification depth
    status: RESOLVED
    resolution: limited to date-change self-service only; other changes route to Owner contact, closed by DR-B4
CopilotMode: STRICT
