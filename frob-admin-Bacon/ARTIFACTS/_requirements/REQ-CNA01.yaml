ID: REQ-CNA01
Actor: Prospect
Intent: submit consent-decision

Preconditions:
  - a data-capture point requests a marketing or processing permission
  - the option is not pre-selected

Conditions:
  - each decision is appended, never overwriting a prior one
  - current state is the latest decision per person and purpose

Postconditions:
  - a new immutable consent record exists with its capture source, evidence, and timestamp

Outcomes:
  - Prospect sees their choice recorded and honoured
  - Owner can later prove the exact consent state at any past time

Invariants:
  - a consent record is never updated or deleted
  - a marketing permission is never pre-granted; default is withheld

NonFunctional:
  Security:
    - the capturing source and hashed evidence are stored with every decision

Errors:
  - error: "no contact detail identifies the prospect"
    message: "We need a contact detail to record your choice"
    httpCode: 400
    userAction: "Provide an email address or phone number"
  - error: "capture source not supplied"
    message: "Your choice could not be recorded"
    httpCode: 400
    userAction: "Resubmit the consent decision"

ScopeBoundary:
  InScope:
    - append-only capture of marketing or processing consent with evidence
  OutOfScope:
    - cookie-banner presentation
    - preference-centre design

OpenQuestions:
  - question: "Should consent and audit be one merged ledger or two related tables?"
    status: RESOLVED
    resolution: "Keep consents as-is plus a new separate audit_log; one module, two tables (Decision Record DR-5)."

CopilotMode: STRICT
