ID: REQ-CNA04
Actor: SystemDataRetentionScheduler
Intent: delete personal-data

Preconditions:
  - a person's record has been dormant beyond the 90-day retention window

Conditions:
  - personal fields are irreversibly blanked while the row is retained for referential integrity

Postconditions:
  - the record holds no personal data
  - the erasure is itself audited

Outcomes:
  - Owner can show that dormant personal data is erased on schedule
  - related records remain internally consistent after erasure

Invariants:
  - erasure is irreversible
  - the row is never removed, only its personal fields cleared
  - every erasure is audited

NonFunctional:
  Security:
    - erasure runs on schedule without operator action
  Reliability:
    - erasure only affects records confirmed dormant beyond the retention window

Errors:
  - error: "record shows recent activity"
    message: "Record is not yet eligible for erasure"
    httpCode: 200
    userAction: "No action needed — record retained until dormant"

ScopeBoundary:
  InScope:
    - 90-day anonymisation of dormant prospect personal data
  OutOfScope:
    - non-prospect entities
    - on-demand right-to-be-forgotten requests

OpenQuestions:
  - question: "Should PII erasure extend to non-prospect entities (bookings/participants)?"
    status: RESOLVED
    resolution: "Deferred; v1 covers prospects only, interim default is retain and never auto-erase non-prospect entities until designed (Decision Record DR-7)."

CopilotMode: STRICT
