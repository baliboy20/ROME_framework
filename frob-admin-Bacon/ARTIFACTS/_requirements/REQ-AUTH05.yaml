ID: REQ-AUTH05
Actor: SystemSessionGuard
Intent: delete session

Preconditions:
  - an authenticated actor (Owner or Customer) has requested sign-out
  - an active session (operator or booking) exists

Conditions:
  - sign-out is explicit, initiated by the actor
  - the session record is removed immediately

Postconditions:
  - the session no longer grants access
  - a subsequent request under its token is treated as unauthenticated

Outcomes:
  - the Owner or Customer sees they have been signed out
  - the deleted session's token grants no further access

Invariants:
  - a deleted session never regains access
  - deletion takes effect immediately, not on the next expiry check

NonFunctional:
  Security:
    - the session record is removed immediately, not by a delayed sweep

Errors:
  - error: "no active session to delete"
    message: "You are already signed out"
    httpCode: 200
    userAction: "No action needed — proceed as signed out"

ScopeBoundary:
  InScope:
    - actor-initiated end of one's own current session
  OutOfScope:
    - deleting another actor's session
    - bulk or administrative sign-out

OpenQuestions:
  - question: "Is session revocation (logout) required at v1?"
    status: RESOLVED
    resolution: "Yes, required at v1 (Decision Record DR-4)."

CopilotMode: STRICT
