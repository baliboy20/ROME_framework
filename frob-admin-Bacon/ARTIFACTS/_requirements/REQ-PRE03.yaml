ID: REQ-PRE03
Actor: Prospect
Intent: search availability
Preconditions:
  - A tour is selected
Conditions:
  - Party size does not exceed 10
  - Results reflect the remaining capacity at the moment it is checked
Postconditions:
  - The Prospect sees which dates and times have space for their party size
Outcomes:
  - Prospect knows whether their preferred date works before committing to book
  - Prospect is offered alternatives if their first choice is unavailable
Invariants:
  - Availability shown never exceeds the tour's actual remaining capacity
NonFunctional:
  Reliability:
    - Availability reflects capacity as of the moment it is checked
    - A hold acquired downstream is the booking module's own concern, not this requirement's
Errors:
  - error: All slots on the selected date are fully booked
    message: No space on this date. Here are the next three available dates.
    httpCode: 200
    userAction: Choose one of the suggested alternative dates
  - error: Party size exceeds 10
    message: Party sizes above 10 need a group enquiry instead of direct availability search.
    httpCode: 422
    userAction: Submit a group enquiry
ScopeBoundary:
  InScope:
    - Read-only availability check by date and party size
  OutOfScope:
    - Acquiring a hold on a slot
OpenQuestions:
  - question: None
    status: RESOLVED
    resolution: No open questions for this requirement
CopilotMode: STRICT
