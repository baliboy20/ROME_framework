ID: REQ-PRE08
Actor: Prospect
Intent: create booking-handover
Preconditions:
  - A tour is selected
Conditions:
  - All context known so far, including tour, date, time, party size, and prospect email if captured, is carried into the handover
Postconditions:
  - A booking-flow session begins pre-filled with known context
  - Pre-Sales' part is complete
Outcomes:
  - Prospect enters the booking flow with maximum context pre-filled, with no re-entry of what is already known
Invariants:
  - Pre-Sales never processes payment or creates a booking itself — the handover is a pre-fill, not a transaction
NonFunctional:
  Reliability:
    - Pre-filled context is accurate as of the moment of handover
Errors:
  - error: None declared
    message: Not applicable — this is a handover, not a terminal action with its own failure modes.
    httpCode: 200
    userAction: None
ScopeBoundary:
  InScope:
    - Context handover into the booking module
  OutOfScope:
    - Anything after the handover, owned entirely by the booking module
OpenQuestions:
  - question: None
    status: RESOLVED
    resolution: No open questions for this requirement
CopilotMode: STRICT
