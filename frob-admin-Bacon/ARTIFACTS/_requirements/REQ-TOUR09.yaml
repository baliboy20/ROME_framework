ID: REQ-TOUR09
Actor: Customer
Intent: submit late-arrival-notice
Preconditions:
  - today is tour day
  - the tour hasn't started
  - the current time is within the configured late-arrival window
Conditions:
  - the notice includes an estimated arrival time and optional brief context
Postconditions:
  - the Guide and Owner are notified of the expected late arrival
Outcomes:
  - Guide knows to expect a late arrival and can decide whether to hold
Invariants:
  - a late-arrival notice never overrides a no-show recorded after the grace period has passed
NonFunctional:
  Reliability:
    - the notification reaches the Guide before the tour proceeds without the Customer, wherever possible
Errors:
  - error: the Customer cannot reach this surface, for example due to a phone issue
    message: Contact the Owner directly using the phone number on your booking confirmation.
    httpCode: 200
    userAction: Call the Owner's documented fallback phone number
ScopeBoundary:
  InScope:
    - late-arrival notification
  OutOfScope:
    - the Guide's hold or proceed decision itself
OpenQuestions:
  - question: none
    status: RESOLVED
    resolution: "D-TOUR-6 closed: configurable grace period per tour; D-TOUR-7 closed: FOB ops number as day-of contact mechanism"
CopilotMode: STRICT
