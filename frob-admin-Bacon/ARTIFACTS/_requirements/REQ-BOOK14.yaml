ID: REQ-BOOK14
Actor: Owner
Intent: create bike-assignment
Preconditions:
  - a departure exists
  - one or more bikes exist
Conditions:
  - a bike may be assigned only if it is in-service and route-eligible for the departure's tour
  - a bike may not already be assigned to another departure overlapping in time
  - the number of bikes assigned should meet the departure's booked party size
Postconditions:
  - the named bikes are recorded as assigned to the departure, ready for the guide's pre-tour inspection
Outcomes:
  - Owner sees which specific bikes are allocated to the tour-day
  - Guide finds those bikes already assigned when starting the pre-tour bike inspection
Invariants:
  - only an in-service bike is ever assigned
  - a bike is never assigned to two departures overlapping in time
NonFunctional:
  Reliability:
    - assignment reflects live bike status at assignment time
Errors:
  - error: a chosen bike is flagged or out-of-service
    message: FOB-00X is out of service — choose another
  - error: a chosen bike is already assigned to an overlapping departure
    message: FOB-00X is already out on another tour at that time
  - error: fewer bikes assigned than booked riders
    message: the assignment is allowed but the departure is flagged under-provisioned until resolved
ScopeBoundary:
  InScope:
    - manual assignment of specific in-service bikes to a departure
  OutOfScope:
    - automated assignment or rotation
OpenQuestions:
  - question: which module owns the bike-assignment record
    status: RESOLVED
    resolution: booking owns bike_assignments, closed by DR-BO2a
CopilotMode: STRICT
