ID: REQ-NOTIF02
Actor: SystemNotificationDispatcher
Intent: update deliverability-state

Preconditions:
  - the delivery provider reports an outcome (delivered, bounced, complaint) for a prior message

Conditions:
  - the outcome is matched to the message by its provider reference

Postconditions:
  - the person's deliverability state reflects the latest provider outcome

Outcomes:
  - Owner sees which addresses are bouncing or complaining
  - future sends avoid an address known to hard-bounce

Invariants:
  - deliverability state reflects the most recent provider outcome for an address

NonFunctional:
  Reliability:
    - provider callbacks are processed idempotently

Errors:
  - error: "outcome references an unknown message"
    message: "The delivery outcome could not be matched and was flagged for review"
    httpCode: 200
    userAction: "Owner should review the unmatched delivery event"

ScopeBoundary:
  InScope:
    - delivery, bounce, and complaint ingestion and suppression
  OutOfScope:
    - provider-side reputation management

OpenQuestions: []

CopilotMode: STRICT
