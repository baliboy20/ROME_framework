ID: REQ-BOOK07
Actor: Customer
Intent: cancel booking
Preconditions:
  - the booking is confirmed or provisionally-confirmed
Conditions:
  - more than 48 hours before departure, a full refund is issued automatically
  - within 48 hours of departure, the refund amount is decided manually by the Owner, case-by-case, not calculated by the system
  - a provisionally-confirmed, unpaid booking has no refund to process
Postconditions:
  - the booking is cancelled
  - held or confirmed capacity is restored to the departure
Outcomes:
  - Customer sees the cancellation confirmed with the applicable refund amount, or none if unpaid, or a note that William will confirm the refund within 48 hours
  - Owner sees the departure's capacity restored
Invariants:
  - departure capacity restored on cancellation never exceeds what the booking originally held
  - a refund never exceeds the amount paid
NonFunctional:
  Reliability:
    - capacity restoration is not blocked by a refund-provider failure
Errors:
  - error: refund fails at the payment provider
    message: We couldn't process the refund — William will follow up within one business day
ScopeBoundary:
  InScope:
    - self-service cancellation
    - automatic full refund when more than 48 hours before departure
    - Owner-decided refund within 48 hours of departure
  OutOfScope:
    - partial cancellation of individual attendees, which routes to REQ-BOOK06 instead
    - an automated within-48-hour refund calculation, deliberately not built
OpenQuestions:
  - question: what is the cancellation policy within 48 hours of departure
    status: RESOLVED
    resolution: no automated rule; the Owner decides manually, case-by-case, closed by DR-B5
CopilotMode: STRICT
