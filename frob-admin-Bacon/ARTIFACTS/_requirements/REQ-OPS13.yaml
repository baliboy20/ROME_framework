ID: REQ-OPS13

Actor: Guide

Intent: submit hazard-observation

Preconditions:
  - a new hazard is observed during a tour or noted in the ride-completion review

Conditions:
  - the observation records street or location, hazard type, description, severity, and date observed

Postconditions:
  - a hazard-log entry exists in pending-review status

Outcomes:
  - Owner has a new hazard observation to review

Invariants:
  - a hazard observation is never lost between submission and Owner review

NonFunctional:
  Reliability:
    - the observation captures the Guide's location at the time observed

Errors: []

ScopeBoundary:
  InScope:
    - hazard observation submission
  OutOfScope:
    - photo capture
    - approval into the log

OpenQuestions: []

CopilotMode: STRICT
