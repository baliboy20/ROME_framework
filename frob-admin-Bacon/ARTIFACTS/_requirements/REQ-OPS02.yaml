ID: REQ-OPS02

Actor: Guide

Intent: submit kit-check

Preconditions:
  - the tour assignment has been reviewed

Conditions:
  - required quantities are derived from party size, season, and forecast
  - critical items, including first aid, phone charge, hi-vis for participants, and ponchos, must be confirmed present before sign-off
  - conditional items such as gloves in warm weather may be skipped with a note

Postconditions:
  - the kit check is signed off, or blocked pending resolution

Outcomes:
  - Guide has a recorded, timestamped confirmation that required kit is packed

Invariants:
  - the kit check is never signed off with a missing critical item

NonFunctional:
  Security:
    - the sign-off is recorded with a timestamp and the Guide's identity

Errors:
  - error: "a critical item is missing"
    message: "A critical kit item is missing. Sign-off is blocked until this is resolved."
    httpCode: 409
    userAction: "Locate or replace the missing critical item before signing off"
  - error: "partial packing of a required quantity"
    message: "A required item quantity is incomplete. Add a note and get Owner approval, or resolve before signing off."
    httpCode: 409
    userAction: "Resolve the shortfall or add a note with Owner approval"

ScopeBoundary:
  InScope:
    - kit-item confirmation
    - sign-off
  OutOfScope:
    - procuring missing kit

OpenQuestions: []

CopilotMode: STRICT
