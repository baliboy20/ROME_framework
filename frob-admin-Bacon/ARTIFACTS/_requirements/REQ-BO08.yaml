ID: REQ-BO08
Actor: Owner
Intent: configure operational settings
Preconditions:
  - an operator session is active
  - the singleton operator_settings record exists (created by migration; never absent)
Conditions:
  - settings are grouped into tabs so the surface can grow without becoming one long list
  - an "About" tab shows the application version, read from the running application itself so it cannot disagree with what was actually installed
  - a "Notifications" tab holds when-to-send configuration and which pre-departure reminders fire
  - the Owner chooses whether the booking confirmation is sent AUTOMATICALLY (the moment the payment outcome is known) or MANUALLY (the Owner sends it from the booking record). Both use the same template and produce the same content for the customer
  - a "Booking policy" tab holds the default deposit amount offered when the Owner takes a booking, the cancellation refund cutoff, and the remediation options offerable on a business cancellation
  - the default deposit is held in pence (TDR-04) and may be zero, meaning no default is offered and the Owner enters an amount per booking
  - changes take effect immediately for subsequent operations; no release or restart is required
Postconditions:
  - the operator_settings record reflects the saved values and records when it was updated
  - subsequent booking outcomes honour the reply mode in force at the moment the outcome is determined
Outcomes:
  - the Owner can see which version they are running when reporting a problem
  - the Owner can hold back booking confirmations to review them, without any customer being left uninformed
  - the Owner can set a house-standard deposit once rather than re-entering it per booking
Invariants:
  - THERE IS NO SETTING THAT PREVENTS A BOOKING CONFIRMATION BEING SENT. Reply mode governs
    WHEN it is sent, never WHETHER. A customer who has paid is always told. This preserves
    REQ-NOTIF11's guarantee and UXC-FBK-1's two-channel rule, which an on/off switch would repeal.
  - a transactional notification is presented in the interface as configurable (wording, timing),
    never as something with an off switch — so the constraint reads as deliberate rather than as
    a broken control
  - if the settings record cannot be read, the system behaves as though reply mode were
    AUTOMATIC — a failure to read configuration must never be the reason a paying customer
    hears nothing
  - a default deposit never exceeds the booking total
NonFunctional: {}
Errors:
  - error: a submitted value is outside its permitted range (e.g. an unrecognised reply mode)
    message: (validation message naming the offending field)
    httpCode: 422
    userAction: Correct the value and save again
ScopeBoundary:
  InScope:
    - version display; reply mode (automatic/manual); default deposit; reminder milestones;
      refund cutoff; cancellation remediation options
    - the tab structure itself, so further settings can be added as they arise
  OutOfScope:
    - switching any transactional notification off (excluded by invariant, sponsor-decided)
    - per-tour or per-departure deposit rules — the default is business-wide; an individual
      booking may still differ
    - operator account management; there is one operator (see REQ-AUTH01)
    - additional tabs beyond About and Notifications/Booking policy — none are speculated into
      existence for settings with no stated purpose
OpenQuestions:
  - question: should the default deposit be a flat amount or a percentage of the tour price?
    status: OPEN
    resolution: >-
      Built as a FLAT amount in pence, matching the sponsor's wording ("pay deposit, amount
      configurable in setting"). Because tour prices differ, a percentage may suit the business
      better; this is a single-column change. Raised rather than assumed.
  - question: none (provenance)
    status: RESOLVED
    resolution: >-
      Sponsor-requested 2026-07-27 (settings page holding app version and workflow configuration,
      with tabs for further settings as they arise) and clarified 2026-07-29 ("auto reply is
      configurable, auto/manual"), which resolved the conflict between the requested switch and
      REQ-NOTIF11's guarantee. Admitted through FR-001 workstream 3. Source:
      ARTIFACTS/changes/FR-001-admin-console-on-mac-PROPOSAL.md.
CopilotMode: STRICT
