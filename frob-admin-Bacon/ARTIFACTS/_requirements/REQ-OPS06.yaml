ID: REQ-OPS06

Actor: Guide

Intent: submit briefing-confirmation

Preconditions:
  - all riders are checked in and cleared

Conditions:
  - all six briefing sections are delivered
  - day-specific mitigations tagged during the risk assessment are shown inline at the relevant section

Postconditions:
  - the briefing is confirmed delivered, with questions addressed

Outcomes:
  - Guide has a recorded, timestamped confirmation that the full briefing was delivered

Invariants:
  - the briefing confirmation is never signed while the group present hasn't heard every section

NonFunctional:
  Reliability:
    - day-specific mitigations shown are exactly those tagged in the risk assessment, never stale

Errors:
  - error: "a rider raises an issue requiring action mid-briefing"
    message: "An issue was raised during the briefing, such as an ill-fitting helmet. The briefing has paused."
    httpCode: 409
    userAction: "Resolve the issue, then resume the briefing"
  - error: "a rider refuses to acknowledge a required rule"
    message: "This rider declined to acknowledge a required rule and has been refused."
    httpCode: 409
    userAction: "Record the refusal via the check-in refusal path"

ScopeBoundary:
  InScope:
    - briefing delivery confirmation
  OutOfScope:
    - the briefing script's content itself

OpenQuestions: []

CopilotMode: STRICT
