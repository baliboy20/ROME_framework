ID: REQ-TOUR05
Actor: System
Intent: submit change-notice
Preconditions:
  - the Owner has edited a confirmed booking's meeting point, time, or guide
Conditions:
  - the notice states old versus new explicitly
  - a material change to time, day, or meeting point requires explicit acknowledgement
  - a guide-only change is informational and requests no acknowledgement
Postconditions:
  - the notice is sent via every relevant channel
  - if material, an acknowledgement is now pending
Outcomes:
  - Customer receives a clear old-versus-new comparison of what changed
Invariants:
  - a pending material-change acknowledgement is never silently dropped
NonFunctional:
  Reliability:
    - the same booking never has one channel succeed and another silently fail without the Owner knowing
Errors:
  - error: the change occurs within 24 hours of the tour
    message: This change notice was escalated to urgent delivery across every available channel.
    httpCode: 200
    userAction: No action needed; delivery urgency has been escalated automatically
ScopeBoundary:
  InScope:
    - operator-change notification
  OutOfScope:
    - the acknowledgement itself
OpenQuestions:
  - question: none
    status: RESOLVED
    resolution: No open questions for this requirement
CopilotMode: STRICT
