ID: REQ-BO05
Actor: Owner
Intent: search bookings
Preconditions:
  - Owner is in an operator session
Conditions:
  - bookings are searchable by booking reference, customer name or email, tour, departure date, and status
Postconditions:
  - none, this is a read-only view
Outcomes:
  - Owner finds any booking by reference, customer, tour, date, or status
Invariants:
  - results never include customer payment-card data, only provider references
NonFunctional:
  Security:
    - card data is never exposed in search results
Errors:
  - error: no bookings match the search criteria
    message: No bookings match these criteria.
    httpCode: 200
    userAction: Adjust the search criteria
ScopeBoundary:
  InScope:
    - search and filter across bookings
  OutOfScope:
    - cross-customer analytics or reporting, a separate concern
CopilotMode: STRICT
OpenQuestions:
  - question: none
    status: RESOLVED
    resolution: No open questions for this requirement
