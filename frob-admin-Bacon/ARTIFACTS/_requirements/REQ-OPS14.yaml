ID: REQ-OPS14

Actor: Owner

Intent: approve hazard-log-entry

Preconditions:
  - a hazard observation exists in pending-review status

Conditions:
  - the Owner deduplicates against existing entries on the same street, sets severity, and decides control measures

Postconditions:
  - the hazard is approved into the route hazard log, or the existing entry's last-confirmed date is bumped if it's a duplicate

Outcomes:
  - future tours are forewarned of the hazard
  - a high-severity or briefing-relevant hazard updates the relevant briefing content

Invariants:
  - the hazard log never contains two separate entries for the same observed hazard on the same street

NonFunctional:
  Reliability:
    - an approved, location-bound hazard becomes available to the navigation journey's proximity-alert mechanism

Errors: []

ScopeBoundary:
  InScope:
    - hazard review
    - deduplication
    - approval
  OutOfScope:
    - the navigation journey's proximity-alert mechanism itself

OpenQuestions: []

CopilotMode: STRICT
