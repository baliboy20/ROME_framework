ID: REQ-BOOK01
Actor: Customer
Intent: create booking-selection
Preconditions:
  - a departure exists, scheduled via REQ-BOOK11, with available capacity for the requested party size
Conditions:
  - party size does not exceed the departure's remaining capacity, a maximum of 10 per departure
  - a slot hold is acquired for the duration of the selection-through-payment flow
Postconditions:
  - a booking draft exists in the draft state
  - the departure's available capacity is reduced by the held party size
Outcomes:
  - Customer sees their selection confirmed and proceeds to provide attendee details
  - Owner never sees a departure oversold beyond its capacity
Invariants:
  - a departure's held-plus-confirmed capacity never exceeds its maximum
  - a slot hold is time-bounded
NonFunctional:
  Reliability:
    - capacity checks and the hold are applied atomically so no race occurs between two customers over the same last space
Errors:
  - error: requested party size exceeds remaining capacity
    message: This slot doesn't have enough space — try a smaller group or another date
  - error: departure has no remaining capacity
    message: This slot is no longer available — please choose another
ScopeBoundary:
  InScope:
    - tour, date, and party-size selection producing a held draft
  OutOfScope:
    - multi-tour cart
    - partial-tour selection
OpenQuestions:
  - question: what mechanism guards the slot hold against concurrent capacity requests
    status: RESOLVED
    resolution: a single atomic capacity decrement guards the hold, closed by DR-B3
CopilotMode: STRICT
