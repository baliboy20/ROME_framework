ID: REQ-PRE02
Actor: Prospect
Intent: view tour-detail
Preconditions:
  - The requested tour exists
Conditions:
  - Detail includes route, waypoint, and guide content only when the tour is published
  - A paused tour shows its status instead of a book action
Postconditions:
  - The Prospect sees complete tour detail appropriate to its current status
Outcomes:
  - Prospect has enough information to decide to book, ask a question, save, or move on
Invariants:
  - A paused tour never offers a direct booking route
NonFunctional:
  Reliability:
    - Detail content matches the current published state, not a stale cache
Errors:
  - error: Tour is paused
    message: This tour is currently paused and not available to book. You can still submit an enquiry.
    httpCode: 200
    userAction: Submit an enquiry instead of booking
  - error: Tour does not exist
    message: This tour could not be found. Similar tours are suggested below.
    httpCode: 404
    userAction: Browse the suggested similar tours
ScopeBoundary:
  InScope:
    - Full tour detail including route, waypoints, and guide biography
  OutOfScope:
    - Real-time crowding or weather overlays
OpenQuestions:
  - question: None
    status: RESOLVED
    resolution: No open questions for this requirement
CopilotMode: STRICT
