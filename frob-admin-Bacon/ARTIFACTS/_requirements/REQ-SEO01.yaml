ID: REQ-SEO01
Actor: SystemContentPublisher
Intent: export tour-content

Preconditions:
  - a tour has published catalogue content

Conditions:
  - the content is emitted so a search crawler can read it without executing scripts, including machine-readable descriptors

Postconditions:
  - the public tour location serves complete, crawler-readable content

Outcomes:
  - a search crawler obtains the full tour content and descriptors without running scripts
  - Prospect finds the tour through a search engine

Invariants:
  - crawler-readable content matches the published catalogue content

NonFunctional:
  Performance:
    - primary content is available on first load

Errors:
  - error: "tour content incomplete (missing title or description)"
    message: "This tour listing is incomplete and has been flagged for review"
    httpCode: 200
    userAction: "Owner should complete the missing tour content"

ScopeBoundary:
  InScope:
    - crawler-readable tour and marketing content with descriptors
  OutOfScope:
    - paid search placement
    - travel-agency feeds
    - authenticated locations

OpenQuestions:
  - question: "What content-type scope applies to machine-readable descriptors?"
    status: RESOLVED
    resolution: "Tourist-attraction and local-business types at v1; product type reserved for gift vouchers; event type excluded (Decision Record DR-9)."

CopilotMode: STRICT
