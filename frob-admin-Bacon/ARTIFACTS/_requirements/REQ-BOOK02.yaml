ID: REQ-BOOK02
Actor: Customer
Intent: submit attendee-details
Preconditions:
  - a booking draft exists with an active slot hold
Conditions:
  - one attendee record is captured per party member
  - exactly one attendee is the party's contact_role "leader" (main point of contact); any number may be "co-leader" (additional points of contact); the rest are plain "attendee"
  - a single emergency contact is captured for the whole booking, not per attendee
Postconditions:
  - the booking draft holds complete attendee and emergency-contact data, with exactly one attendee marked "leader"
Outcomes:
  - Customer proceeds to the consent step with their party's details recorded
  - Guide can later reference the emergency-contact details if needed on tour
  - Owner can later contact the leader or any co-leader as the party's points of contact
Invariants:
  - a booking draft is never advanced to the consent step with incomplete attendee data or with anything other than exactly one "leader"
NonFunctional:
  Reliability:
    - the customer's in-progress entry survives an interruption caused by the slot hold expiring
Errors:
  - error: a required attendee field is missing
    message: Please complete the missing attendee details before continuing
  - error: the slot hold expires before submission completes
    message: Your hold has expired — please re-confirm your slot to continue
  - error: zero or more than one attendee marked "leader"
    message: exactly one leader is required
ScopeBoundary:
  InScope:
    - attendee and emergency-contact capture for an existing draft
    - leader/co-leader contact_role assignment
  OutOfScope:
    - per-attendee emergency contacts
CopilotMode: STRICT
OpenQuestions:
  - question: is emergency-contact depth per-booking or per-attendee
    status: RESOLVED
    resolution: one emergency contact per booking covering the whole party, closed by DR-B6
  - question: does a booking party support more than one customer point of contact
    status: RESOLVED
    resolution: "contact_role enum (leader | co-leader | attendee) replaces the boolean is_lead_booker; exactly one leader, any number of co-leaders, closed by DR-B12a"
