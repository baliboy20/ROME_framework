ID: REQ-AUTH01
Actor: Owner
Intent: create operator-session

Preconditions:
  - Owner presents valid credentials
  - no active operator session is required beforehand

Conditions:
  - session lifetime is 1 hour
  - the session is stored server-side keyed by its token

Postconditions:
  - an active operator session exists for the Owner for up to 1 hour

Outcomes:
  - Owner sees they are signed in and can reach operator functions
  - Owner's subsequent actions are attributed to their identity in the audit record

Invariants:
  - an operator session never outlives its 1-hour lifetime
  - a session token identifies exactly one operator

NonFunctional:
  Security:
    - session tokens expire after 1 hour
    - credentials are never stored in the session record
  Reliability:
    - sign-in is unavailable rather than silently degraded when the session store cannot be reached

Errors:
  - error: "credentials invalid"
    message: "Sign-in failed — check your details"
    httpCode: 401
    userAction: "Re-enter credentials and try again"
  - error: "session store unavailable"
    message: "Sign-in is temporarily unavailable — try again"
    httpCode: 503
    userAction: "Wait and retry sign-in"

ScopeBoundary:
  InScope:
    - credential sign-in producing a time-boxed operator session
  OutOfScope:
    - single sign-on
    - multi-factor authentication
    - password reset

OpenQuestions:
  - question: "Which booking-site source is canonical for session token issuance?"
    status: RESOLVED
    resolution: "admin-rome is canonical (Decision Record DR-1)."

CopilotMode: STRICT
