ID: REQ-AUTH02
Actor: Customer
Intent: create booking-session

Preconditions:
  - a valid, unexpired signed link for an existing booking is presented

Conditions:
  - the link identifies exactly one booking
  - session lifetime is 1 hour

Postconditions:
  - an active booking session exists scoped to that one booking

Outcomes:
  - Customer sees their booking without entering a password
  - Customer can act only on the booking the link identified

Invariants:
  - a booking session grants access to exactly one booking
  - a signed link admits a session only within its validity window

NonFunctional:
  Security:
    - signed links are single-purpose and time-limited

Errors:
  - error: "link expired"
    message: "This link has expired — request a new one"
    httpCode: 401
    userAction: "Request a new signed link"
  - error: "link invalid or tampered"
    message: "This link isn't valid"
    httpCode: 401
    userAction: "Request a new signed link"
  - error: "booking not found"
    message: "We couldn't find that booking"
    httpCode: 404
    userAction: "Contact the operator for assistance"

ScopeBoundary:
  InScope:
    - passwordless booking access via signed link
  OutOfScope:
    - full customer accounts
    - cross-booking access

OpenQuestions:
  - question: "Should signed-link sessions be stateless or revocable?"
    status: RESOLVED
    resolution: "Sessions are token-plus-store based to allow revocation (Decision Record DR-2)."

CopilotMode: STRICT
