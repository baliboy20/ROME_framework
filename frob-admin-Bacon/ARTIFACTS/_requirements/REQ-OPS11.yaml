ID: REQ-OPS11

Actor: Guide

Intent: submit incident-report

Preconditions:
  - a preliminary incident record exists, or an incident was flagged in the ride-completion review

Conditions:
  - the report includes full narrative, injury nature, third parties, emergency services involved, hospital, witnesses, and actions taken after the incident

Postconditions:
  - the formal report is submitted to the Owner

Outcomes:
  - Owner has a complete formal report to review and dispatch

Invariants:
  - a formal report is never submitted without linking back to its originating incident record

NonFunctional:
  Reliability:
    - the report is available to the Owner within the 24-hour insurer-notification window

Errors:
  - error: "submission occurs beyond the statutory window"
    message: "This report was submitted more than 2 hours after the incident. It has been logged as a process exception for Owner attention."
    httpCode: 409
    userAction: "Review the process exception with the Owner"

ScopeBoundary:
  InScope:
    - formal incident narrative
    - submission to Owner
  OutOfScope:
    - insurer dispatch itself

OpenQuestions:
  - question: "What incident-report format does the PLI insurer require?"
    status: OPEN
    resolution: "Deferred and stubbed with a conservative internal record until the insurer's required format is supplied; blocks finalising the report's exact field set for insurer dispatch."

CopilotMode: STRICT
