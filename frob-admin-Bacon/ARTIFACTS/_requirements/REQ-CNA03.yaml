ID: REQ-CNA03
Actor: SystemAuditRecorder
Intent: submit audit-entry

Preconditions:
  - a money- or safety-critical action has occurred (refund, consent change, owner override, incident)

Conditions:
  - audit entries are append-only and reference the subject and the acting identity

Postconditions:
  - an immutable audit entry records what happened, to what, by whom, and when

Outcomes:
  - Owner can reconstruct the sequence of money- and safety-critical actions

Invariants:
  - an audit entry is never modified or deleted

NonFunctional:
  Security:
    - audit entries are tamper-evident and retained independently of the audited record

Errors:
  - error: "subject or acting identity missing"
    message: "The audit entry was recorded with incomplete detail"
    httpCode: 200
    userAction: "Owner should review the flagged entry for missing detail"

ScopeBoundary:
  InScope:
    - append-only audit of refunds, consent changes, overrides, and incidents
  OutOfScope:
    - general application logging
    - analytics events

OpenQuestions:
  - question: "What is the detailed structure of the audit entry?"
    status: RESOLVED
    resolution: "Detailed structure deferred to Stage 6a design; this requirement's scope (append-only, immutable, subject/actor/timestamp) is settled (Decision Record DR-6)."

CopilotMode: STRICT
