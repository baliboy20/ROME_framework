ID: REQ-POST03
Actor: Customer
Intent: submit feedback
Preconditions:
  - a completed booking exists
  - the booking is accessible by booking reference and email, or by a link from the thank-you or review-request message
Conditions:
  - ratings are captured for overall, guide, value, and would-recommend
  - optional free text may be included
  - a rating of 3 stars or below overall alerts the Owner directly
Postconditions:
  - the feedback is stored
  - the Owner is alerted if the overall rating is 3 stars or below
Outcomes:
  - Customer sees a confirmation of their feedback
  - Owner is alerted immediately for a low rating, with full context, to follow up personally
Invariants:
  - a rating of 3 stars or below always alerts the Owner
  - the alert is never delayed or batched
NonFunctional:
  Reliability:
    - the rating threshold check never silently misses a 3-star-or-below submission
Errors:
  - error: none declared
    message: Every rating and any accompanying text is accepted as submitted.
    httpCode: 200
    userAction: No action needed
ScopeBoundary:
  InScope:
    - rating and free-text capture
    - Owner alert on a low rating
  OutOfScope:
    - formal recovery-contact logging (deferred to a future phase)
    - public review monitoring (deferred to a future phase)
    - testimonial consent handling (deferred to a future phase)
CopilotMode: STRICT
OpenQuestions:
  - question: none
    status: RESOLVED
    resolution: D-POST-1 closed inline - rating threshold only (DR-PT2)
