ID: REQ-NOTIF07
Actor: Owner
Intent: link email-thread
Preconditions:
  - an email_thread exists categorised unlinked or ambiguous
Conditions:
  - the Owner selects the correct Booking/Enquiry (or, for ambiguous, picks from the recorded candidates or searches for a different one)
Postconditions:
  - the email_thread's categorisation is set to linked, with the chosen Booking/Enquiry recorded
Outcomes:
  - Owner sees the thread move out of the unlinked/ambiguous filter in search (REQ-NOTIF06)
  - Owner can find this thread going forward by the Booking/Enquiry it is now linked to
Invariants:
  - manual linking never auto-applies to other threads from the same sender — each thread is resolved individually
NonFunctional: {}
Errors:
  - error: Link attempted with no Booking/Enquiry selected
    message: Select a booking or enquiry to link this thread to.
    httpCode: 422
    userAction: Choose a booking or enquiry, then link
ScopeBoundary:
  InScope:
    - manually setting or correcting a thread's Booking/Enquiry link
  OutOfScope:
    - the automated cascade itself (REQ-NOTIF05)
    - re-running the cascade after a manual override
OpenQuestions:
  - question: none
    status: RESOLVED
    resolution: >-
      Genuinely new (EML reintegration §3), from REQ-EML14. Source:
      EML-reintegration-handover/2-eml-spec/EML.md REQ-EML14.
CopilotMode: STRICT
