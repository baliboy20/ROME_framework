ID: REQ-NOTIF01
Actor: SystemNotificationDispatcher
Intent: submit transactional-message

Preconditions:
  - a transactional trigger has fired (booking confirmed, reminder due) for a person with a contact address

Conditions:
  - each trigger produces one message per person per event, carrying an idempotency key

Postconditions:
  - the message is handed to the delivery provider once and logged with its idempotency key

Outcomes:
  - Customer receives the confirmation or reminder for their booking
  - Owner can see the message was sent

Invariants:
  - a transactional message is not gated by marketing consent
  - one event yields at most one message per person

NonFunctional:
  Reliability:
    - a transient provider failure does not duplicate a message

Errors:
  - error: "no contact address on record"
    message: "The message could not be sent — no contact address on file"
    httpCode: 422
    userAction: "Owner should add a contact address for the recipient"
  - error: "delivery provider rejects the send"
    message: "Delivery pending"
    httpCode: 202
    userAction: "No action needed — retry is automatic per provider policy"

ScopeBoundary:
  InScope:
    - one-shot transactional email, and SMS or messaging where opted in
  OutOfScope:
    - batched sends
    - marketing campaigns

OpenQuestions:
  - question: "Should transactional messages route through an orchestration layer or send directly?"
    status: RESOLVED
    resolution: "Interim default: native direct integration, proof-of-concept validated, no orchestration-layer dependency locked in; revisit at a later stage (Decision Record, still-open item D-NOTIF-1, interim default confirmed)."
  - question: "Which delivery provider is canonical for transactional email?"
    status: RESOLVED
    resolution: "Interim default: current provider remains canonical meanwhile; a longer-term consolidated solution is to be designed later (Decision Record, still-open item D-NOTIF-2, interim default confirmed)."

CopilotMode: STRICT
