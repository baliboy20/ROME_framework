ID: REQ-NOTIF05
Actor: System
Intent: import received-email
Preconditions:
  - a message arrives addressed to the business's email address (Cloudflare Email Routing → api-worker email() handler, DR-18)
Conditions:
  - the message is checked against a spam filter (marker, not a gate — DR-7)
  - it is then categorised against a Booking/Enquiry by a sequential, ordered rules cascade — each step tried in order, first match wins, no step guesses
  - "step 1 reply-reference threading — References/In-Reply-To headers match an existing email_thread"
  - "step 2 thread inheritance — a step-1 match inherits that thread's existing Booking/Enquiry link, if any"
  - "step 3 reference-number extraction — a recognisable booking/voucher/enquiry reference found in subject or body"
  - "step 4 sender-address lookup — the From address matches exactly one leader/co-leader/prospect with exactly one open Booking/Enquiry; more than one open candidate does NOT auto-link (falls through to ambiguous); a Co-leader address matches the booking they are on (DR-10)"
  - "step 5 no match — categorised unlinked; a step-4 match against more than one candidate is categorised ambiguous, candidates recorded, none chosen automatically"
  - the cascade's step order/definitions may be tuned later (DR-9) without changing this contract, provided linked/unlinked/ambiguous stay the only outcomes and no step ever guesses
Postconditions:
  - a received_emails record exists, linked to its email_thread
  - the email_thread carries a categorisation of linked (with Booking/Enquiry), unlinked, or ambiguous (with candidates)
  - the message has been forwarded to the Owner's personal address, flagged spam if the filter classified it so (DR-7)
Outcomes:
  - Owner receives the message in their personal inbox as before, marked spam if flagged, but never withheld
  - Owner can later find the message via search (REQ-NOTIF06), grouped into its thread, showing its categorisation
Invariants:
  - every inbound message is captured exactly once and forwarded exactly once, regardless of spam classification (forwarding never suppressed — DR-7)
  - a thread's categorisation is always exactly one of linked/unlinked/ambiguous
  - no cascade step other than an exact, unambiguous match ever sets linked
NonFunctional:
  Reliability:
    - capture failure never prevents the underlying forward (fail open toward delivery, not silently toward loss)
Errors:
  - error: No cascade step produces a match
    message: Thread captured but not linked — needs attention.
    httpCode: 200
    userAction: Owner links it manually via REQ-NOTIF07; never silently dropped
  - error: Step 4 matches more than one open Booking/Enquiry for the sender
    message: Ambiguous — multiple open candidates for this sender.
    httpCode: 200
    userAction: Owner resolves via REQ-NOTIF07; never auto-chosen
ScopeBoundary:
  InScope:
    - capture, spam-flagging (marker not gate), threading, the categorisation cascade, forwarding of inbound email
  OutOfScope:
    - reading/replying in the personal inbox (external)
    - manual re-categorisation (REQ-NOTIF07)
    - in-tool reply to a linked thread (REQ-NOTIF09)
OpenQuestions:
  - question: none
    status: RESOLVED
    resolution: >-
      Genuinely new capability, EML reintegration §3 (no frob-admin equivalent — enquiries is a
      status record, not a thread archive). From REQ-EML11; DR-7 (spam forwarded, flagged), DR-9
      (tunable cascade), DR-10 (co-leader addresses match), DR-18 (Cloudflare Email Routing).
      Source: EML-reintegration-handover/2-eml-spec/EML.md REQ-EML11.
CopilotMode: STRICT
