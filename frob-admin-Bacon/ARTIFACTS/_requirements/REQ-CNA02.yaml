ID: REQ-CNA02
Actor: Customer
Intent: cancel marketing-permission

Preconditions:
  - a prior granted marketing permission exists for the person and purpose

Conditions:
  - withdrawal is recorded as a new appended decision
  - suppression takes effect by the next send cycle at latest

Postconditions:
  - current consent state for that purpose is withdrawn
  - future marketing is suppressed

Outcomes:
  - Customer sees they will no longer receive that marketing
  - future marketing of that purpose is suppressed for that person

Invariants:
  - withdrawal is append-only
  - suppression is honoured on the next send cycle at latest

NonFunctional:
  Reliability:
    - a withdrawal is effective for subsequent sends

Errors:
  - error: "no prior permission on record"
    message: "You are already unsubscribed from this"
    httpCode: 200
    userAction: "No action needed — already suppressed"

ScopeBoundary:
  InScope:
    - one-step withdrawal or unsubscribe per purpose
  OutOfScope:
    - partial or paused subscriptions

OpenQuestions: []

CopilotMode: STRICT
