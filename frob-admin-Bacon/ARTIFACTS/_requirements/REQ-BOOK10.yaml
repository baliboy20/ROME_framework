ID: REQ-BOOK10
Actor: Owner
Intent: create provisional-booking
Preconditions:
  - a customer has requested a provisional, unpaid booking by email, outside the self-service flow
Conditions:
  - the Owner sets the hold duration, any deposit requirement, and reminder cadence individually for this booking, with no system-wide policy
  - payment is not required at creation
Postconditions:
  - the booking is provisionally-confirmed, with Owner-set hold duration, deposit, and reminder terms recorded against it
  - capacity is held against the departure exactly as a paid confirmation would hold it
  - a participant/consent completion link is generated and sent to the customer, the same way REQ-BOOK08 sends a payment link
Outcomes:
  - Owner sees the booking created with the terms they set
  - Customer receives confirmation of the provisional booking and its terms, plus the completion link
  - capacity is held even though no payment has been taken
  - Customer independently supplies attendee details and waiver/terms acceptance via the completion link, following the existing REQ-BOOK02 → REQ-BOOK03 draft-booking flow unchanged — the Owner never enters this on the customer's behalf
Invariants:
  - a provisionally-confirmed booking holds capacity identically to a paid confirmation and is never treated as lower-priority in the departure's capacity accounting
  - every provisional booking has an Owner-set hold duration, never indefinite
  - "provisionally-confirmed" describes capacity status only — it does not imply participant/consent data is yet complete
NonFunctional:
  Reliability:
    - the same atomic capacity-decrement guarantee that applies to a direct booking selection applies here
Errors:
  - error: requested party size exceeds the departure's remaining capacity
    message: this booking is not created; the same capacity constraint as a direct booking selection applies
ScopeBoundary:
  InScope:
    - Owner-created provisional booking with Owner-set terms
    - generating and sending the customer's participant/consent completion link
  OutOfScope:
    - a customer-facing self-service pay-later flow
    - receipt or handling of the customer's emailed request itself, which is off-system and not modelled
    - Owner-side entry of participant/consent data on the customer's behalf, rejected by DR-B11 as it would weaken the customer-own-acceptance invariant of REQ-BOOK03/DR-B7
OpenQuestions:
  - question: does provisional booking support self-service pay-later, and what governs its terms
    status: RESOLVED
    resolution: owner-created only, with terms set per-booking by the Owner and no system-wide policy, closed by DR-B1 and DR-B2
  - question: how does a provisionally-confirmed booking acquire participant details, waiver/terms acceptance, and an emergency contact
    status: RESOLVED
    resolution: via a customer-facing completion link mirroring REQ-BOOK08's payment link, routing to the existing REQ-BOOK02/REQ-BOOK03 flow, closed by DR-B11 (surfaced as FINDING-004, 2026-07-24)
CopilotMode: STRICT
