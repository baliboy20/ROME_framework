ID: REQ-BOOK08
Actor: Owner
Intent: create booking
Preconditions:
  - an enquiry exists with agreed tour, date, party size, and price
Conditions:
  - the agreed price may differ from the standard published price for a negotiated group or corporate rate
Postconditions:
  - a booking draft exists with the agreed terms, pending a payment link sent to the customer
Outcomes:
  - Owner sees the booking created and a payment link generated to send to the customer
  - once paid, downstream confirmation follows the same path as a direct booking
Invariants:
  - an owner-created booking follows the same confirmation path as a direct booking once paid
NonFunctional:
  Security:
    - the payment link carries the agreed price, not a customer-editable amount
Errors:
  - error: agreed price differs from standard by more than a threshold discount
    message: Owner is prompted to confirm before the booking is created, guarding against an accidental near-zero price
ScopeBoundary:
  InScope:
    - enquiry-to-booking conversion with owner-set terms
  OutOfScope:
    - bank-transfer or manual-payment recording, tracked as unowned ground pending a decision
OpenQuestions:
  - question: none
    status: RESOLVED
    resolution: no open questions remain for this requirement
CopilotMode: STRICT
