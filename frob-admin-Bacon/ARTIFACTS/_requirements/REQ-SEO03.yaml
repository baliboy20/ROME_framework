ID: REQ-SEO03
Actor: SystemContentPublisher
Intent: update published-content

Preconditions:
  - marketing or route-catalogue content has changed since the last publication
  - an operator has triggered a manual publish

Conditions:
  - publication regenerates affected locations with current content and descriptors
  - content lags the catalogue until the next manual publish is triggered

Postconditions:
  - public locations reflect the content current as of the last manual publish

Outcomes:
  - Prospect sees the tour details current as of the last manual publish, and a crawler indexes those descriptors
  - Owner controls exactly when published content changes

Invariants:
  - published content only ever reflects a completed manual publish
  - published content never changes without a manual publish

NonFunctional:
  Reliability:
    - a triggered rebuild completes within the accepted processing window

Errors: []

ScopeBoundary:
  InScope:
    - regeneration of public locations on operator-triggered manual publish
  OutOfScope:
    - automated on-change publishing
    - instantaneous per-edit publishing

OpenQuestions:
  - question: "Should publication be automated on content change or manual?"
    status: RESOLVED
    resolution: "Manual-only, overriding the automated recommendation (Decision Record DR-10)."

CopilotMode: STRICT
