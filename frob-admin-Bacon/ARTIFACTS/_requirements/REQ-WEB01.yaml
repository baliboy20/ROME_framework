ID: REQ-WEB01
Actor: Prospect
Intent: view home tour-showcase
Preconditions:
  - One or more tours exist with status published
Conditions:
  - The home page presents the flagship published tours as a showcase ("Three Ways to Discover London")
  - Each showcased tour shows name, tagline, duration, max group size, difficulty, price per person, a badge where set (e.g. Most Popular / First Timers / Summer Only), and route highlights
  - The showcase reflects only currently-published tours and their live catalogue data
Postconditions:
  - The Prospect sees the current flagship tours and can proceed to a tour detail or begin booking a chosen tour
Outcomes:
  - Prospect identifies a tour of interest from the home page
  - Prospect proceeds to book (deep-links into the booking flow with the tour pre-filled) or opens the full tours index
Invariants:
  - The showcase never presents an unpublished or archived tour
  - Displayed price and details always match the tour's current catalogue record
NonFunctional:
  Performance:
    - Showcase content is available on first load
  SEO:
    - Tour showcase content is discoverable by crawlers (satisfied at publish time; see TDR — dynamic island now, static-publish deferred)
Errors:
  - error: No published tours to showcase
    message: Tours are being updated — please check back shortly or get in touch.
    httpCode: 200
    userAction: Proceed to Contact / private-group enquiry
ScopeBoundary:
  InScope:
    - Home-page presentation of the flagship published tours sourced from the catalogue
    - Deep-link into the booking flow with the selected tour pre-filled
  OutOfScope:
    - Personalised ranking or paid placement
    - Editing tour content (owner catalogue management is a separate requirement)
OpenQuestions:
  - question: Which tours are "flagship" for the home showcase vs the full index?
    status: RESOLVED
    resolution: Home showcases the three current flagship tours (Hidden City, Icons & Insights, Golden Hour City); the full set lives on the Tours index (PRE01).
CopilotMode: STRICT
