ID: REQ-POST02
Actor: System
Intent: submit review-request
Preconditions:
  - a booking is completed
  - the thank-you message has been sent
Conditions:
  - sent at T+24h with links to both TripAdvisor and Google
  - a privately-routed feedback option is shown with equal visual weight to the public review links
  - one-and-done, no reminder
Postconditions:
  - the review request is sent
Outcomes:
  - Customer leaves a public review or is routed to private feedback
Invariants:
  - the private-feedback option is never visually subordinate to the public review links
NonFunctional:
  Reliability:
    - the review request is sent exactly once at T+24h regardless of retries
Errors:
  - error: none declared
    message: Every customer response - public review, private route, or no action - is a valid outcome.
    httpCode: 200
    userAction: No action needed
ScopeBoundary:
  InScope:
    - the review-request message, sent once
  OutOfScope:
    - a follow-up reminder (deferred to a future phase)
    - the review submission itself, which happens off-system
    - feedback capture (REQ-POST03)
CopilotMode: STRICT
OpenQuestions:
  - question: none
    status: RESOLVED
    resolution: No open questions for this requirement
