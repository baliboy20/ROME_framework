ID: REQ-TOUR03
Actor: System
Intent: submit weather-advisory
Preconditions:
  - a booking is confirmed
  - its tour is within the advisory window, for example the next 72 hours
Conditions:
  - the forecast is evaluated against threshold rules
  - classification is informational or action-required
  - duplicate advisories within a short window are suppressed unless severity escalates
Postconditions:
  - an advisory is sent and recorded against the booking
  - the tour hub reflects the current advisory status
Outcomes:
  - Customer is informed of weather impact before arrival, with expectations set appropriately
Invariants:
  - an advisory never contradicts a more severe unresolved advisory already sent for the same booking
NonFunctional:
  Reliability:
    - the advisory reflects the forecast for the specific tour time window, not the whole day
Errors:
  - error: the weather data source is unavailable
    message: Advisory generation could not reach the forecast source and was routed to manual review.
    httpCode: 200
    userAction: Await manual Owner review of the advisory
ScopeBoundary:
  InScope:
    - automated and Owner-manual weather advisories
  OutOfScope:
    - the escalation into cancellation itself
OpenQuestions:
  - question: What numeric thresholds should classify an advisory as informational versus action-required?
    status: OPEN
    resolution: "Blocked on D-TOUR-3; deferred, informational-only interim; no auto-escalation to cancellation-candidate without real thresholds"
CopilotMode: STRICT
