ID: REQ-FLEET06

Actor: Owner

Intent: update bike-status

Preconditions:
  - a bike is flagged-for-service or in-maintenance

Conditions:
  - moving to in-service requires at least one in-house maintenance event logged since the flag

Postconditions:
  - the bike's status reflects the Owner's decision
  - if returned to service, the bike is immediately re-eligible for tour assignment

Outcomes:
  - Owner has cleared the bike back to service

Invariants:
  - a bike returns to in-service only after at least one in-house maintenance event

NonFunctional:
  Reliability:
    - the status change takes effect immediately

Errors:
  - error: "no maintenance event logged since the flag"
    message: "This bike cannot return to service until a maintenance event has been logged"
    httpCode: 409
    userAction: "Log a maintenance event before returning the bike to service"
  - error: "same bike flagged 3 or more times in 90 days for the same issue"
    message: "This bike has a recurring pattern for this issue — review before clearing"
    httpCode: 200
    userAction: "Review the recurring pattern before deciding whether to clear the bike"

ScopeBoundary:
  InScope:
    - clearing a flagged or in-maintenance bike back to service
  OutOfScope:
    - awaiting-external-service transition
    - retired transition

OpenQuestions: []

CopilotMode: STRICT
