ID: REQ-FLEET07

Actor: Owner

Intent: submit compliance-alert

Preconditions:
  - a tracked compliance item exists, being PLI, EL, ICO, helmet expiry, or first aid contents review

Conditions:
  - a daily check classifies each item as pending if within a configurable horizon of expiry, default 30 days, or critical if past expiry
  - an alert fires only at the moment an item's classification changes, not on a recurring schedule

Postconditions:
  - alerts are current for every tracked item
  - a single alert is sent when an item newly becomes pending or critical

Outcomes:
  - Owner sees upcoming and overdue compliance items without tracking dates manually

Invariants:
  - a critical, overdue compliance item is never silently left unalerted

NonFunctional:
  Reliability:
    - the daily evaluation runs every day without missed executions

Errors:
  - error: "compliance item classification cannot be evaluated"
    message: "A compliance item could not be evaluated for its current status"
    httpCode: 500
    userAction: "Check the compliance item's recorded expiry date"

ScopeBoundary:
  InScope:
    - daily compliance evaluation
    - on-event alerting for the core compliance set
  OutOfScope:
    - the renewal action itself
    - a recurring digest

OpenQuestions: []

CopilotMode: STRICT
