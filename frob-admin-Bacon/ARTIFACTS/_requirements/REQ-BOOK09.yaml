ID: REQ-BOOK09
Actor: SystemScheduler
Intent: archive booking-draft
Preconditions:
  - a booking draft's slot hold has expired with no payment and no provisional booking taken
Conditions:
  - the draft is retained for 24 hours in an abandoned state before permanent removal
Postconditions:
  - the draft is marked abandoned
  - the held capacity is released back to the departure
Outcomes:
  - Owner sees that abandonment does not silently retain capacity that should be bookable by someone else
Invariants:
  - an abandoned draft never continues to hold departure capacity
NonFunctional:
  Reliability:
    - capacity is released when the hold's time limit elapses, not left to accumulate
Errors:
  - error: none, this requirement is itself the recovery path for an unresolved draft
    message: not applicable
ScopeBoundary:
  InScope:
    - hold-expiry driven archival and capacity release
  OutOfScope:
    - abandonment-recovery contact, which belongs to a notification requirement not yet authored
OpenQuestions:
  - question: none
    status: RESOLVED
    resolution: no open questions remain for this requirement
CopilotMode: STRICT
