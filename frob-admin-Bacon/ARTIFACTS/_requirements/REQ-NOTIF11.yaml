ID: REQ-NOTIF11
Actor: System / Owner
Intent: send booking email
Preconditions:
  - "automatic outcome send: a booking has just reached a settled payment position (confirmed by Stripe webhook, or repaired by the reconciliation sweep REQ-BOOK05)"
  - the booking has a lead booker with a contact email
  - "owner-initiated send: at least one active booking-aware email_template exists (its use_case declares booking merge fields)"
Conditions:
  - the confirmation "flavour" is selected from the booking's payment position — amount_paid == 0 → booking_reserved_unpaid; 0 < amount_paid < price_total → booking_deposit_received; amount_paid >= price_total → booking_confirmed_paid
  - the matching active email_template for that use_case is rendered (REQ-NOTIF10) with the booking's merge data; if no active template exists a built-in plain-text fallback is used so a confirmed booking is never left un-notified
  - the automatic send is idempotency-keyed per (booking_id, flavour) so webhook redelivery and the reconciliation sweep never double-send, and an unpaid→paid transition still notifies each flavour exactly once
  - "owner-initiated send (CR-004): from a booking record the Owner may send an active, booking-aware template to the lead — only templates whose use_case declares booking merge fields are offered; the send is template-only in this increment (no untemplated composing)"
  - "owner-initiated send: the recipient address is prefilled from the booking's lead contact email and is editable before sending"
  - "owner-initiated send: merge fields fill from THIS booking's data; a template may include an optional {{personal_message}} merge slot the Owner fills with a personal note — templates lacking the slot offer no personal-message entry"
  - "owner-initiated send: the Owner previews the rendered email before sending; the send goes via the standard transport and is never idempotency-suppressed"
Postconditions:
  - exactly one message row exists per (booking, flavour) for automatic sends, recording provider, status and (when rendered) template_id — satisfies REQ-NOTIF01
  - the customer receives the confirmation via email in addition to the on-screen R1 confirmation surface (UXC-FBK-1 two-channel rule)
  - an owner-initiated send is recorded as a message row linked to the booking, visible in the email archive alongside every other send
Outcomes:
  - a paid-in-full customer receives their booking confirmation with reference, ride details and meeting point
  - an owner-created / provisional booking with no payment receives a reserved-awaiting-payment notice carrying the completion link
  - the Owner can, from a booking record, choose a booking-aware template, add an optional personal message where the template supports it, preview, correct the recipient address if needed, and send — then sees the sent message linked to the booking (CR-004)
Invariants:
  - an automatic booking outcome is never notified more than once per flavour
  - no confirmation blocks or fails the booking/payment transaction — dispatch is best-effort and post-commit
  - an owner-initiated send is never idempotency-suppressed and always uses an active template (never untemplated content) in this increment
NonFunctional: {}
Errors:
  - error: booking has no lead-booker contact email
    message: (none to customer) — dispatcher returns no_contact_address; no send attempted
    httpCode: 200
    userAction: Owner may add a contact email and re-run reconciliation to dispatch
  - error: owner-initiated send attempted with no active booking-aware template available
    message: No booking-aware templates are active. Publish one before sending.
    httpCode: 422
    userAction: Publish an active template whose use_case declares booking merge fields, then retry
ScopeBoundary:
  InScope:
    - selecting the confirmation flavour from payment position
    - rendering the allocated template (or fallback) and sending once, idempotently
    - hooking the Stripe webhook fulfilment path and the reconciliation sweep
    - owner-initiated templated send to the booking's lead from the booking record — booking-aware templates only, editable recipient, optional {{personal_message}} slot, preview, recorded and linked to the booking (CR-004)
  OutOfScope:
    - authoring/allocating the templates themselves (REQ-NOTIF10)
    - reminders (REQ-NOTIF02) and cancellation notices (REQ-TOUR07)
    - the deposit/partial flavour's own template (dispatcher wired; template authored later — falls back until then)
    - free-form (no-template) compose from a booking (deferred by CR-004 DECIDE-3)
OpenQuestions:
  - question: none
    status: RESOLVED
    resolution: >-
      Closes the confirmation-email half of UXC-FBK-1 (the R1 page alone did not satisfy the
      "page AND email" rule). Flavours and the activate-per-use_case allocation model ratified with
      sponsor 2026-07-26; deposit template deferred as customer web flow charges in full today.
  - question: none (CR-004 amendment provenance)
    status: RESOLVED
    resolution: >-
      Amended per sponsor-ratified CR-004 (CHG-012, CT-3), 2026-07-28: owner-initiated,
      booking-scoped templated send to the lead from the booking record. Decisions: booking-aware
      templates only; {{personal_message}} merge slot (templates without it offer no message
      entry); template-only in this increment. Source:
      ARTIFACTS/changes/CR-004-booking-email-and-masterdetail-PROPOSAL.md.
CopilotMode: STRICT
