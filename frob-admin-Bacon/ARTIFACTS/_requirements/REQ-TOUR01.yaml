ID: REQ-TOUR01
Actor: Customer
Intent: view tour-hub
Preconditions:
  - a confirmed booking exists
  - the Customer is authenticated via a manage-booking session
Conditions:
  - the hub reflects the booking's current status, meeting point, and any pending changes at the moment it's viewed
Postconditions:
  - the Customer has seen current booking details, status, and available next actions
Outcomes:
  - Customer sees booking reference, tour name, date/time, meeting point, attendee list, and current status
  - Customer can reach detail-update, question, modify, or cancel actions from the hub
Invariants:
  - a non-booker attendee viewing via a shared link never sees the emergency contact or other sensitive fields
NonFunctional:
  Reliability:
    - the hub never shows stale status after a change has been processed
Errors:
  - error: the booking is cancelled
    message: This tour has been cancelled. The remediation outcome is shown below.
    httpCode: 200
    userAction: Review the remediation outcome shown on the hub
  - error: the tour date has passed
    message: This tour has already taken place.
    httpCode: 200
    userAction: No action needed; the hub now shows a completed state
ScopeBoundary:
  InScope:
    - read-only tour-day information and status
  OutOfScope:
    - the underlying modify/cancel actions themselves (owned by booking)
OpenQuestions:
  - question: none
    status: RESOLVED
    resolution: No open questions for this requirement
CopilotMode: STRICT
