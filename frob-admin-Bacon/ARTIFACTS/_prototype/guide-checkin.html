<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>G6 · Rider check-in — Guide App</title>
<link rel="stylesheet" href="shared.css"><link rel="stylesheet" href="parchment.css">
</head>
<body class="parchment">
<div class="proto-banner">T2 PROTOTYPE — G6 Rider check-in &middot; UXD-16 per-rider check-in/refusal, refused → flagged for William refund <a href="index.html">index</a></div>
<div class="guide-frame">
  <div id="header-mount"></div>
  <div class="guide-content">
    <div class="rider-row" id="rider-tom">
      <div><div class="card-title serif" style="margin:0">Tom Baker</div><p class="mono" style="font-size:11px;color:var(--text-muted);margin:2px 0 0">BK-1001 &middot; Adult</p></div>
      <div id="rider-tom-status"><span class="status-pill pink">PENDING</span></div>
    </div>
    <div id="rider-tom-actions" style="display:flex;gap:8px;margin:-4px 0 14px">
      <button class="g-small-btn" onclick="checkInRider('tom')">Check in</button>
      <button class="g-small-btn" style="background:#ffe4f1;color:var(--pink-text-light)" onclick="refuseRider('tom')">Refuse</button>
    </div>

    <div class="rider-row" id="rider-marie">
      <div><div class="card-title serif" style="margin:0">Marie Dubois</div><p class="mono" style="font-size:11px;color:var(--text-muted);margin:2px 0 0">BK-1004 &middot; Adult</p></div>
      <div id="rider-marie-status"><span class="status-pill pink">PENDING</span></div>
    </div>
    <div id="rider-marie-actions" style="display:flex;gap:8px;margin:-4px 0 14px">
      <button class="g-small-btn" onclick="checkInRider('marie')">Check in</button>
      <button class="g-small-btn" style="background:#ffe4f1;color:var(--pink-text-light)" onclick="refuseRider('marie')">Refuse</button>
    </div>

    <div id="refusalBanners"></div>

    <div class="playbook-title" style="padding:0;margin:16px 0 8px">SIGNATURE DECLARATION</div>
    <div class="sig-panel signature-field">
      <div class="sig-label">Guide signature to complete this card</div>
      <input id="sigName" type="text" placeholder="Full name" style="width:100%;height:44px;border:1px solid #b9d97e;border-radius:10px;padding:0 12px;font-size:15px;text-align:center;font-style:italic" oninput="checkGate()">
    </div>
    <div id="gateMsg"></div>

    <button class="g-btn g-btn-primary gate-btn" id="confirmBtn" disabled onclick="confirmStep()">Complete &amp; continue</button>
    <a class="g-btn g-btn-secondary" href="guide-playbook.html">Back to playbook</a>
  </div>
</div>
<script src="guide-shell.js"></script>
<script>
renderGuideHeader('guide-playbook.html', 'G6 · FULL SIGNATURE', 'Rider check-in');
var riders = { tom: 'pending', marie: 'pending' };
function checkInRider(id){
  riders[id] = 'checked';
  document.getElementById('rider-' + id + '-status').innerHTML = '<span class="status-pill lime">CHECKED IN</span>';
  document.getElementById('rider-' + id + '-actions').innerHTML = '';
  checkGate();
}
function refuseRider(id){
  riders[id] = 'refused';
  document.getElementById('rider-' + id + '-status').innerHTML = '<span class="status-pill pink">REFUSED</span>';
  document.getElementById('rider-' + id + '-actions').innerHTML = '';
  var name = id === 'tom' ? 'Tom Baker' : 'Marie Dubois';
  document.getElementById('refusalBanners').innerHTML += '<div class="needs-action-banner">' + name + ' refused — waiver not accepted. Flagged for William-processed refund. Guide never handles money (UXD-16).</div>';
  checkGate();
}
function allDecided(){
  return Object.keys(riders).every(function(k){ return riders[k] !== 'pending'; });
}
function checkGate(){
  var name = document.getElementById('sigName').value.trim();
  var msg = document.getElementById('gateMsg');
  var ok = allDecided() && name.length > 1;
  document.getElementById('confirmBtn').disabled = !ok;
  if (!allDecided()) msg.innerHTML = '<div class="guard-msg blocked">Check in or refuse every rider before signing.</div>';
  else if (!name) msg.innerHTML = '<div class="guard-msg">A full-signature declaration is required to complete G6.</div>';
  else msg.innerHTML = '';
}
checkGate();
function confirmStep(){
  markStepDone('g6');
  window.location.href = 'guide-briefing.html';
}
</script>
</body>
</html>
