<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>G3 · Travel kit checklist — Guide App</title>
<link rel="stylesheet" href="shared.css"><link rel="stylesheet" href="parchment.css">
</head>
<body class="parchment">
<div class="proto-banner">T2 PROTOTYPE — G3 Travel kit checklist &middot; ChecklistRow (design-handoff), UXD-13 typed-confirm <a href="index.html">index</a></div>
<div class="guide-frame">
  <div id="header-mount"></div>
  <div class="guide-content">
    <div class="checklist-row checked" data-critical="0" onclick="toggleRow(this)">
      <div class="tick">✓</div>
      <div class="cl-body"><div class="cl-label">First aid kit</div></div>
    </div>
    <div class="checklist-row checked" data-critical="0" onclick="toggleRow(this)">
      <div class="tick">✓</div>
      <div class="cl-body"><div class="cl-label">Puncture repair kit</div></div>
    </div>
    <div class="checklist-row" id="criticalRow" data-critical="1" onclick="toggleRow(this)">
      <div class="tick"></div>
      <div class="cl-body"><div class="cl-label">Spare helmet</div><div class="cl-sub mono">Critical — blocks progression until checked</div></div>
      <span class="cl-chip">CRITICAL</span>
    </div>

    <div class="typed-confirm" style="margin-top:20px">
      <div class="mono" style="font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--text-label)">G3 &middot; Typed confirm</div>
      <p style="font-size:13px;margin:6px 0 0">Type your full name to confirm the kit is checked.</p>
      <input type="text" id="typedName" placeholder="Type full name" oninput="checkGate()">
    </div>
    <div id="gateMsg"></div>

    <button class="g-btn g-btn-primary gate-btn" id="confirmBtn" disabled onclick="confirmStep()">Confirm &amp; continue</button>
    <a class="g-btn g-btn-secondary" href="guide-playbook.html">Back to playbook</a>
  </div>
</div>
<script src="guide-shell.js"></script>
<script>
renderGuideHeader('guide-playbook.html', 'G3 · TYPED CONFIRM', 'Travel kit checklist');
function toggleRow(row){
  row.classList.toggle('checked');
  row.querySelector('.tick').textContent = row.classList.contains('checked') ? '✓' : '';
  checkGate();
}
function checkGate(){
  var critical = document.getElementById('criticalRow').classList.contains('checked');
  var name = document.getElementById('typedName').value.trim();
  var msg = document.getElementById('gateMsg');
  var ok = critical && name.length > 1;
  document.getElementById('confirmBtn').disabled = !ok;
  if (!critical) msg.innerHTML = '<div class="guard-msg blocked" style="margin:10px 20px 0">Critical item (spare helmet) missing — resolve before confirming.</div>';
  else if (!name) msg.innerHTML = '<div class="guard-msg" style="margin:10px 20px 0">Type your full name to enable Confirm (UXC-FRM-3).</div>';
  else msg.innerHTML = '';
}
checkGate();
function confirmStep(){
  markStepDone('g3');
  window.location.href = 'guide-bike-inspection.html';
}
</script>
</body>
</html>
