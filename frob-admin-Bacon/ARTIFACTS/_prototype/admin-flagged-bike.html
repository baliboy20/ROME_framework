<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=1280">
<title>A15 · Flagged-bike maintenance — Back Office</title>
<link rel="stylesheet" href="shared.css"><link rel="stylesheet" href="parchment.css">
</head>
<body class="parchment">
<div class="proto-banner">T2 PROTOTYPE — A15 Flagged-bike &middot; UXD-11 clear-to-service gated on a logged maintenance event <a href="index.html">index</a></div>
<div class="admin-shell">
  <div id="rail-mount"></div>
  <div class="admin-main">
    <div id="topbar-mount"></div>
    <div class="admin-content">
      <div class="eyebrow" id="page-eyebrow"></div>
      <h1 class="page-title" id="page-title"></h1>
      <p class="body-text" id="page-desc"></p>

      <div class="a-card" style="max-width:640px">
        <div class="eyebrow" style="margin-bottom:6px">FOB-009</div>
        <div class="card-title serif">Flagged — brake lever loose</div>
        <p class="body-text" style="font-size:13px">Flagged during A20 allocation check, 20 Jul 2026.</p>

        <div class="eyebrow" style="margin-top:18px;margin-bottom:8px">MAINTENANCE EVENT LOG</div>
        <div class="g-log-list" id="eventLog">
          <div class="event-log-row" style="color:var(--text-faint)"><span>No maintenance events logged yet.</span><span></span></div>
        </div>

        <div class="dup-guard-row" style="margin-top:14px">
          <div class="a-field" style="flex:1;margin-bottom:0">
            <label>Log a maintenance event</label>
            <input id="f-event" placeholder="e.g. Brake cable replaced">
          </div>
          <button class="a-btn a-btn-secondary" onclick="logEvent()">Log event</button>
        </div>

        <div id="clear-guard" style="margin-top:14px"></div>
        <button class="a-btn a-btn-primary gate-btn" id="clearBtn" disabled onclick="clearToService()">Clear to service</button>
        <div id="clear-note"></div>
      </div>
    </div>
  </div>
</div>
<script src="admin-shell.js"></script>
<script>
renderAdminShell('a15', 'A15 · FLEET & EQUIPMENT', 'Flagged-bike maintenance',
  'A flagged bike cannot be cleared back to service until at least one maintenance event is logged.');

var events = [];
function logEvent(){
  var val = document.getElementById('f-event').value.trim();
  if (!val) return;
  events.push({ note: val, date: '22 Jul 2026' });
  renderEvents();
  document.getElementById('f-event').value = '';
  document.getElementById('clearBtn').disabled = false;
  document.getElementById('clear-guard').innerHTML = '';
}
function renderEvents(){
  var html = '';
  events.forEach(function(e){ html += '<div class="event-log-row"><span>' + e.note + '</span><span class="mono">' + e.date + '</span></div>'; });
  document.getElementById('eventLog').innerHTML = html || '<div class="event-log-row" style="color:var(--text-faint)"><span>No maintenance events logged yet.</span><span></span></div>';
}
document.getElementById('clear-guard').innerHTML = '<div class="guard-msg">Log at least one maintenance event before this bike can be cleared.</div>';
function clearToService(){
  if (events.length === 0) return;
  document.getElementById('clear-note').innerHTML = '<div class="inline-confirm">FOB-009 cleared — status set to in_service.</div>';
  document.getElementById('clearBtn').disabled = true;
}
</script>
</body>
</html>
