    <button class="g-btn g-btn-primary" onclick="markStepDone('g7');window.location.href='guide-complete.html'">Continue to sign-off</button>

<script>
renderGuideHeader('guide-playbook.html', 'G7 · ON-SCREEN', 'Safety briefing script');

var html = '';
if (m1) html += '<div class="event-log-row"><span>Wet cobblestones — Riverside descent</span><span class="mono" style="font-size:11px;color:var(--orange-text-light)">' + m1 + '</span></div>';
document.getElementById('mitigationList').innerHTML = html || '<div class="event-log-row" style="color:var(--text-faint)"><span>No mitigations logged from G5 yet.</span><span></span></div>';
</script>
