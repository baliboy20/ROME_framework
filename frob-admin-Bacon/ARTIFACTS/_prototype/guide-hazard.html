<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>G13 · Hazard observation — Guide App</title>
<link rel="stylesheet" href="shared.css"><link rel="stylesheet" href="parchment.css">
</head>
<body class="parchment">
<div class="proto-banner">T2 PROTOTYPE — G13 Hazard observation entry &middot; governed by UXC defaults (dedupes by street at A11) <a href="index.html">index</a></div>
<div class="guide-frame">
  <div id="header-mount"></div>
  <div class="guide-content">
    <div class="a-field"><label>Hazard</label><input id="f-hazard" placeholder="e.g. Pothole, loose drain cover"></div>
    <div class="a-field"><label>Street</label><input id="f-street" placeholder="e.g. Riverside Walk"></div>
    <button class="g-btn g-btn-primary" onclick="submitHazard()">Log hazard</button>
    <div id="hazardNote"></div>
    <a class="g-btn g-btn-secondary" href="guide-playbook.html">Back to playbook</a>
  </div>
</div>
<script src="guide-shell.js"></script>
<script>
renderGuideHeader('guide-playbook.html', 'G13 · LOG', 'Hazard observation');
function submitHazard(){
  var h = document.getElementById('f-hazard').value.trim();
  var s = document.getElementById('f-street').value.trim();
  if (!h || !s) return;
  document.getElementById('hazardNote').innerHTML = '<div class="inline-confirm">Logged — reviewed at A11, deduped by street.</div>';
}
</script>
</body>
</html>
