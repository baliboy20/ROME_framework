<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>G10 · Emergency / incident logger — Guide App</title>
<link rel="stylesheet" href="shared.css"><link rel="stylesheet" href="parchment.css">
</head>
<body class="parchment">
<div class="proto-banner">T2 PROTOTYPE — G10 Emergency/incident logger &middot; offline-tolerant, needs-action banner (governed by UXC defaults) <a href="index.html">index</a></div>
<div class="guide-frame">
  <div id="header-mount"></div>
  <div class="guide-content">
    <div class="warning-banner">No mobile signal? Seek help via a passer-by first — log here as soon as possible. Nothing here is blocked by connectivity.</div>
    <div class="a-field"><label>What happened</label><input id="f-what" placeholder="Brief description"></div>
    <div class="a-field"><label>Rider(s) involved</label><input id="f-riders" placeholder="e.g. Tom Baker"></div>
    <button class="g-btn g-btn-primary" onclick="logEmergency()">Log emergency</button>
    <div id="loggedNote"></div>
    <a class="g-btn g-btn-secondary" href="guide-playbook.html">Back to playbook</a>
  </div>
</div>
<script src="guide-shell.js"></script>
<script>
renderGuideHeader('guide-playbook.html', 'G10 · OFFLINE-TOLERANT', 'Emergency / incident logger');
function logEmergency(){
  var what = document.getElementById('f-what').value.trim();
  if (!what) return;
  document.getElementById('loggedNote').innerHTML = '<div class="needs-action-banner" style="margin-left:0;margin-right:0">Logged and flagged for review — routes to A10 Incident review when back online.</div>';
}
</script>
</body>
</html>
