Title: "Admin: payments-ledger clarity + emails console"
Description: |
  Two post-delivery admin-app (webapp-admin) UI changes requested by the sponsor.

  (1) Payments & refunds (A8) ledger — the row is confusing: it prints the raw
  booking UUID. Show the LEADER name, a short booking REF, and the payment
  TRANSACTION code clearly, and make the row a link that opens the booking in a
  dismissible dialog.

  (2) Emails (A5) — a console page listing all emails with sortable columns
  (category, sender, subject, date), groupable into interaction chains. Selecting
  an email opens its detail in a modal; multiple modals may be open at once and
  all auto-dismiss on navigation away from the page. The admin can reply to the
  sender from a modal (compose dialog).
