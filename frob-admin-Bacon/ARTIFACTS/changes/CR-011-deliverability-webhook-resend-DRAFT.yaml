ID: CR-011
title: Deliverability webhook — rebuild on Resend with signature verification
status: DELIVERED 2026-07-29 — implemented in full; see notes
raised_by: Roma, from FINDING-008 remaining item 1
requirement: REQ-NOTIF02
surface: worker — src/routes/notifications.ts

change_type:
  declared: CT-1
  rationale: >
    REQ-NOTIF02 is provider-agnostic — it says "the delivery provider reports an
    outcome", naming no vendor. So moving the ingestion path from Postmark to
    Resend does NOT change the requirement; it restores a requirement that is
    currently not being served. That is a defect fix, not a requirement change.
    Flagged for the router: if the reviewer judges that changing the vendor
    integration surface is itself a contract change, this becomes CT-3. Roma's
    reading is CT-1 and the classification should be confirmed, not assumed.
  blast_radius:
    verified: false
    touches:
      - SOURCE/worker/src/routes/notifications.ts (POST /webhooks/postmark)
      - SOURCE/worker/test/notifications.test.ts (7 references)
      - ARTIFACTS/_design/api-contracts.md (webhook contract)

problem:
  - The route is UNAUTHENTICATED. It validates payload shape with Zod and claims
    a D1 idempotency key, but verifies no signature — anyone can inject
    delivery, bounce and complaint events and corrupt deliverability state.
  - It is ALSO dead. CHG-008/DR-18 moved outbound transport to Resend, so
    Postmark no longer calls this endpoint. REQ-NOTIF02 is therefore
    **currently unserved** — bounces and complaints are not being ingested at
    all. This is the more consequential half and was not obvious until the route
    was traced.
  - >-
      So the two failure modes point in opposite directions: deleting the route
      drops a delivered requirement; leaving it keeps an open injection point on a
      feature that does not work.

why_not_just_delete:
  It looked deletable when first raised in FINDING-008. It is not — it carries
  REQ-NOTIF02 and has 7 test references. Deletion without replacement would
  silently retire a requirement.

proposed:
  - Add `POST /webhooks/resend` with signature verification (Resend signs with
    a webhook secret; verify before any parsing or state change).
  - Map Resend's event names to the existing deliverability-state transitions,
    reusing the current D1 idempotency claim, which is sound and stays.
  - Remove the Postmark route once the replacement is verified, and migrate its
    7 tests rather than dropping them.
  - Add `RESEND_WEBHOOK_SECRET` via `wrangler secret put` (never wrangler.toml).

open_questions:
  - id: OQ-1
    question: >
      Has the Resend webhook ever been configured at the provider end? If not,
      this is not merely a code change — someone must register the endpoint and
      generate the signing secret before deliverability data flows at all.
    blocking: true
  - id: OQ-2
    question: >
      How long has REQ-NOTIF02 been unserved, and does any deliverability data
      shown in the admin console (A4) predate the transport switch? If the
      console displays stale bounce state as current, that is a separate
      reporting defect worth raising on its own.

notes:
  - >-
      Interim exposure while deferred: the open endpoint can still be posted to by
      anyone. Impact is limited to corrupting deliverability state (no PII read,
      no money path), which is why deferring is defensible — but it is not zero.

delivered:
  - >-
    Implemented 2026-07-29 on sponsor instruction to remove Postmark as stale.
    POST /webhooks/postmark deleted and replaced by POST /webhooks/resend with
    Svix signature verification (lib/svix-signature.ts) — raw-body HMAC-SHA256,
    300s replay window, constant-time comparison, multiple signatures tolerated
    for secret rotation. Fails CLOSED with no secret configured, unlike the
    login limiter which deliberately fails open: an unverifiable delivery event
    should be discarded, not trusted.
  - >-
    REQ-NOTIF02 is served again. It had been unserved since the transport switch
    — no bounce or complaint had been ingested at all, which was the more
    consequential half of this record and was not visible until the route was
    traced.
  - >-
    Found while implementing, beyond the original scope. Eight sites in live code
    wrote provider "postmark" directly into the message log (posttour x2,
    tourops, pretour x3, cron x2), bypassing send(). That was false provenance,
    not a stale comment. All now write "pending"; send() sets the real transport
    on dispatch. Migration 0010 repairs historical rows that were never
    dispatched, and deliberately leaves rows that genuinely did go via Postmark
    before the switch — rewriting those would falsify the send log.
  - >-
    Also found: the message table declares DEFAULT 'postmark' (0001_init.sql).
    Unreachable from application code now that every INSERT supplies the column,
    but recorded in migration 0010 rather than silently left.
  - >-
    lib/postmark.ts deleted — dead code, imported nowhere. POSTMARK_TOKEN
    removed from env.ts, wrangler.toml and .dev.vars.example, replaced by
    RESEND_WEBHOOK_SECRET.
  - >-
    TDR-09 ("Outbound transactional email is Postmark for v1") retired properly
    through guard.recordTdrDeviation as DEV-5, sponsor-approved — the first
    deviation on this project to go through the sanctioned API rather than being
    written straight into state. TDR-09 now reads SUPERSEDED -> DEV-5.
  - >-
    Tests: 268 passing. The webhook suite was rewritten for Resend and now
    includes four signature cases the old route could not have had — unsigned,
    wrong secret, tampered body, and no secret configured.
  - >-
    NOT done, and required before this works in production: the webhook must be
    registered at Resend's end and RESEND_WEBHOOK_SECRET set per environment.
    Until then the route correctly refuses everything, so bounce ingestion stays
    dark. This is configuration, not code.
  - >-
    Historical records were deliberately NOT rewritten. Findings, the EML
    reintegration notes and the state audit trail all still name Postmark,
    because they record what was true at the time. Removing it there would be
    falsifying history rather than removing staleness.
