OpenQuestions:
  - id: OQ-1
    question: >-
      What does "click to apply" actually do? The request says it takes the
      applicant to booking, but applying to join a free preview ride is not the
      same act as booking a priced tour — and `en/book/` fronts a Stripe
      embedded checkout.
    status: RESOLVED
    resolution: >-
      Sponsor selects option C — the CTA routes to the existing booking flow
      (`en/book/`) as-is. Sponsor is aware this was the not-recommended option
      (a free preview-ride applicant lands in the paid Stripe checkout) and has
      accepted the risk explicitly: tour/booking wording will be revised in a
      later change to resolve the mismatch. Recorded 2026-07-28, sponsor
      directive: "the click will take you booking a tour, i will change the
      tour/booking wording down the line." No new form, no new capability —
      CTA is a plain link to the delivered booking route.
    blocking: false
  - id: OQ-2
    question: >-
      Dismissal and persistence — once per browser, once per session, or until
      launch? Affects whether any state is stored and therefore whether consent
      or cookie policy is engaged.
    status: RESOLVED
    resolution: >-
      Roma default 2026-07-28 (sponsor asked to proceed without waiting on
      this one — non-blocking): once per browser, until launch. A dismissal
      flag is stored in localStorage (`fob_prelaunch_dismissed`), not a
      cookie; the banner never reappears on that device once closed. Treated
      as a first-party functional preference, same category as the existing
      cookie banner's "strictly necessary" bucket — does not engage the
      optional-analytics consent gate (consent.js unchanged).
  - id: OQ-3
    question: >-
      Does the announcement supersede or coexist with the live pricing and
      "book now" CTAs on the home page and catalogue? This is the REQ-WEB01
      reconciliation and it is a commercial decision, not a design one.
    status: RESOLVED
    resolution: >-
      Sponsor directive 2026-07-28: "ignore the contradictions" — the banner
      coexists with the live pricing/booking CTAs as delivered; REQ-WEB01/PRE01
      are not reconciled by this change. Recorded as a sponsor-accepted,
      known content inconsistency, not a defect this change must fix.
    blocking: false

BuildEvidence:
  supersedes: >-
    The 2026-07-28 topsheet BuildEvidence (localStorage key
    fob_prelaunch_dismissed, .topsheet component) is retired — that surface
    no longer exists in the codebase. Rebuilt from scratch per
    DesignSupersession above.
  files:
    - webapp-customer/en/announce.js (REWRITTEN) — builds the full-screen
      takeover DOM: 5 countdown steps (numeral + tagline + image, each with
      the mock's own named keyframe: fob_zoom/fob_wipe/fob_rise/fob_focus/
      fob_split), Ken Burns hero fade-in, "waiting" line, final reveal
      (logo/headline/rule/eyebrow/CTA). Loads Cormorant Garamond + Jost from
      Google Fonts on demand (only when the takeover actually renders, not
      on every page load). Dismiss via close-button click or Escape key.
      localStorage key renamed fob_launch_dismissed (functional preference,
      not a cookie — OQ-2 resolution carried over unchanged).
    - webapp-customer/en/site.css — old .topsheet component and the
      --banner-h nav/body push-down mechanism REMOVED (dead weight; a
      full-screen overlay needs no content-shifting). New .launch component
      tree + all 16 named keyframes ported verbatim from the mock's values
      (durations, easings, delays, transforms all match). Added a
      prefers-reduced-motion block NOT present in the raw mock: collapses
      straight to the final reveal panel with no slideshow, consistent with
      this site's UXC-MOT-2 convention applied everywhere else.
    - webapp-customer/en/img/man-womam-stpauls.jpg (NEW) — the one mock
      asset not already present on-site; copied in for the "2" countdown
      step. All other countdown/hero images reused existing site assets.
  deviations_from_mock:
    - CTA href kept as /en/book/ (not the mock's placeholder /tours) — honors
      the sponsor's earlier explicit OQ-1 resolution ("the click will take
      you booking a tour"), not a rendering gap.
    - Renamed the CTA's CSS/JS class from .cta to .launch-cta — the mock's
      class name collided with the site's own pre-existing homepage CTA
      section (also .cta), which would have made future global .cta rules
      silently apply to both. Caught via CDP DOM query returning the wrong
      element in testing, fixed at the source rather than leaving it
      dependent on selector scoping.
    - Added the reduced-motion fallback (see above) — the mock has none.
  verification: >-
    Headless Chrome via CDP, not a static read, across a full test pass:
    countdown renders all 5 numerals with correct Cormorant Garamond font
    application; screenshots captured at t=0.9s/3.6s/7.6s/12.6s/14.1s show
    the sequence progressing correctly (numeral -> hero fade-in ->
    "waiting has finally stopped" -> final reveal, matching the mock's own
    timing to the tested checkpoints); close-button click removes the
    overlay, sets localStorage, and the dismissal persists across reload;
    Escape key dismisses independently; CTA resolves to /en/book/ with the
    correct scoped selector; prefers-reduced-motion collapses instantly to
    the final panel with the slideshow hidden; zero console errors across
    every run.

