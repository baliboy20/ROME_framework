Priority: HIGH
Title: "Customer web: launch countdown takeover with preview-ride application CTA"
DesignSupersession: >-
  REDESIGNED 2026-07-28 against sponsor-supplied mock "Launch Countdown
  Banner.dc.html" (received as fob-free-rides-banner.zip). The original build
  (2026-07-28, earlier same day) was a slim green topsheet that pushed the
  nav/content down — a reasonable reading of "topsheet" in the title below,
  but not what the sponsor actually wanted. The mock specifies a full-screen,
  once-per-browser cinematic takeover: a 5-4-3-2-1 countdown with rotating
  imagery and poetic taglines (1.35s per step), resolving into a Ken Burns
  hero image, then a fade line ("The waiting has finally stopped"), then the
  final reveal — logo, "Friends on Bikes is opening for tours", a drawn rule,
  an eyebrow, and a CTA button. Rebuilt to match; the old topsheet mechanism
  (--banner-h push-down var on nav/body) was removed as dead weight, since
  a full-screen overlay needs no content-shifting. The word "topsheet" below
  is now stale relative to the actual surface; kept for traceability rather
  than silently rewritten.
Description: |
  The customer website (webapp-customer) should present an announcement
  overlay/banner on first open, stating that:

    - the business opens for booking in autumn 2026;
    - routes are currently being trialled;
    - members of the public are welcome to APPLY to accompany the team as a
      guest on one of the preview rides being conducted;
    - a call-to-action leads to the application.

  Requested surface: site-wide, on first open of the site (not per-page on every
  navigation). Applies across the 11 static pages under `en/` and, if the
  overlay is to persist there, the Flutter booking island.

RequestedBy: sponsor
RequestedDate: 2026-07-27

