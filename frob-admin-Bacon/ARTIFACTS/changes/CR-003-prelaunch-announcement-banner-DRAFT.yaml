Priority: HIGH
Title: "Customer web: pre-launch announcement topsheet with preview-ride application CTA"
Description: |
  The customer website (webapp-customer) should present an announcement
  overlay/banner on first open, stating that:

    - the business opens for booking in autumn 2026;
    - routes are currently being trialled;
    - members of the public are welcome to APPLY to accompany the team as a
      guest on one of the preview rides being conducted;
    - a call-to-action leads to the application.

  Requested surface: site-wide, on first open of the site (not per-page on every
  navigation). Applies across the 11 static pages under `en/` and, if the
  overlay is to persist there, the Flutter booking island.

RequestedBy: sponsor
RequestedDate: 2026-07-27

# ─────────────────────────────────────────────────────────────────────────────
# CLASSIFICATION — NOT YET VALID FOR ROUTING
# ROME-AX-31: routeChange() refuses any change whose blast radius is not
# trace-verified. The radius below is DECLARED, not verified. Do not route.
