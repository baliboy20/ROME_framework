Title: "Admin: command palette — typeahead quick-navigation topsheet"
Description: |
  Add a topsheet overlay to the admin console that provides typeahead
  quick-navigation to any console destination. The Owner opens it from an icon
  in the top bar, types a fragment (e.g. "pay"), and sees a ranked dropdown of
  matching destinations (e.g. Payments & refunds, and other matches). Selecting
  one navigates there. A close button dismisses it.

RequestedBy: sponsor
RequestedDate: 2026-07-27

