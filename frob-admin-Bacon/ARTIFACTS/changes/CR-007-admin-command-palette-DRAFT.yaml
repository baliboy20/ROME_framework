RoutingRefusal:
  changeType: CT-4 (new capability)
  rule: PROP-054 A.1
  enforcedBy: ROME/rome-core/orchestrator/routing.js#routeChange
  message: >-
    "CT-4 (new capability) routes through the increment mechanism
    (rome-increment.cjs), never a change record."
  consequence: |
    routeChange('CT-4', ...) throws by design. This work must be admitted as an
    increment, which cannot begin while increment 2 (CR-002) is unsealed
    (ROME-AX-19, state.js#beginIncrement). This file is a holding record, not a
    submission.
  whyCT4: |
    It is not a modification of any delivered surface. It is a new navigation
    modality — a new overlay, a new search/ranking behaviour, a new entry point
    in the shell chrome — with no requirement, no surface ID, and no design
    entry behind it. Nothing in _requirements/ covers command-palette,
    typeahead, or quick-navigation. Classifying it CT-2 to reach the light path
    would be exactly the FINDING-001/002 gate escape.

BlastRadius:
  verified: false
  designImpacted: true
  requirements:
    - >-
        NEW REQ (unassigned ID) — Actor: Owner, Intent: navigate by search.
        No prior art exists.
  design:
    - >-
        A1 · Navigation (UXC-NAV-*) — the console is specified as "one persistent
        shell: a left sidebar tree-nav (collapsible to a 68px icon rail) + a top
        bar (context label left, operator + Sign out right)". This adds a second
        navigation modality alongside the sidebar tree and a new control to the
        top bar, whose contents are currently fully enumerated.
    - A3 · Modals & popups (UXC-MOD-*) — overlay behaviour, stacking. Note
      CR-001 already established that this console permits multiple concurrent
      modals which all auto-dismiss on navigation away; the palette both is an
      overlay and CAUSES navigation, so its interaction with that rule needs
      stating rather than assuming.
    - >-
        A11 · Accessibility (UXC-A11Y-*) — a typeahead overlay is a combobox
        pattern, and the demanding one: focus trap, `role="combobox"` +
        `aria-expanded` + `aria-activedescendant`, arrow-key traversal without
        losing input focus, screen-reader result-count announcement, Escape to
        close, focus returned to the top-bar trigger.
    - A8 · Motion (UXC-MOT-*) — entrance/exit, honouring reduced-motion.
    - _design/component-specs.md — new component spec (Track B / Parchment).
  code:
    - webapp-admin/lib/router/app_router.dart — currently the only enumeration
      of destinations (~25 `_shellRoute` registrations, lines 140-165). The
      palette needs a searchable destination registry; deriving it from the
      router keeps one source of truth, hand-maintaining a second list
      guarantees they diverge.
    - webapp-admin/lib/widgets/** — top-bar trigger + palette overlay widget
    - webapp-admin/lib/theme/tokens.dart — Track B (Parchment) tokens

DesignNotes:
  - Single-operator app (William, the Owner) per the design handoff, so results
    need no permission filtering — every destination is reachable by the only
    user. This materially simplifies the capability; confirm it stays true
    before building.
  - The admin console is specified as Mac only, fixed wide-screen, NOT
    responsive (TDR-13 as revised by DEV-5 — Flutter macOS desktop app, Web SPA
    retired). No mobile layout is required. Note the palette's keyboard
    shortcut must now respect macOS conventions (Cmd-K, and it must not
    collide with a system or menu-bar shortcut) rather than browser ones.
  - Track B (Parchment) tokens apply — Playfair Display for titles, Plus Jakarta
    Sans for functional text, mono for ids/labels. NOT the customer site's
    cream/Newsreader palette.

OpenQuestions:
  - id: OQ-1
    question: >-
      Does it search destinations only, or records too (a booking ref, a
      customer name, a bike id)? Destinations-only is a self-contained UI
      feature. Record search pulls in every repository, pagination, and
      permissions, and is a substantially larger capability. The description
      says "quicklinks to the menu navigation", which reads as destinations
      only — confirm, because it sets the size of the increment.
    status: OPEN
    blocking: true
  - id: OQ-2
    question: >-
      Keyboard shortcut in addition to the top-bar icon? The convention is
      Cmd/Ctrl-K. The request specifies only the icon; a palette without a
      keyboard opener loses most of its speed benefit for a daily operator.
    status: OPEN
    blocking: false
  - id: OQ-3
    question: >-
      Matching behaviour — prefix, substring, or fuzzy? And are synonyms needed
      (the sponsor's own example, "Pay", must reach "Payments & refunds", which
      prefix-matching on the label handles, but "refund" should probably reach
      it too). Recommend substring matching over label + a small synonym list
      per destination, no fuzzy ranking in v1.
    status: OPEN
    blocking: false

Sequencing:
