ID: CR-014
title: Email template images — content-addressed storage keys
status: DRAFT — raised 2026-07-29, not routed
raised_by: Roma, from a sponsor question about hosting template images on R2
requirement: REQ-NOTIF10 (as amended by FR-001)
surface: worker — src/modules/notifications/html-import.ts, src/index.ts

change_type:
  declared: CT-1
  rationale: >-
    A defect fix, not a change of intent. REQ-NOTIF10 as amended already requires that
    import "extract embedded images to object storage and rewrite every reference".
    The requirement does not change; the implementation fails to keep those references
    STABLE, so this restores intended behaviour.
    FLAGGED FOR THE ROUTER — if a reviewer judges that the naming scheme of stored
    objects is itself part of the contract (it is documented in api-contracts.md), this
    becomes CT-3. That is Roma's reading offered for confirmation, not an assumption.
  blast_radius:
    verified: false
    note: >-
      NOT trace-verified (ROME-AX-31). The files below were read directly and the list
      is believed complete, but no P1/P3 trace has been run, so this cannot be routed
      as it stands.
    touches:
      - >-
        SOURCE/worker/src/modules/notifications/html-import.ts — line 118, key
        generation. The only place a key is minted.
      - >-
        SOURCE/worker/src/index.ts — the /email-assets/* serve route. Needs NO change
        provided keys stay under the same prefix; the prefix guard is what restricts
        reachability to template imagery.
      - >-
        SOURCE/worker/test/html-import.test.ts — lines 30 and 47 assert the literal
        key `email-assets/tmpl_1/0-email.png`; both must change.
      - >-
        ARTIFACTS/_design/api-contracts.md — documents the key pattern in the
        import-html row.

problem:
  - >-
    Keys are POSITIONAL — `email-assets/<templateId>/<index>-email.<ext>`
    (html-import.ts:118). The index is the image's position in the document, so
    re-importing a template overwrites the previous import's images — a new first
    image lands on `0-email.jpg`.
  - >-
    Every email ALREADY SENT references that same URL. Re-importing therefore
    silently changes the pictures in messages customers received weeks ago. For a
    booking confirmation this is materially wrong — the customer's record of what
    they were told changes after the fact.
  - >-
    Responses are served `Cache-Control` public, max-age 31536000, immutable
    (index.ts). That header promises the bytes at a URL will never change, and the
    positional scheme breaks the promise. The practical result is WORSE than a clean
    change — caches holding the old image keep it, caches without it fetch the new
    one, and the same email renders differently for different recipients with no way
    to correct either.
  - >-
    Nothing deletes assets anywhere in the worker, so the overwrite reclaims no
    storage either. It only destroys the older image.

proposed:
  - >-
    Name each object by a hash of its BYTES rather than its position, e.g.
    `email-assets/<sha256-prefix>-email.<ext>`. A URL then denotes exactly one image
    for all time, so previously sent emails keep rendering what they were sent, and
    the immutable header becomes true rather than aspirational.
  - >-
    Side benefit, free — identical images reused across templates are stored once,
    because identical bytes produce an identical key.
  - >-
    IMPLEMENTATION NOTE, correcting the drafting assumption. `lib/hash.ts#sha256Hex`
    cannot be reused directly — it accepts a string and encodes it as UTF-8, whereas
    image payloads are raw bytes. Web Crypto's digest works on a Uint8Array directly,
    so the same pattern applies but needs either a byte-accepting variant in
    `lib/hash.ts` or a local helper in html-import.ts. Prefer widening `lib/hash.ts`
    so there is one hashing surface.
  - >-
    Keep the `-email` filename marker and the `email-assets/` prefix. The prefix is
    load-bearing — it is what the serve route checks, and it is why no other object
    in the bucket is reachable through that route.
  - >-
    The templateId path segment could be dropped once keys are content-addressed
    (the hash is globally unique), but keeping it costs nothing and preserves a
    readable grouping in the bucket. Either is defensible; state the choice rather
    than let it drift.

consequences:
  - >-
    ACCEPTED TRADE — with content addressing, assets can no longer be safely deleted.
    A historical email may reference any object indefinitely, so deletion would break
    old messages. Storage therefore grows monotonically. This is a deliberate
    consequence of the fix, not an oversight, and the retention position should be
    recorded explicitly rather than left implicit.
  - >-
    Existing objects keep their positional names. They continue to work while
    untouched, so the specific hazard UNTIL THIS LANDS is re-importing a template
    that already has images. Worth knowing operationally.

open_questions:
  - id: OQ-1
    blocking: false
    question: >-
      Migrate existing positional objects to content-addressed keys, or leave them?
    detail: >-
      Leaving them is safe — old emails keep working, and new imports write new-style
      keys alongside. Migrating means rewriting stored HTML in every affected template
      row, which is more work and more risk for no benefit to already-sent mail.
      Recommend leaving them, and noting the mixed scheme in the contract.
  - id: OQ-2
    blocking: false
    question: >-
      Add edge caching to the serve route at the same time?
    detail: >-
      Serving through the Worker bypasses Cloudflare's edge cache, so every cold fetch
      invokes the Worker and reads R2. Adding a cache lookup and put would remove that.
      DELIBERATELY NOT BUNDLED HERE — it is an optimisation and this is a correctness
      fix; mixing them makes the change harder to review and to revert. Raise
      separately if wanted.

non_goals:
  - >-
    DO NOT make the R2 bucket public to serve images directly. The ASSETS bucket is
    SHARED with the published website — sitemap.xml, robots.txt and
    tours/<locale>/<id>.html are all read from it by src/routes/seo.ts. Those are
    public by intent, so nothing would leak today, but making a shared bucket public
    means everything added to it afterwards is public too, silently and without
    review. The Worker in front is doing real work — it restricts reachability to the
    email-assets prefix.
  - >-
    Do not change the images themselves, the conversion rules, or the import report.

notes:
  - >-
    Provenance — raised when the sponsor asked whether hosting template images on R2
    is effective. Hosting is not really optional, since Gmail and Outlook do not
    render data URIs and inline images simply fail; and serving from the project's own
    domain aligns image origin with sending domain, which helps deliverability. The
    approach is sound. This defect is in the naming, not the decision.
  - >-
    Also confirmed sound and worth keeping as a recorded decision — image URLs are
    per-TEMPLATE, not per-recipient, so open-tracking is impossible by construction.
    Per-recipient URLs are how senders measure opens, and adopting them would bring
    consent obligations. The current design should not drift into that by accident.
  - >-
    Introduced by FR-001 workstream 5, committed 2026-07-29 in d067e57e.
