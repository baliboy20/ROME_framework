ID: CR-012
title: Owner password — replace unsalted SHA-256 with a salted KDF
status: DRAFT — logged 2026-07-28, deferred by sponsor ("not today")
raised_by: Roma, from FINDING-008 remaining item 3
requirement: REQ-AUTH01
surface: worker — src/routes/auth.ts, src/lib/hash.ts

change_type:
  declared: CT-1
  rationale: >
    REQ-AUTH01 states only that "Owner presents valid credentials" — it
    specifies no storage scheme, so hardening the hash changes no requirement.
    Defect fix.
  blast_radius:
    verified: false
    touches:
      - SOURCE/worker/src/routes/auth.ts (comparison)
      - SOURCE/worker/src/lib/hash.ts (sha256Hex)
      - SOURCE/worker/test/testEnv.ts (ownerPasswordHash helper)
      - SOURCE/worker/.dev.vars + deployed secrets (OWNER_PASSWORD_HASH)
      - test/auth.test.ts, test/auth-hardening.test.ts

problem:
  - `OWNER_PASSWORD_HASH` is a plain, unsalted SHA-256 hex digest. SHA-256 is a
    fast hash, which is the opposite of what password storage needs: it makes
    offline guessing cheap if the secret ever leaks. Unsalted means the digest
    is directly rainbow-table-able.
  - Partially mitigated 2026-07-28 by login throttling (FINDING-008 item 2,
    delivered), which addresses ONLINE guessing. It does nothing for the offline
    case, which is the one that matters if the secret is ever exposed.

proposed:
  - Move to a slow, salted KDF. Note the constraint: Workers' Web Crypto offers
    **PBKDF2** natively; scrypt/argon2/bcrypt are not available without a WASM
    dependency, which TDR-02's "no unnecessary dependencies" posture disfavours.
    PBKDF2-HMAC-SHA256 with a high iteration count and a per-credential random
    salt is the pragmatic choice here — weaker than argon2 in principle, and
    still an enormous improvement over a bare digest.
  - Store salt alongside the digest (e.g. `iterations$salt$digest`) so the
    parameters can be raised later without a second migration.
  - Use a constant-time comparison; the current `===` on hex strings is
    theoretically timing-observable, though far from the main issue.

why_this_is_not_only_a_code_change:
  Changing the scheme INVALIDATES the stored credential — the existing hash
  cannot be converted, because the plaintext is not recoverable. So this needs a
  rotation plan, not just a deploy:
    1. Choose the new password.
    2. Generate the new value with the new scheme.
    3. `wrangler secret put OWNER_PASSWORD_HASH` per environment.
    4. Deploy code and secret together — deploying either alone locks the Owner
       out of the back office until the other lands.
  Local `.dev.vars` must be updated in step with it, and `test/testEnv.ts`'s
  `ownerPasswordHash` helper must move to the new scheme or every auth test
  fails.

open_questions:
  - id: OQ-1
    question: >
      Accept PBKDF2 (native, no dependency) or take a WASM argon2 despite the
      dependency posture? Recommendation: PBKDF2 — the marginal security gain
      from argon2 does not justify a WASM dependency in the auth path for a
      single-operator system.
    blocking: true
  - id: OQ-2
    question: >
      Is there more than one operator credential in practice? The schema allows
      `secondary_operator` sessions, but only `OWNER_EMAIL`/`OWNER_PASSWORD_HASH`
      exist as configuration. If secondary operators are ever real, credentials
      belong in D1 rather than in environment secrets, which is a larger change
      and should be decided before this one is built rather than after.
