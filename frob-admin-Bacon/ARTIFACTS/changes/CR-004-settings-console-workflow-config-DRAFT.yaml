BlastRadius:
  verified: false
  designImpacted: true
  requirements:
    - REQ-NOTIF11 (send booking-outcome confirmation email) — DIRECT CONFLICT.
      See OQ-1. The delivered requirement guarantees a confirmed booking is
      never left un-notified (it falls back to built-in plain text when no
      active template exists) and its stated purpose is to close the
      confirmation-email half of the UXC-FBK-1 two-channel rule. An owner-facing
      "auto-reply on booking: off" switch would let the Owner repeal that
      guarantee from a settings page.
    - REQ-NOTIF10 (update email-template) — adjacent, and currently under
      concurrent edit by the CR-002 session. Sequence after CR-002 seals.
    - REQ-NOTIF02 (deliverability state) / REQ-TOUR07 (cancellation notices) —
      likely siblings if "workflow config" grows to cover reminders and
      cancellation messaging, which the sponsor's "etc." implies.
    - NEW REQ (unassigned ID) — no delivered requirement covers an owner-facing
      workflow-automation configuration capability as such.
  design:
    - UXC-FBK-1 (two-channel rule: page AND email) — the binding constraint.
      Making confirmation email optional needs this rule amended or an explicit
      carve-out, at design tier, with sponsor sign-off.
    - A1 Navigation / screen inventory — see drift_note above.
    - _design/component-specs.md — tabbed settings shell.
    NOTE: the _design documents are project-wide (one file covers all four apps)
    and are in the CR-002 session's uncommitted working set.
  code:
    - webapp-admin/lib/features/settings/** (entity, model, repo, bloc, page —
      the whole slice widens if OperatorSettings gains workflow fields)
    - webapp-admin/pubspec.yaml — currently `version: 0.1.0`. Displaying a
      version means deciding what the version MEANS (see OQ-2).
    - the dispatcher path that REQ-NOTIF11 hooks (Stripe webhook fulfilment +
      reconciliation sweep) if any toggle is to be honoured at send time

OpenQuestions:
  - id: OQ-1
    question: >-
      Can the Owner actually switch off the booking confirmation email?
    status: OPEN
    blocking: true
    analysis: |
      REQ-NOTIF11 is explicit: "if no active template exists a built-in
      plain-text fallback is used so a confirmed booking is never left
      un-notified", and it exists to satisfy UXC-FBK-1. A customer who has just
      paid receives their reference, ride details and meeting point by email.
      A settings toggle that suppresses that is not a preference — it removes
      the customer's only durable record of a transaction they paid for, and
      may carry consumer-law exposure beyond the design rule.
    options:
      - A: Configure the CONTENT and TIMING of automated messages, never their
          existence. Transactional confirmations stay mandatory; the workflow
          panel governs which template is used, reminder milestones (already
          modelled), and optional non-transactional follow-ups. RECOMMENDED —
          gives the sponsor what they asked for without repealing UXC-FBK-1.
      - B: Allow suppression, but only for genuinely optional message classes
          (marketing, post-ride follow-up), with transactional sends
          hard-excluded from the toggle set in the requirement itself.
      - C: Allow suppression of the confirmation email. Requires amending
          REQ-NOTIF11's invariant and UXC-FBK-1, with explicit sponsor sign-off
          on the consequence. NOT RECOMMENDED.
  - id: OQ-2
    question: >-
      What version is displayed, and where does it come from? `pubspec.yaml`
      says 0.1.0, which is stale and app-local. Candidates: the pubspec version,
      the build/commit SHA, the ROME project version (currently mid-migration
      3.2.1 -> 3.3.0), or a composite. Support requests are the use case, so it
      should identify a BUILD, not a marketing version.
    status: OPEN
    blocking: false
  - id: OQ-3
    question: >-
      Which tabs exist at delivery? The request says "tabs for other settings as
      they arise", but a tab bar with one populated tab is worse than no tab bar.
      Proposal: ship with Operations (the three delivered fields), Workflow (per
      OQ-1), and About (version) — three real tabs, no empty placeholders.
    status: OPEN
    blocking: false

Sequencing:
  - Increment 2 (CR-002) is open and unsealed at P5; no new increment can begin
