Title: "Admin: settings console — app version, tabbed shell, workflow configuration"
Description: |
  Extend the admin app's settings surface so it:

    (1) displays the running application version;
    (2) becomes a TABBED shell, so further settings groups can be added over
        time without redesigning the page;
    (3) holds workflow configuration — the sponsor's example being
        "auto-reply when a booking is made".

RequestedBy: sponsor
RequestedDate: 2026-07-27

PriorArt:
  note: |
    This is an EXTENSION of a delivered surface, not a new one. It already
    exists and is routed:
      - lib/features/settings/presentation/pages/settings_page.dart
      - registered at `/settings` in lib/router/app_router.dart:162
      - full clean-architecture slice already present (entity, repository,
        remote data source, usecases, bloc)
    The delivered `OperatorSettings` entity carries three fields today:
      - refundCutoffHours (int)
      - reminderMilestones (List<String>)
      - cancellationRemediationOptions (List<String>)
    The page is currently a single flat form with no tabs.

  drift_note: |
    Worth raising at gate independently of this CR: the settings surface has NO
    entry in the A1-A20 back-office screen inventory in
    `_user_input/design-handoff/README.md`, yet it is built, routed, and
    reachable. Delivered code with no corresponding design-inventory surface is
    the FINDING-002 contract-drift class. CR-004 should either allocate it a
    surface ID or record why it is exempt.

