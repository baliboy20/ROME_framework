ID: CR-013
title: Audit coverage — admin mutations are not attributed to the Owner
status: DRAFT — logged 2026-07-28, deferred by sponsor ("not today")
raised_by: Roma, from FINDING-008 remaining item 5
requirement: REQ-AUTH01 (primary), REQ-CNA03, REQ-OPS09
surface: worker — admin mutation routes

change_type:
  declared: CT-1
  rationale: >
    This is a defect, not new scope. REQ-AUTH01's postcondition states:
    "Owner's subsequent actions are attributed to their identity in the audit
    record." Most Owner actions are not. The requirement is delivered in name
    but not in behaviour, which is the FINDING-001/002 pattern again — a stated
    guarantee that nothing verifies.
  blast_radius:
    verified: false
    touches:
      - SOURCE/worker/src/routes/* (admin mutation handlers)
      - SOURCE/worker/src/db/client.ts (auditLog repository)
      - possibly src/index.ts if implemented as middleware

measured:
  audit_write_sites: 5
  breakdown:
    - routes/fleet.ts (2)
    - routes/tourops.ts (1)
    - routes/auth.ts (1 — owner_login)
    - modules/consent/audit.ts (1)
  correction: >
    FINDING-008 stated "12 explicit call sites". The actual count is 5. The
    finding OVERSTATED existing coverage, so the gap is wider than reported.

unaudited_examples: |-
  Drawn from the ~14 dangerous writes mapped during CR-008 work — none of these
  currently write an audit entry:
    - refund issued (money leaves the business)
    - booking state transition
    - booking cancelled / departure cancelled
    - tour deleted
    - email template deleted
    - operator email sent to a customer
    - enquiry replied to
    - compliance expiry renewed
    - settings changed
  Fleet clear-to-service and incident dispatch ARE audited (the 2 fleet sites +
  1 tourops site), so the coverage is not absent, just sparse and arbitrary —
  which is worse than uniformly absent, because a reader of `audit_log` cannot
  tell whether "no entry" means "did not happen" or "not instrumented".

proposed:
  - Prefer MIDDLEWARE over per-handler calls. The current pattern is 5 hand-
    written call sites, and hand-discipline is exactly what produced the gap.
    An `/admin/*` post-response hook that records actor, method, path, subject
    id and outcome would cover every mutation by construction, present and
    future.
  - Per-handler enrichment can then add domain detail (amounts, old/new state)
    where it matters, on top of a guaranteed baseline.
  - >-
      Add a conformance test in the FINDING-008 style: assert that a successful
      mutating request to each `/admin/*` route produces an audit row. Mechanical,
      and it prevents silent regression.

open_questions:
  - id: OQ-1
    question: >
      Audit reads as well as writes? REQ-CNA04 and REQ-OPS09 imply write/erasure
      auditing. Reads of customer PII (the tour-hub data FINDING-008 exposed)
      may warrant it under GDPR accountability, but that is a policy call, not
      a technical one. Recommendation: writes now, revisit reads deliberately
      rather than by omission.
    blocking: false
  - id: OQ-2
    question: >
      Retention? `audit_log` currently grows without bound and REQ-CNA04's
      erasure path does not mention it. An audit log that is itself subject to
      erasure needs its rules stated.
    blocking: false

notes:
  - >-
      Interaction with FR-001 workstream 6 (MCP): if an assistant can drive admin
      operations, attribution stops being a nicety — "who did this" must
      distinguish the Owner from an agent acting on their behalf. This CR should
      land BEFORE the MCP work, or the MCP work inherits an audit trail that
      cannot answer the question it will most be asked.
