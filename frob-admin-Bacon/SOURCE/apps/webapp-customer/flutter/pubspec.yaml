name: fob_webapp_customer_booking_island
description: >
  FOB webapp-customer — booking-flow Flutter Web island (W4-W10: selection,
  attendees, consent, review, embedded Stripe checkout, confirmation).
  Mounts into the static booking page's #booking-island div; not a full SPA
  (TDR-13). Track A Forest tokens (design-system.md §1-§7, TDR-15).
publish_to: "none"
version: 0.1.0

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_bloc: ^8.1.6
  http: ^1.2.2
  intl: ^0.19.0
  web: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: Newsreader
      fonts:
        - asset: assets/fonts/Newsreader.ttf
    - family: Instrument Sans
      fonts:
        - asset: assets/fonts/InstrumentSans.ttf
