<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<!-- Canonical base for the mounted Flutter island's asset resolution
     (main.dart.js, assets/, FontManifest, CanvasKit). Every OTHER resource on
     this page uses an absolute /en/… path, so this base only affects the
     island — exactly matching how the standalone island build resolves. -->
<base href="/en/book/flutter/">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Book your tour — Friends on Bikes</title>
<meta name="robots" content="noindex">
<!-- The booking + payment island reads this to reach the frob admin backend
     (api-worker). DEV points at the local worker; swap for publish. -->
<meta name="fob-api-base" content="https://api-staging.friendsonbikes.uk">
<link rel="canonical" href="https://friendsonbikes.uk/en/book/">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<!-- Stripe.js — required by the payment step (interop/stripe_embedded_checkout_interop.dart,
     window.Stripe(...), BOOK04, TDR-06). Must live on the HOST page since the
     island is mounted here, not served standalone. -->
<script src="https://js.stripe.com/v3/"></script>
<link rel="stylesheet" href="/en/site.css">
<style>
/* Page-specific rules — shared tokens/components live in /en/site.css */
/* Page frame */
.book-head{padding:112px 48px 20px;max-width:1000px;margin:0 auto}
.book-head .eyebrow{text-transform:uppercase;letter-spacing:.22em;font-size:13px;color:var(--green);margin-bottom:14px}
.book-head h1{font-family:var(--serif);font-weight:500;font-size:clamp(32px,4.5vw,52px);letter-spacing:-.02em;line-height:1.04}
.book-head p{font-size:16px;line-height:1.55;color:var(--body);max-width:560px;margin-top:14px}
/* Island container — the Flutter booking+payment flow mounts here */
.island-wrap{max-width:1000px;margin:0 auto 48px;padding:0 48px}
/* Viewport-tall so the Flutter island scrolls its own content internally
   (as it did standalone) — otherwise a tall step like Stripe checkout would
   overflow a short fixed box. Flutter fills hostElement and handles the scroll. */
#booking-island{position:relative;height:calc(100vh - 200px);min-height:640px;background:var(--card);border:1px solid rgba(26,25,22,.09);border-radius:8px;overflow:hidden;box-shadow:0 1px 2px rgba(26,25,22,.04)}
#booking-island flt-glass-pane,#booking-island flutter-view{border-radius:8px}
.island-noscript{padding:56px 44px;color:var(--body)}
.island-noscript strong{color:var(--ink-2)}
/* Skeleton shown until the island hydrates */
.island-skeleton{position:absolute;inset:0;display:flex;flex-direction:column;gap:16px;padding:44px;pointer-events:none}
.island-skeleton .bar{background:linear-gradient(90deg,#efece3 0%,#f4f1e8 50%,#efece3 100%);background-size:200% 100%;animation:sk 1.3s ease-in-out infinite;border-radius:6px}
.island-skeleton .bar.t{height:26px;width:40%}
.island-skeleton .bar.r{height:64px;width:100%}
.island-skeleton .bar.h{height:220px;width:100%}
[data-hydrated="true"] .island-skeleton{display:none}
@keyframes sk{0%{background-position:200% 0}100%{background-position:-200% 0}}
@media (prefers-reduced-motion:reduce){.island-skeleton .bar{animation:none}}
footer{padding:44px 40px 36px}
footer .frow{max-width:1000px;gap:16px;font-size:13px}
footer .brand{font-size:20px}
footer .secure{color:rgba(246,244,238,.5)}
@media(max-width:700px){.nlinks{display:none}.island-wrap,.book-head{padding-left:24px;padding-right:24px}}
</style>
</head>
<body>
<a class="skip-link" href="#main">Skip to content</a>

<nav class="top on">
  <a href="/en/"><img src="/en/img/logo.webp" alt="Friends on Bikes"></a>
  <div class="nlinks">
    <a href="/en/tours/">Our Tours</a>
    <a href="/en/saved.html">Saved</a>
    <a href="/en/hub.html">Manage booking</a>
    <a href="/en/contact.html">Contact</a>
  </div>
</nav>

<header class="book-head" id="main">
  <p class="eyebrow">Secure booking</p>
  <h1>Book your tour</h1>
  <p>Select your date, add attendees and pay securely — all on this page, no redirects. Payments handled by Stripe.</p>
</header>

<section class="island-wrap">
  <!--
    Flutter Web island mount (TDR-13). Single stateful island covering W4–W10
    (tour select → date/slot → attendees & consent → review → Stripe payment →
    confirmation) so state persists across steps without page navigation. It
    reads fob-api-base above and talks to the frob admin backend (api-worker,
    BOOK01–05) and mounts Stripe Embedded Checkout for payment (BOOK04).
    data-island-base is the absolute path the built island assets live at.
  -->
  <div id="booking-island" class="island-mount" data-island="booking" data-island-base="/en/book/flutter/">
    <div class="island-skeleton" aria-hidden="true">
      <div class="bar t"></div>
      <div class="bar r"></div>
      <div class="bar r"></div>
      <div class="bar h"></div>
    </div>
    <noscript>
      <div class="island-noscript" role="status">
        <p><strong>Booking requires JavaScript.</strong></p>
        <p>Please enable JavaScript to select a date, add attendees and pay for
        your tour, or call us on 020 1234 5678 to book by phone.</p>
      </div>
    </noscript>
  </div>
</section>

<footer>
  <div class="frow">
    <span class="brand">Friends on Bikes</span>
    <span class="secure">🔒 Secure payments by Stripe · Barbican Centre, Silk Street, London EC2Y 8DS</span>
  </div>
</footer>

<script src="/en/island-loader.js" defer></script>
<script src="/en/consent.js" defer></script>
<script src="/en/announce.js" defer></script>
</body>
</html>
