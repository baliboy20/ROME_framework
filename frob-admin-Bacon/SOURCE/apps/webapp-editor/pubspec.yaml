name: fob_webapp_editor
description: >
  FOB webapp-editor — content-authoring surface feeding the static
  publish (SEO01/02 source content). Full Flutter Web SPA (no SEO).
  satisfies: TDR-13.
publish_to: "none"
version: 0.1.0

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_bloc: ^8.1.6
  go_router: ^14.6.2
  get_it: ^8.0.3
  http: ^1.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
