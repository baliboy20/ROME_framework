name: fob_mobile_guide
description: >
  FOB mobile-guide — Flutter Web PWA ONLY (DEV-3 / TDR-13 revised;
  iOS-native primary dropped). Guide field playbook: readiness gates,
  rider check-in, incident/hazard logging. Offline-critical once a tour
  starts (TDR-16 as revised by DEV-2 — PWA storage swap).
publish_to: "none"
version: 0.1.0

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_map: ^7.0.2
  flutter_bloc: ^8.1.6
  go_router: ^14.6.2
  get_it: ^8.0.3
  sembast_web: ^2.4.1
  sembast: ^3.7.2
  http: ^1.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  fonts:
    - family: Playfair Display
      fonts:
        - asset: assets/fonts/PlayfairDisplay.ttf
    - family: Plus Jakarta Sans
      fonts:
        - asset: assets/fonts/PlusJakartaSans.ttf
