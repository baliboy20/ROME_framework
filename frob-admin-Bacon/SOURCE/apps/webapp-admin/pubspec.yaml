name: fob_webapp_admin
description: >
  FOB webapp-admin — Owner/operator planning & oversight console.
  Full Flutter Web SPA (no SEO). Renders from the sponsor parchment
  mockup design system (DEV-1 / TDR-15). satisfies: TDR-13.
publish_to: "none"
version: 0.1.0

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_bloc: ^8.1.6
  go_router: ^14.6.2
  get_it: ^8.0.3
  equatable: ^2.0.5
  http: ^1.2.2
  intl: ^0.19.0
  table_calendar: ^3.1.2
  package_info_plus: ^10.2.1
  image: ^4.9.1
  file_selector: ^1.1.0
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  # FR-001 workstream 2 (2026-07-28): no bundled fonts. This app is a macOS
  # desktop app (DEV-5) and now renders in the platform faces — SF Pro (resolved
  # by passing a null fontFamily) and SF Mono, with Menlo as fallback. See
  # lib/theme/tokens.dart#FobText.
  #
  # The previously bundled faces (Source Serif 4, Plus Jakarta Sans) are
  # unbundled here rather than deleted from assets/fonts/, so the change is
  # reversible in one edit if the platform faces prove unsatisfactory in situ.
  # Delete the .ttf files once this is gated and settled.
  #
  # NOTE the history this supersedes: FINDING-003 was raised precisely because
  # the theme referenced fonts that were NOT bundled. Referencing nothing is
  # safe in a way that referencing-but-not-bundling was not — a null family
  # always resolves, whereas a missing named family fails silently to whatever
  # the platform substitutes.
