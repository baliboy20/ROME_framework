name: fob_webapp_admin
description: >
  FOB webapp-admin — Owner/operator planning & oversight console.
  Full Flutter Web SPA (no SEO). Renders from the sponsor parchment
  mockup design system (DEV-1 / TDR-15). satisfies: TDR-13.
publish_to: "none"
version: 0.1.0

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_bloc: ^8.1.6
  go_router: ^14.6.2
  get_it: ^8.0.3
  http: ^1.2.2
  intl: ^0.19.0
  table_calendar: ^3.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  # FINDING-003: bundle the parchment mockup fonts the theme references
  # (Playfair Display serif for titles/price; Plus Jakarta Sans for body).
  fonts:
    - family: Playfair Display
      fonts:
        - asset: assets/fonts/PlayfairDisplay.ttf
    - family: Plus Jakarta Sans
      fonts:
        - asset: assets/fonts/PlusJakartaSans.ttf
