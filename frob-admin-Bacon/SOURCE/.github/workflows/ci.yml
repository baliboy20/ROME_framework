# FOB CI — lint + test + build for all 7 components; deploy is manual/gated
# (satisfies: TDR-14 — no automated on-content-change / on-merge deploy).
name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy_env:
        description: "Environment to deploy (manual only)"
        required: false
        type: choice
        options: [staging, production]

jobs:
  worker:
    name: worker (lint + typecheck + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: SOURCE/worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: SOURCE/worker/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test

  flutter-apps:
    name: ${{ matrix.app }} (analyze + test + build web)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [webapp-admin, webapp-editor, mobile-guide]
    defaults:
      run:
        working-directory: SOURCE/apps/${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build web --release

  webapp-customer:
    name: webapp-customer (static site check)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: SOURCE/apps/webapp-customer
    steps:
      - uses: actions/checkout@v4
      - name: Verify per-locale directories present
        run: |
          test -d en || test -d fr || test -d es || echo "no locale dirs yet (P5 scaffold pending)"

  # ---------------------------------------------------------------------
  # Deploy — MANUAL ONLY (TDR-14 posture applied to infra deploys too).
  # Triggered via workflow_dispatch, never on push/PR. Requires the
  # `staging` or `production` GitHub Environment (with required reviewers)
  # to hold the CLOUDFLARE_API_TOKEN secret.
  # ---------------------------------------------------------------------
  deploy:
    name: deploy (manual gate)
    needs: [worker, flutter-apps, webapp-customer]
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.deploy_env }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Deploy worker
        working-directory: SOURCE/worker
        run: |
          npm ci
          npx wrangler deploy --env ${{ github.event.inputs.deploy_env }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Deploy Pages apps (placeholder — P5 fills real build+deploy per app)
        run: echo "Deploy webapp-admin/webapp-editor/webapp-customer/mobile-guide to Cloudflare Pages here"
