<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="stripe_embedded_checkout_poc">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>stripe_embedded_checkout_poc</title>
  <link rel="manifest" href="manifest.json">

  <!--
    Stripe.js, loaded from js.stripe.com per Stripe's PCI-compliance
    requirement (never bundle/self-host this script). Version segment
    verified against https://docs.stripe.com/checkout/embedded/quickstart
    at the time this POC was built (see LEARNINGS.md "Phase 2" section for
    the exact date). The JS interop in
    lib/presentation/stripe_embedded_checkout_interop.dart assumes this
    script has already run by the time it calls the global `Stripe(...)`
    constructor. This POC uses `ui_mode: 'embedded'` /
    `stripe.initEmbeddedCheckout(...)` (see the interop file's header
    comment) — not the newer `embedded_page` mode.
  -->
  <script src="https://js.stripe.com/dahlia/stripe.js"></script>

  <!--
    No Content-Security-Policy meta tag here by design: CSP is a Cloudflare
    Pages deployment concern and belongs in a `_headers` file, not this POC.
    Whoever writes that `_headers` file will need to allow (at minimum):
      - js.stripe.com    (loading Stripe.js itself)
      - checkout.stripe.com (the Embedded Checkout iframe content)
      - api.stripe.com   (Stripe.js's own XHR/fetch calls)
  -->
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
