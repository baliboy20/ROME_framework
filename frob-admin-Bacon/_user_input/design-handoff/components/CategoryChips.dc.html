<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="../_ds/fob-booking-admin-27b13c57-535e-46c0-8342-2fc620c9174c/tokens/colors.css">
  <link rel="stylesheet" href="../_ds/fob-booking-admin-27b13c57-535e-46c0-8342-2fc620c9174c/tokens/typography.css">
  <link rel="stylesheet" href="../_ds/fob-booking-admin-27b13c57-535e-46c0-8342-2fc620c9174c/tokens/alpha-ladder.css">
  <link rel="stylesheet" href="../_ds/fob-booking-admin-27b13c57-535e-46c0-8342-2fc620c9174c/styles.css">
</helmet>
<div style="display:flex;flex-wrap:wrap;gap:8px">
  <sc-for list="{{ chips }}" as="c" hint-placeholder-count="3">
    <div onClick="{{ c.onClick }}" style="{{ c.style }}">{{ c.label }}</div>
  </sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:320,&quot;height&quot;:48},&quot;options&quot;:{&quot;editor&quot;:null,&quot;default&quot;:[&quot;Mechanical&quot;,&quot;Illness&quot;,&quot;Early leave&quot;],&quot;tsType&quot;:&quot;string[]&quot;},&quot;value&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Mechanical&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;onChange&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;(value: string) =&gt; void&quot;}}">
class Component extends DCLogic {
  renderVals(){
    let options = this.props.options ?? ['Mechanical','Illness','Early leave'];
    if(typeof options === 'string') options = options.split(',').map(s=>s.trim()).filter(Boolean);
    const value = this.state.value != null ? this.state.value : (this.props.value ?? options[0]);
    const onChange = this.props.onChange;
    const chips = options.map(opt => {
      const active = opt === value;
      return { label:opt,
        onClick: () => { this.setState({ value:opt }); if(onChange) onChange(opt); },
        style:'cursor:pointer;padding:8px 14px;border-radius:var(--radius-round);font:600 12.5px var(--font-sans);transition:background .12s;'+(active?'background:var(--gradient-brand);color:var(--pill-ink)':'background:var(--wb05);color:var(--text-body);border:1px solid var(--wb16)') };
    });
    return { chips };
  }
}
</script>
</body>
</html>
