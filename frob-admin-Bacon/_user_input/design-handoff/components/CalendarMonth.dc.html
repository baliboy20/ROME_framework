<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="../_ds/fob-booking-admin-27b13c57-535e-46c0-8342-2fc620c9174c/tokens/colors.css">
  <link rel="stylesheet" href="../_ds/fob-booking-admin-27b13c57-535e-46c0-8342-2fc620c9174c/tokens/typography.css">
  <link rel="stylesheet" href="../_ds/fob-booking-admin-27b13c57-535e-46c0-8342-2fc620c9174c/tokens/alpha-ladder.css">
  <link rel="stylesheet" href="../_ds/fob-booking-admin-27b13c57-535e-46c0-8342-2fc620c9174c/styles.css">
</helmet>
<div>
  <div style="font:600 15px var(--font-serif);color:var(--text-strong);margin-bottom:12px">{{ monthLabel }}</div>
  <div style="background:var(--surface-card);border:1px solid var(--wb12);border-radius:var(--radius-card);overflow:hidden">
    <div style="display:grid;grid-template-columns:repeat(7,1fr);border-bottom:1px solid var(--wb12);background:var(--wb03)">
      <sc-for list="{{ dow }}" as="d" hint-placeholder-count="7">
        <div style="font:600 10px var(--font-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--text-label);padding:9px 8px">{{ d }}</div>
      </sc-for>
    </div>
    <div style="display:grid;grid-template-columns:repeat(7,1fr)">
      <sc-for list="{{ cells }}" as="c" hint-placeholder-count="42">
        <div style="{{ c.cellStyle }}">
          <div style="font:600 11px var(--font-mono);color:var(--text-muted);margin-bottom:5px">{{ c.day }}</div>
          <sc-for list="{{ c.events }}" as="e" hint-placeholder-count="0">
            <div onClick="{{ e.onClick }}" style="{{ e.style }}">
              <div style="font:600 11px var(--font-sans);color:var(--text-strong);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ e.label }}</div>
              <sc-if value="{{ e.hasSub }}" hint-placeholder-val="{{ true }}">
                <div style="font:500 9.5px var(--font-mono);color:var(--text-muted)">{{ e.sub }}</div>
              </sc-if>
            </div>
          </sc-for>
        </div>
      </sc-for>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:760,&quot;height&quot;:560},&quot;year&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:2026,&quot;min&quot;:2024,&quot;max&quot;:2030,&quot;tsType&quot;:&quot;number&quot;},&quot;month&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:7,&quot;min&quot;:0,&quot;max&quot;:11,&quot;tsType&quot;:&quot;number&quot;},&quot;events&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;{ day: number; label: string; sub?: string; tone?: 'lime' | 'orange' | 'cyan' | 'pink' }[]&quot;},&quot;onSelect&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;(event: any) =&gt; void&quot;}}">
class Component extends DCLogic {
  // events: [{ day, label, sub?, tone?: 'lime'|'orange'|'cyan'|'pink' }]
  renderVals(){
    const year = Number(this.props.year ?? 2026);
    const month = Number(this.props.month ?? 7); // 0-indexed (7 = Aug)
    const onSelect = this.props.onSelect;
    let events = this.props.events ?? [];
    const monthNames = ['January','February','March','April','May','June','July','August','September','October','November','December'];
    const first = new Date(year, month, 1).getDay();
    const dim = new Date(year, month+1, 0).getDate();
    const tint = { lime:['rgba(198,255,63,.16)','var(--accent-lime)'], orange:['rgba(255,122,26,.13)','var(--accent-orange)'], cyan:['rgba(34,211,238,.13)','var(--accent-cyan)'], pink:['rgba(255,45,155,.12)','var(--accent-pink)'], neutral:['var(--wb05)','var(--wb16)'] };
    const byDay = {};
    events.forEach(e => { (byDay[e.day] = byDay[e.day] || []).push(e); });
    const cells = [];
    for(let i=0;i<42;i++){
      const day = i - first + 1;
      const inMonth = day>=1 && day<=dim;
      const evs = inMonth ? (byDay[day]||[]).map(e => {
        const t = tint[e.tone] || tint.cyan;
        return { label:e.label, sub:e.sub, hasSub: !!e.sub, onClick: onSelect ? (()=>onSelect(e)) : (()=>{}),
          style:'cursor:pointer;padding:5px 7px;border-radius:7px;margin-bottom:4px;background:'+t[0]+';border-left:3px solid '+t[1] };
      }) : [];
      cells.push({ day: inMonth?String(day):'', events:evs,
        cellStyle:'min-height:96px;padding:7px 8px;border-right:1px solid var(--wb09);border-bottom:1px solid var(--wb09);'+(inMonth?'':'background:var(--wb03)') });
    }
    return { monthLabel: monthNames[month]+' '+year, dow:['Sun','Mon','Tue','Wed','Thu','Fri','Sat'], cells };
  }
}
</script>
</body>
</html>
