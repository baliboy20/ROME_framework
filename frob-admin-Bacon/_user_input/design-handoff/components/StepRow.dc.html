<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="../_ds/fob-booking-admin-27b13c57-535e-46c0-8342-2fc620c9174c/tokens/colors.css">
  <link rel="stylesheet" href="../_ds/fob-booking-admin-27b13c57-535e-46c0-8342-2fc620c9174c/tokens/typography.css">
  <link rel="stylesheet" href="../_ds/fob-booking-admin-27b13c57-535e-46c0-8342-2fc620c9174c/tokens/spacing.css">
  <link rel="stylesheet" href="../_ds/fob-booking-admin-27b13c57-535e-46c0-8342-2fc620c9174c/tokens/alpha-ladder.css">
  <link rel="stylesheet" href="../_ds/fob-booking-admin-27b13c57-535e-46c0-8342-2fc620c9174c/styles.css">
</helmet>
<div onClick="{{ onClick }}" style="{{ rowStyle }}">
  <div style="{{ numStyle }}">{{ numGlyph }}</div>
  <div style="flex:1;min-width:0">
    <div style="font:600 14.5px var(--font-sans);color:var(--text-strong)">{{ title }}</div>
    <sc-if value="{{ hasSub }}" hint-placeholder-val="{{ true }}">
      <div style="font:500 11px var(--font-mono);color:var(--text-muted);margin-top:2px">{{ sub }}</div>
    </sc-if>
  </div>
  <span style="{{ chipStyle }}">{{ chipText }}</span>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:340,&quot;height&quot;:64},&quot;num&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;1&quot;,&quot;tsType&quot;:&quot;string | number&quot;},&quot;title&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Travel kit checklist&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;sub&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;G3 · Typed confirm&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;status&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;current&quot;,&quot;options&quot;:[&quot;todo&quot;,&quot;current&quot;,&quot;done&quot;],&quot;tsType&quot;:&quot;'todo' | 'current' | 'done'&quot;},&quot;onClick&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;() =&gt; void&quot;}}">
class Component extends DCLogic {
  renderVals(){
    const status = this.props.status ?? 'todo'; // todo | current | done
    const num = this.props.num ?? '1';
    const done = status==='done', current = status==='current';
    const chipMap = { done:['Done','lime'], current:['Start','pink'], todo:['To do','neutral'] };
    const [chipText, hue] = chipMap[status] || chipMap.todo;
    const chipTint = { lime:['rgba(198,255,63,.20)','var(--lime-text-light)'], pink:['rgba(255,45,155,.12)','var(--pink-text-light)'], neutral:['var(--wb09)','var(--text-muted)'] }[hue];
    return {
      title: this.props.title ?? 'Step',
      sub: this.props.sub, hasSub: !!this.props.sub,
      onClick: this.props.onClick,
      numGlyph: done ? '✓' : num,
      chipText,
      rowStyle:'display:flex;align-items:center;gap:13px;padding:13px 14px;border-radius:var(--radius-card);cursor:pointer;background:var(--surface-card);border:1px solid '+(current?'var(--accent-pink)':'var(--wb12)'),
      numStyle:'width:26px;height:26px;flex:none;border-radius:50%;display:flex;align-items:center;justify-content:center;font:700 12px var(--font-mono);'+(done?'background:var(--accent-lime);color:var(--pill-ink)':current?'background:var(--gradient-brand);color:var(--pill-ink)':'background:var(--wb09);color:var(--text-muted)'),
      chipStyle:'display:inline-block;padding:3px 9px;border-radius:var(--radius-round);font:600 9.5px var(--font-mono);letter-spacing:.04em;text-transform:uppercase;white-space:nowrap;background:'+chipTint[0]+';color:'+chipTint[1]
    };
  }
}
</script>
</body>
</html>
