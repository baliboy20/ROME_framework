<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="../_ds/fob-booking-admin-27b13c57-535e-46c0-8342-2fc620c9174c/tokens/colors.css">
  <link rel="stylesheet" href="../_ds/fob-booking-admin-27b13c57-535e-46c0-8342-2fc620c9174c/tokens/typography.css">
  <link rel="stylesheet" href="../_ds/fob-booking-admin-27b13c57-535e-46c0-8342-2fc620c9174c/tokens/alpha-ladder.css">
  <link rel="stylesheet" href="../_ds/fob-booking-admin-27b13c57-535e-46c0-8342-2fc620c9174c/styles.css">
</helmet>
<div>
  <sc-if value="{{ hasLabel }}" hint-placeholder-val="{{ true }}">
    <div style="font:600 10.5px var(--font-mono);text-transform:uppercase;letter-spacing:.08em;color:var(--text-label);margin-bottom:8px">{{ label }}</div>
  </sc-if>
  <div onClick="{{ sign }}" style="{{ padStyle }}">{{ display }}</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:320,&quot;height&quot;:120},&quot;signatory&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Emma Hart&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;label&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Guide signature&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;placeholder&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Tap to sign&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;signed&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;onSign&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;() =&gt; void&quot;}}">
class Component extends DCLogic {
  renderVals(){
    const controlled = this.props.signed != null;
    const signed = controlled ? this.props.signed : (this.state.signed ?? false);
    const name = this.props.signatory ?? 'Signature';
    const onSign = this.props.onSign;
    return {
      label: this.props.label ?? 'Signature', hasLabel: this.props.label !== '',
      display: signed ? name : (this.props.placeholder ?? 'Tap to sign'),
      sign: () => { if(!controlled) this.setState({ signed:true }); if(onSign) onSign(); },
      padStyle:'cursor:pointer;height:82px;border-radius:var(--radius-card);display:flex;align-items:center;justify-content:center;border:1.5px dashed '+(signed?'var(--accent-lime)':'var(--wb16)')+';background:'+(signed?'rgba(198,255,63,.1)':'var(--wb03)')+';font:'+(signed?'italic 600 26px var(--font-serif);color:var(--text-strong)':'500 13px var(--font-sans);color:var(--text-faint)')
    };
  }
}
</script>
</body>
</html>
