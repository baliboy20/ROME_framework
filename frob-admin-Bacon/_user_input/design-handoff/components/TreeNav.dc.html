<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="../_ds/fob-booking-admin-27b13c57-535e-46c0-8342-2fc620c9174c/tokens/colors.css">
  <link rel="stylesheet" href="../_ds/fob-booking-admin-27b13c57-535e-46c0-8342-2fc620c9174c/tokens/typography.css">
  <link rel="stylesheet" href="../_ds/fob-booking-admin-27b13c57-535e-46c0-8342-2fc620c9174c/tokens/alpha-ladder.css">
  <link rel="stylesheet" href="../_ds/fob-booking-admin-27b13c57-535e-46c0-8342-2fc620c9174c/styles.css">
</helmet>
<nav style="padding:8px 0">
  <sc-for list="{{ groups }}" as="g" hint-placeholder-count="4">
    <div style="margin-bottom:10px">
      <div onClick="{{ g.onToggle }}" style="{{ g.headerStyle }}">
        <span style="{{ g.chevronStyle }}">{{ g.chevron }}</span>
        <span style="{{ g.headerTextStyle }}">{{ g.title }}</span>
      </div>
      <div style="{{ g.childWrapStyle }}">
        <sc-for list="{{ g.items }}" as="it" hint-placeholder-count="3">
          <div onClick="{{ it.onClick }}" title="{{ it.title }}" style="{{ it.style }}">
            <sc-if value="{{ it.hasCode }}" hint-placeholder-val="{{ true }}">
              <span style="{{ it.codeStyle }}">{{ it.code }}</span>
            </sc-if>
            <span style="{{ it.labelStyle }}">{{ it.label }}</span>
          </div>
        </sc-for>
      </div>
    </div>
  </sc-for>
</nav>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:248,&quot;height&quot;:420},&quot;groups&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;{ title: string; items: { id: string; label: string; code?: string }[] }[]&quot;},&quot;active&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;collapsed&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;onSelect&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;(id: string) =&gt; void&quot;}}">
class Component extends DCLogic {
  // groups: [{ title, items: [{ id, label, code? }] }]
  constructor(props){ super(props); this.state = { open:{}, active:null }; }
  toggle = (t) => () => this.setState(s => ({ open:Object.assign({}, s.open, { [t]: s.open[t]===false }) }));
  select = (id) => () => { this.setState({ active:id }); if(this.props.onSelect) this.props.onSelect(id); };
  renderVals(){
    const collapsed = this.props.collapsed ?? false;
    const active = this.props.active != null ? this.props.active : this.state.active;
    const defs = this.props.groups ?? [];
    const groups = defs.map(g => {
      const open = this.state.open[g.title] !== false;
      const items = (g.items || []).map(it => {
        const on = it.id === active;
        return { label:it.label, code:it.code, hasCode: !!it.code && !collapsed || (!!it.code && collapsed),
          title: collapsed ? it.label : '', onClick: this.select(it.id),
          style:{ display:'flex', alignItems:'center', gap: collapsed?'0':'10px', justifyContent: collapsed?'center':'flex-start',
            padding: collapsed?'9px 0':'8px 12px', marginBottom:'2px', borderRadius:'10px', cursor:'pointer',
            font: on?'600 13px var(--font-sans)':'500 13px var(--font-sans)',
            color: on?'var(--text-strong)':'var(--text-body)', background: on?'var(--wb12)':'transparent' },
          codeStyle:{ font:'600 9px var(--font-mono)', opacity:.55, width: collapsed?'auto':'20px', flex:'none' },
          labelStyle: collapsed?{ display:'none' }:{ flex:1 } };
      });
      return { title:g.title, items,
        onToggle:this.toggle(g.title), chevron: open?'▾':'▸',
        chevronStyle:{ font:'8px var(--font-mono)', color:'var(--text-faint)', width:'9px', flex:'none' },
        headerStyle: collapsed?{ display:'none' }:{ display:'flex', alignItems:'center', gap:'7px', padding:'5px 10px', marginBottom:'2px', borderRadius:'8px', cursor:'pointer', userSelect:'none' },
        headerTextStyle:{ font:'600 9.5px var(--font-mono)', letterSpacing:'.14em', textTransform:'uppercase', color:'var(--text-faint)', flex:1 },
        childWrapStyle: (collapsed || open) ? (collapsed?{}:{ marginLeft:'15px', paddingLeft:'9px', borderLeft:'1px solid var(--wb09)' }) : { display:'none' } };
    });
    return { groups };
  }
}
</script>
</body>
</html>
