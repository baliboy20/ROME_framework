<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="../_ds/fob-booking-admin-27b13c57-535e-46c0-8342-2fc620c9174c/tokens/colors.css">
  <link rel="stylesheet" href="../_ds/fob-booking-admin-27b13c57-535e-46c0-8342-2fc620c9174c/tokens/typography.css">
  <link rel="stylesheet" href="../_ds/fob-booking-admin-27b13c57-535e-46c0-8342-2fc620c9174c/tokens/alpha-ladder.css">
  <link rel="stylesheet" href="../_ds/fob-booking-admin-27b13c57-535e-46c0-8342-2fc620c9174c/styles.css">
</helmet>
<span style="{{ badgeStyle }}">
  <span style="font:600 9.5px var(--font-mono);letter-spacing:.03em;text-transform:uppercase">{{ label }}</span>
  <span style="font:700 11px var(--font-sans)">{{ glyph }}</span>
</span>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:140,&quot;height&quot;:44},&quot;state&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;ok&quot;,&quot;options&quot;:[&quot;ok&quot;,&quot;partial&quot;,&quot;miss&quot;],&quot;tsType&quot;:&quot;'ok' | 'partial' | 'miss'&quot;},&quot;label&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;guide&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals(){
    const state = this.props.state ?? 'ok'; // ok | partial | miss
    const label = this.props.label ?? 'ready';
    const map = {
      ok:     { bg:'rgba(198,255,63,.20)', col:'var(--lime-text-light)',   glyph:'✓' },
      partial:{ bg:'rgba(255,122,26,.14)', col:'var(--orange-text-light)', glyph:'~' },
      miss:   { bg:'var(--wb05)',          col:'var(--text-faint)',        glyph:'✗' }
    };
    const m = map[state] || map.ok;
    return {
      label, glyph:m.glyph,
      badgeStyle:'display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:var(--radius-round);white-space:nowrap;background:'+m.bg+';color:'+m.col
    };
  }
}
</script>
</body>
</html>
