<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="../_ds/fob-booking-admin-27b13c57-535e-46c0-8342-2fc620c9174c/tokens/colors.css">
  <link rel="stylesheet" href="../_ds/fob-booking-admin-27b13c57-535e-46c0-8342-2fc620c9174c/tokens/typography.css">
  <link rel="stylesheet" href="../_ds/fob-booking-admin-27b13c57-535e-46c0-8342-2fc620c9174c/tokens/alpha-ladder.css">
  <link rel="stylesheet" href="../_ds/fob-booking-admin-27b13c57-535e-46c0-8342-2fc620c9174c/styles.css">
</helmet>
<div style="background:var(--surface-card);border:1px solid var(--wb12);border-radius:var(--radius-card);padding:18px 18px 16px">
  <div style="font:700 34px var(--font-serif);color:var(--text-strong);line-height:1">{{ value }}</div>
  <div style="display:flex;align-items:center;gap:7px;margin-top:9px">
    <span style="{{ dotStyle }}"></span>
    <span style="font:600 11.5px var(--font-sans);color:var(--text-muted)">{{ label }}</span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:200,&quot;height&quot;:110},&quot;value&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;11&quot;,&quot;tsType&quot;:&quot;string | number&quot;},&quot;label&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;In service&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;tone&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;lime&quot;,&quot;options&quot;:[&quot;lime&quot;,&quot;orange&quot;,&quot;cyan&quot;,&quot;pink&quot;,&quot;neutral&quot;],&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals(){
    const tone = this.props.tone ?? 'lime';
    const c = { lime:'var(--accent-lime)', orange:'var(--accent-orange)', cyan:'var(--accent-cyan)', pink:'var(--accent-pink)', neutral:'var(--wb16)' };
    return {
      value: this.props.value ?? '0',
      label: this.props.label ?? 'Items',
      dotStyle:'display:inline-block;width:9px;height:9px;flex:none;border-radius:50%;background:'+(c[tone]||c.neutral)
    };
  }
}
</script>
</body>
</html>
