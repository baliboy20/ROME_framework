<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ROME Management Console</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: #333;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        .header {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            padding: 20px 30px;
            margin-bottom: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            backdrop-filter: blur(10px);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            color: #4a5568;
            font-size: 28px;
            font-weight: 700;
        }

        .status-badge {
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 14px;
        }

        .status-online { background: #48bb78; color: white; }
        .status-offline { background: #f56565; color: white; }

        .dashboard {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        .card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            backdrop-filter: blur(10px);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.15);
        }

        .card h3 {
            color: #2d3748;
            margin-bottom: 15px;
            font-size: 18px;
            font-weight: 600;
        }

        .metric {
            font-size: 32px;
            font-weight: 700;
            color: #4c51bf;
            margin-bottom: 8px;
        }

        .metric-label {
            color: #718096;
            font-size: 14px;
            font-weight: 500;
        }

        .main-content {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 20px;
        }

        .robots-panel {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            backdrop-filter: blur(10px);
        }

        .robot-card {
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            padding: 16px;
            margin-bottom: 15px;
            transition: all 0.2s;
        }

        .robot-card:hover {
            border-color: #4c51bf;
            box-shadow: 0 4px 12px rgba(76, 81, 191, 0.15);
        }

        .robot-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .robot-name {
            font-weight: 600;
            font-size: 16px;
            color: #2d3748;
        }

        .robot-step {
            background: #4c51bf;
            color: white;
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
        }

        .progress-bar {
            background: #e2e8f0;
            border-radius: 10px;
            height: 8px;
            overflow: hidden;
            margin: 8px 0;
        }

        .progress-fill {
            background: linear-gradient(90deg, #48bb78, #38a169);
            height: 100%;
            transition: width 0.3s ease;
        }

        .robot-task {
            color: #718096;
            font-size: 14px;
            margin-top: 8px;
        }

        .controls-panel {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            backdrop-filter: blur(10px);
            height: fit-content;
        }

        .btn {
            width: 100%;
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            margin-bottom: 10px;
            transition: all 0.2s;
            font-size: 14px;
        }

        .btn-primary {
            background: #4c51bf;
            color: white;
        }

        .btn-primary:hover {
            background: #434190;
            transform: translateY(-1px);
        }

        .btn-secondary {
            background: #e2e8f0;
            color: #4a5568;
        }

        .btn-secondary:hover {
            background: #cbd5e0;
        }

        .search-box {
            width: 100%;
            padding: 12px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            font-size: 14px;
            margin-bottom: 10px;
            transition: border-color 0.2s;
        }

        .search-box:focus {
            outline: none;
            border-color: #4c51bf;
        }

        .loading {
            text-align: center;
            color: #718096;
            padding: 20px;
        }

        .error {
            background: #fed7d7;
            color: #c53030;
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 15px;
            font-size: 14px;
        }

        @media (max-width: 768px) {
            .dashboard {
                grid-template-columns: 1fr;
            }
            .main-content {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>🤖 ROME Management Console</h1>
            <div id="status-badge" class="status-badge status-offline">Connecting...</div>
        </header>

        <div class="dashboard">
            <div class="card">
                <h3>📊 Project Progress</h3>
                <div id="project-progress" class="metric">--%</div>
                <div class="metric-label">Overall Completion</div>
            </div>
            <div class="card">
                <h3>🤖 Active Robots</h3>
                <div id="active-robots" class="metric">--</div>
                <div class="metric-label">Currently Working</div>
            </div>
            <div class="card">
                <h3>📚 Documents</h3>
                <div id="total-documents" class="metric">--</div>
                <div class="metric-label">In Knowledge Base</div>
            </div>
        </div>

        <div class="main-content">
            <div class="robots-panel">
                <h3>🤖 Robot Status Dashboard</h3>
                <div id="robots-container">
                    <div class="loading">Loading robot status...</div>
                </div>
            </div>

            <div class="controls-panel">
                <h3>⚡ Quick Actions</h3>
                
                <input type="text" id="search-input" class="search-box" placeholder="Search ROME documents...">
                <button class="btn btn-primary" onclick="searchDocuments()">🔍 Search Knowledge</button>
                
                <hr style="margin: 20px 0; border: none; height: 1px; background: #e2e8f0;">
                
                <button class="btn btn-secondary" onclick="refreshStatus()">🔄 Refresh Status</button>
                <button class="btn btn-secondary" onclick="viewIntegration()">🔗 Integration Status</button>
                <button class="btn btn-secondary" onclick="viewContracts()">📋 View Contracts</button>
                <button class="btn btn-secondary" onclick="bulkUpload()">📁 Upload ROME Docs</button>
                <button class="btn btn-secondary" onclick="clearDatabase()">🗑️ Clear Database</button>
                <button class="btn btn-secondary" onclick="exportReport()">📊 Export Report</button>
                
                <div id="action-results" style="margin-top: 15px;"></div>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = 'http://localhost:8081';
        let refreshInterval;

        // Initialize the console
        async function init() {
            try {
                await checkServiceHealth();
                await loadDashboardData();
                await loadRobotStatus();
                startAutoRefresh();
            } catch (error) {
                showError('Failed to initialize console: ' + error.message);
            }
        }

        // Check if the ROME service is online
        async function checkServiceHealth() {
            try {
                const response = await fetch(`${API_BASE}/health`);
                const data = await response.json();
                
                if (data.success) {
                    document.getElementById('status-badge').textContent = 'Online';
                    document.getElementById('status-badge').className = 'status-badge status-online';
                } else {
                    throw new Error('Service unhealthy');
                }
            } catch (error) {
                document.getElementById('status-badge').textContent = 'Offline';
                document.getElementById('status-badge').className = 'status-badge status-offline';
                throw error;
            }
        }

        // Load main dashboard metrics
        async function loadDashboardData() {
            try {
                // Get coordination status
                const coordResponse = await fetch(`${API_BASE}/api/v1/coordination/status`);
                const coordData = await coordResponse.json();
                
                if (coordData.success) {
                    const status = coordData.coordination_status;
                    document.getElementById('project-progress').textContent = status.project_overview.overall_progress + '%';
                    document.getElementById('active-robots').textContent = status.robot_status.length;
                }
                
                // Try to get document count (may fail due to stats endpoint issue)
                try {
                    const docsResponse = await fetch(`${API_BASE}/api/v1/documents/stats`);
                    if (docsResponse.ok) {
                        const docsData = await docsResponse.json();
                        document.getElementById('total-documents').textContent = docsData.statistics?.total_documents || '--';
                    } else {
                        document.getElementById('total-documents').textContent = 'N/A';
                    }
                } catch (e) {
                    document.getElementById('total-documents').textContent = 'N/A';
                }
                
            } catch (error) {
                console.error('Failed to load dashboard data:', error);
            }
        }

        // Load robot status information
        async function loadRobotStatus() {
            try {
                const response = await fetch(`${API_BASE}/api/v1/coordination/status`);
                const data = await response.json();
                
                if (data.success) {
                    const robots = data.coordination_status.robot_status;
                    const container = document.getElementById('robots-container');
                    
                    if (robots.length === 0) {
                        container.innerHTML = '<div class="loading">No robots currently active</div>';
                        return;
                    }
                    
                    container.innerHTML = robots.map(robot => `
                        <div class="robot-card">
                            <div class="robot-header">
                                <div class="robot-name">🤖 ${robot.robot_role.toUpperCase()}</div>
                                <div class="robot-step">Step ${robot.protocol_step}</div>
                            </div>
                            <div class="progress-bar">
                                <div class="progress-fill" style="width: ${robot.task_progress}%"></div>
                            </div>
                            <div style="font-size: 14px; font-weight: 500; color: #4a5568;">${robot.task_progress}% Complete</div>
                            <div class="robot-task">${robot.current_task}</div>
                        </div>
                    `).join('');
                }
            } catch (error) {
                document.getElementById('robots-container').innerHTML = 
                    '<div class="error">Failed to load robot status</div>';
            }
        }

        // Search documents
        async function searchDocuments() {
            const query = document.getElementById('search-input').value.trim();
            if (!query) {
                showActionResult('Please enter a search query', 'error');
                return;
            }

            try {
                const response = await fetch(`${API_BASE}/api/v1/documents/search`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        query: query,
                        limit: 5
                    })
                });
                
                const data = await response.json();
                
                if (data.success && data.results.length > 0) {
                    const results = data.results.map(doc => 
                        `📄 ${doc.title} (${(doc.relevance * 100).toFixed(1)}%)`
                    ).join('<br>');
                    showActionResult(`Found ${data.results.length} documents:<br>${results}`, 'success');
                } else {
                    showActionResult('No documents found for that query', 'info');
                }
            } catch (error) {
                showActionResult('Search failed: ' + error.message, 'error');
            }
        }

        // Refresh all data
        async function refreshStatus() {
            showActionResult('Refreshing...', 'info');
            try {
                await loadDashboardData();
                await loadRobotStatus();
                showActionResult('✅ Status refreshed successfully', 'success');
            } catch (error) {
                showActionResult('Refresh failed: ' + error.message, 'error');
            }
        }

        // View integration status
        async function viewIntegration() {
            try {
                const response = await fetch(`${API_BASE}/api/v1/integration/readiness`);
                const data = await response.json();
                
                if (data.success) {
                    const readiness = data.readiness_assessment;
                    showActionResult(
                        `🔗 Integration Readiness: ${readiness.overall_readiness}/10<br>` +
                        `🚀 Status: ${readiness.deployment_readiness}<br>` +
                        `🚨 Blockers: ${readiness.blockers.length}`, 
                        'success'
                    );
                }
            } catch (error) {
                showActionResult('Failed to get integration status', 'error');
            }
        }

        // View contracts
        async function viewContracts() {
            try {
                const response = await fetch(`${API_BASE}/api/v1/contracts/types`);
                const data = await response.json();
                
                if (data.success) {
                    const types = data.contract_types.map(type => `📋 ${type.name}`).join('<br>');
                    showActionResult(`Available Contract Types:<br>${types}`, 'success');
                }
            } catch (error) {
                showActionResult('Failed to get contract types', 'error');
            }
        }

        // Bulk upload ROME documents
        async function bulkUpload() {
            showActionResult('📁 Starting bulk upload from uploads directory...', 'info');
            
            try {
                const response = await fetch(`${API_BASE}/api/v1/documents/bulk-upload`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' }
                });
                
                const data = await response.json();
                
                if (data.success) {
                    const summary = data.summary;
                    showActionResult(
                        `✅ Upload Complete!<br>` +
                        `📄 Files: ${summary.total_files}<br>` +
                        `✅ Success: ${summary.successful_uploads}<br>` +
                        `❌ Failed: ${summary.failed_uploads}`, 
                        'success'
                    );
                    
                    // Refresh dashboard to show new document count
                    setTimeout(() => {
                        loadDashboardData();
                    }, 1000);
                } else {
                    showActionResult('❌ Upload failed: ' + data.message, 'error');
                }
            } catch (error) {
                showActionResult('❌ Upload failed: ' + error.message, 'error');
            }
        }

        // Clear database
        async function clearDatabase() {
            if (!confirm('⚠️ This will delete ALL documents from the database. Are you sure?')) {
                return;
            }
            
            showActionResult('🗑️ Clearing database...', 'info');
            
            try {
                // Delete the RomeDocument class to clear all data
                const response = await fetch('http://localhost:8088/v1/schema/RomeDocument', {
                    method: 'DELETE'
                });
                
                if (response.ok || response.status === 404) {
                    showActionResult('✅ Database cleared successfully!', 'success');
                    
                    // Refresh dashboard to show zero documents
                    setTimeout(() => {
                        loadDashboardData();
                    }, 1000);
                } else {
                    showActionResult('❌ Failed to clear database: ' + response.statusText, 'error');
                }
            } catch (error) {
                showActionResult('❌ Database clear failed: ' + error.message, 'error');
            }
        }

        // Export report (placeholder)
        async function exportReport() {
            showActionResult('📊 Export functionality coming soon!', 'info');
        }

        // Show action results
        function showActionResult(message, type) {
            const container = document.getElementById('action-results');
            const className = type === 'error' ? 'error' : 'info';
            container.innerHTML = `<div class="${className}">${message}</div>`;
            
            // Clear after 5 seconds
            setTimeout(() => {
                container.innerHTML = '';
            }, 5000);
        }

        // Show error message
        function showError(message) {
            showActionResult(message, 'error');
        }

        // Auto-refresh every 30 seconds
        function startAutoRefresh() {
            refreshInterval = setInterval(async () => {
                await loadDashboardData();
                await loadRobotStatus();
            }, 30000);
        }

        // Handle search on Enter key
        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('search-input').addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    searchDocuments();
                }
            });
            
            // Initialize the console
            init();
        });
    </script>
</body>
</html>
