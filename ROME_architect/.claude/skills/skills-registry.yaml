# Project-Specific Overrides
# Different projects can enable/disable specific skills
project_overrides:
  # Default project (Task Management System)
  default:
    enabled_skills:
      - flutter-best-practices
      - parse-server-config
      - ui-design-patterns
    disabled_skills: []

  # Example: E-commerce project might need different skills
  # ecommerce-project:
  #   enabled_skills:
  #     - flutter-best-practices
  #     - stripe-payment-integration
  #     - product-catalog-patterns
  #   disabled_skills:
  #     - parse-server-config  # Using Firebase instead

  # Example: Enterprise project with custom requirements
  # enterprise-project:
  #   enabled_skills:
  #     - flutter-best-practices
  #     - enterprise-security-patterns
  #     - sso-integration
  #     - compliance-validator

# Skill Aliases
# Short names or alternative references to skills
aliases:
  flutter: flutter-best-practices
  parse: parse-server-config
  ui: ui-design-patterns
  backend: parse-server-config
  design: ui-design-patterns

# Skill Dependencies
# Some skills may require or recommend other skills
dependencies:
  flutter-best-practices:
    requires: []
    recommends:
      - ui-design-patterns
    conflicts: []

  parse-server-config:
    requires: []
    recommends: []
    conflicts: []

  ui-design-patterns:
    requires: []
    recommends:
      - flutter-best-practices
    conflicts: []

# Auto-Discovery Rules
# How Claude Code should discover and recommend skills
discovery_rules:
  # Trigger skill based on keywords in user request
  keyword_triggers:
    - keywords: [flutter, widget, bloc, dart]
      recommend: flutter-best-practices

    - keywords: [parse, backend, cloud-code, schema]
      recommend: parse-server-config

    - keywords: [ui, ux, design, layout, accessibility]
      recommend: ui-design-patterns

  # Trigger based on file types being worked on
  file_type_triggers:
    - extensions: [.dart]
      recommend: flutter-best-practices

    - extensions: [.js, .ts]
      context: parse-server
      recommend: parse-server-config

  # Trigger based on project structure
  project_structure_triggers:
    - presence_of: [pubspec.yaml, lib/]
      recommend: flutter-best-practices

    - presence_of: [cloud/main.js]
      recommend: parse-server-config

