          description: Team ID
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TeamRequest'
  /team-member:
    post:
      summary: create team-member
      description: >-
        User appears in team member list. User receives team invitation
        notification. User can access team projects
      operationId: postTeamMember
      tags:
        - TeamMember
      security:
        - BearerAuth: []
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamMemberResponse'
        '400':
          description: User is already a member of this team
          content:
