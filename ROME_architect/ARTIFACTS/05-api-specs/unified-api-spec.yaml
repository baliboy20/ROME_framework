            schema:
              $ref: '#/components/schemas/TeamMemberRequest'
  /team-member/{id}:
    delete:
      summary: delete team-member
      description: >-
        User no longer appears in team member list. User loses access to team
        projects. User receives removal notification
      operationId: deleteTeamMember
      tags:
        - TeamMember
      security:
        - BearerAuth: []
      responses:
        '204':
          description: No Content
          content: {}
        '400':
          description: Cannot remove team owner. Transfer ownership first
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
