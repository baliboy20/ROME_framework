      operationId: postTask
      tags:
        - Task
      security:
        - BearerAuth: []
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskResponse'
        '400':
          description: Task cannot be submitted with incomplete required fields
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
