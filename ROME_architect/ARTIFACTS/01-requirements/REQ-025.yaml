ID: REQ-025

Actor: Administrator

Intent: delete webhook

Preconditions:
  - Administrator authenticated
  - Webhook exists
  - Administrator has admin role

Conditions: []

Postconditions:
  - Webhook marked as deleted
  - Webhook event delivery stopped
  - Audit log entry created

Outcomes:
  - Webhook no longer appears in active webhooks list
  - Webhook stops receiving events
  - Webhook deletion timestamp recorded

Invariants:
  - Deleted webhooks cannot be restored
  - Pending webhook deliveries cancelled
  - Deletion timestamp recorded

NonFunctional:
  Performance:
    - Deletion completes in <1 second
  Security:
    - Requires admin permission
  Reliability:
    - Deletion propagates to event system within 10 seconds

Errors:
  - error: "If webhook not found"
    message: "Webhook does not exist"
  - error: "If webhook already deleted"
    message: "Webhook has already been deleted"

ScopeBoundary:
  InScope:
    - Delete webhook, stop event delivery
  OutOfScope:
    - Webhook archiving, bulk deletion

OpenQuestions: []

CopilotMode: STRICT

