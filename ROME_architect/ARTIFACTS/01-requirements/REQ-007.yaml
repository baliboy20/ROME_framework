ID: REQ-007

Actor: TeamMember

Intent: create comment

Preconditions:
  - TeamMember authenticated
  - Task exists
  - TeamMember has task view permission

Conditions:
  - Comment text 1-2000 characters

Postconditions:
  - Comment saved to task
  - Comment timestamp recorded
  - Task updated_at timestamp refreshed
  - Notification sent to task assignee and ProjectManager

Outcomes:
  - Comment appears in task comment thread
  - Task assignee receives notification
  - Comment author recorded

Invariants:
  - Comment must belong to exactly one task
  - Comment text cannot be empty
  - Created date ≤ Current date

NonFunctional:
  Performance:
    - Comment creation completes in <1 second
  Security:
    - Requires task view permission
  Usability:
    - Real-time comment updates for concurrent viewers

Errors:
  - error: "If comment text exceeds 2000 characters"
    message: "Comment cannot exceed 2000 characters"
  - error: "If task not found"
    message: "Task does not exist"

ScopeBoundary:
  InScope:
    - Create text comment with @mentions
  OutOfScope:
    - Rich text formatting, comment attachments, comment editing

OpenQuestions:
  - question: "Should comments support markdown formatting?"
    status: RESOLVED
    resolution: "Plain text only for pilot"

CopilotMode: STRICT

