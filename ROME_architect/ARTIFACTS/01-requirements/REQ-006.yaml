ID: REQ-006

Actor: TeamMember

Intent: search tasks

Preconditions:
  - TeamMember authenticated
  - TeamMember has project read access

Conditions:
  - Search query minimum 2 characters

Postconditions:
  - Search query logged for analytics
  - Results cached for 5 minutes

Outcomes:
  - Matching tasks returned to TeamMember
  - Results ordered by relevance
  - Search execution time logged

Invariants:
  - Search results include only tasks TeamMember has permission to view
  - Results limited to 100 tasks per query
  - Deleted tasks excluded from results

NonFunctional:
  Performance:
    - Search completes in <2 seconds for 10,000 tasks
  Security:
    - Results filtered by TeamMember permissions
  Scalability:
    - Full-text search index on title and description

Errors:
  - error: "If query less than 2 characters"
    message: "Search query must be at least 2 characters"
  - error: "If search timeout (>5 seconds)"
    message: "Search timed out. Please refine your query"

ScopeBoundary:
  InScope:
    - Full-text search on task title and description
  OutOfScope:
    - Advanced filters (date range, priority), saved searches

OpenQuestions:
  - question: "Should search support filters (priority, status, assignee)?"
    status: OPEN
    resolution: ""

CopilotMode: GUIDED

