ID: REQ-001
Actor: ProjectAdmin
Intent: create project
Preconditions:
  - ProjectAdmin authenticated
  - ProjectAdmin belongs to a team
Conditions:
  - Team is within its allowed project count
Postconditions:
  - Project recorded with a unique identifier
  - ProjectAdmin recorded as project owner
Outcomes:
  - Project appears in the team project list
  - ProjectAdmin can invite members to the project
Invariants:
  - A project always has exactly one owner
  - Project name is unique within a team
NonFunctional:
  Performance:
    - Project creation completes within two seconds
  Security:
    - Only authenticated team members may create projects
Errors:
  - error: If project name is already used within the team
    message: A project with this name already exists
  - error: If team project limit is reached
    message: Project limit reached for this team
ScopeBoundary:
  InScope:
    - Create a project with a name and description
    - Assign the creator as owner
  OutOfScope:
    - Member invitation flow
    - Project deletion
OpenQuestions:
  - question: Is a description mandatory at creation?
    status: RESOLVED
    resolution: Description is optional
CopilotMode: STRICT
