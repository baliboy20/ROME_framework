version: '3.8'

services:
  mcp-server:
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.dev
    container_name: mcp-server-dev
    environment:
      NODE_ENV: development
      PORT: 3000
      DEBUG: mcp:*
    volumes:
      - ./src:/app/src
      - ./tests:/app/tests
      - /app/node_modules
    ports:
      - "3000:3000"
      - "9229:9229"  # Debug port
    command: npm run dev
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  weaviate:
    environment:
      LOG_LEVEL: 'debug'
      PERSISTENCE_DATA_PATH: '/var/lib/weaviate_dev'
    volumes:
      - weaviate_dev_data:/var/lib/weaviate_dev

volumes:
  weaviate_dev_data:
    driver: local