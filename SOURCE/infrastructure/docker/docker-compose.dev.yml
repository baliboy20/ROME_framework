# =================================
# DOCKER COMPOSE - DEVELOPMENT ENVIRONMENT
# =================================
# Full development stack with hot reload and debugging

version: '3.8'

services:
  # MongoDB Database
  mongodb:
    image: mongo:7.0
    container_name: mfe-mongodb-dev
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: medium_extractor
      MONGO_INITDB_ROOT_USERNAME: dev_user
      MONGO_INITDB_ROOT_PASSWORD: dev_password
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
      - ./mongodb/init:/docker-entrypoint-initdb.d:ro
    networks:
      - mfe-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Backend API Development
  backend:
    build:
      context: ../../
      dockerfile: infrastructure/docker/backend.dev.Dockerfile
    container_name: mfe-backend-dev
    restart: unless-stopped
    ports:
      - "3000:3000"
      - "9229:9229"  # Debug port
    environment:
      - NODE_ENV=development
      - MONGODB_URI=mongodb://dev_user:dev_password@mongodb:27017/medium_extractor
      - FRONTEND_URL=http://localhost:5000
      - DEBUG_MODE=true
      - VERBOSE_LOGGING=true
    volumes:
      - ../../backend:/app:delegated
      - /app/node_modules
      - ../../data:/app/data
      - ../../logs:/app/logs
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - mfe-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # MongoDB Admin Interface (optional)
  mongo-express:
    image: mongo-express:latest
    container_name: mfe-mongo-express-dev
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: dev_user
      ME_CONFIG_MONGODB_ADMINPASSWORD: dev_password
      ME_CONFIG_MONGODB_URL: mongodb://dev_user:dev_password@mongodb:27017/
      ME_CONFIG_BASICAUTH_USERNAME: admin
      ME_CONFIG_BASICAUTH_PASSWORD: admin123
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - mfe-network
    profiles:
      - admin

  # Redis Cache (optional, for development testing)
  redis:
    image: redis:7-alpine
    container_name: mfe-redis-dev
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - mfe-network
    profiles:
      - cache
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  mongodb_data:
    driver: local
  mongodb_config:
    driver: local
  redis_data:
    driver: local

networks:
  mfe-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16