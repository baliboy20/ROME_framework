tech_stack:
  application_layer:
    framework: Flutter 3.27.x
    state_management: flutter_bloc ^8.1.0
    dependency_injection: get_it ^8.0.0
    routing: go_router ^14.6.2
    # Add additional application-specific libraries as needed

  api_layer:
    platform: Parse Server 6.x
    hosting: Back4App | self-hosted
    authentication: Parse Session + JWT fallback
    # Add additional API-specific technologies as needed

  data_layer:
    database: Parse Server (MongoDB 5.x+)
    # Add additional data persistence technologies as needed

  additional_technologies:
    - Stripe Flutter SDK ^11.2.0 (payment processing)
    - Firebase Cloud Messaging (push notifications)
    - image_picker ^1.1.2 (image upload)
    # List any other cross-cutting technologies with versions and purposes

  critical_constraints:
    - Parse Server requires MongoDB 5.x minimum for compatibility
    - Flutter web requires CORS configuration on Parse Server
    - Stripe integration requires PCI compliance documentation (sponsor responsibility)
    # Document any blocking technical constraints or compatibility requirements

# Technology Health Validation
# Verify each technology is actively maintained:
# - GitHub last commit within 6 months
# - Active issue response
# - Community support available
# - No critical security vulnerabilities
