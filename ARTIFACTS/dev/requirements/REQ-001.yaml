# Sample AORDL Requirement for P01→P02 Workflow Testing
# Document UID: REQ-001
# Status: Test Artifact
# Created: 2025-12-24

ID: REQ-001
Actor: ProjectManager
Intent: create project

Preconditions:
  - ProjectManager authenticated with valid JWT token
  - ProjectManager has active paid subscription
  - ProjectManager quota for projects not exceeded

Conditions:
  - Project name unique within organization
  - Project name length 3-100 characters
  - Project name contains only alphanumeric and spaces

Postconditions:
  - Project status set to 'active'
  - ProjectManager assigned as project owner
  - Audit log entry created with timestamp
  - Organization project count incremented

Outcomes:
  - Project saved to database with unique UUID
  - ProjectManager receives email confirmation
  - Project appears in ProjectManager's project list
  - Audit trail contains creation event

Invariants:
  - Project must have exactly one owner at all times
  - Project status must be one of: active, archived, deleted
  - Project must belong to exactly one organization

NonFunctional:
  Performance:
    - Project creation completes in <2 seconds at p95
    - Database write operation <500ms
  Security:
    - Requires JWT authentication with 'project:create' scope
    - Input sanitization for XSS prevention
    - Rate limit: 10 projects per hour per user
  Usability:
    - Success feedback shown within 100ms of completion

Errors:
  - error: "DuplicateProjectName"
    message: "Project name already exists in your organization"
    httpCode: 409
    userAction: "Choose a different name"

  - error: "QuotaExceeded"
    message: "Maximum project limit reached for your subscription tier"
    httpCode: 403
    userAction: "Upgrade subscription or archive existing projects"

  - error: "InvalidProjectName"
    message: "Project name must be 3-100 characters, alphanumeric and spaces only"
    httpCode: 400
    userAction: "Provide valid project name"

ScopeBoundary:
  InScope:
    - Create project with name, description, owner
    - Validate project name uniqueness
    - Send confirmation email
    - Audit logging
  OutOfScope:
    - Project templates
    - Bulk project creation
    - Project initialization with tasks/teams
    - Custom project fields

OpenQuestions:
  - question: "Should projects support hierarchical structure (parent/child projects)?"
    status: RESOLVED
    decision: "No - MVP supports flat structure only. Hierarchies deferred to v2.0"
    decisionDate: "2025-12-20"
    decisionBy: "Product Owner"

  - question: "Should project names be globally unique or organization-scoped?"
    status: RESOLVED
    decision: "Organization-scoped uniqueness only"
    decisionDate: "2025-12-20"
    decisionBy: "Technical Lead"

CopilotMode: STRICT
