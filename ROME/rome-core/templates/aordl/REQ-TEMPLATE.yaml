# AORDL Requirement Template (YAML Format)
# AI-Optimized Requirement Design Language
# Version: 1.0
# Date: 2025-12-23

# ============================================================================
# REQUIRED FIELDS (All 13 fields must be present)
# ============================================================================

ID: REQ-XXX
# Format: REQ-### (e.g., REQ-001, REQ-042)
# Must be unique across all requirements
# Sequential numbering recommended

Actor: ActorRole
# Single role or persona (not generic "user")
# Examples: Customer, Administrator, SystemIntegrator, AccountManager
# Anti-pattern: "User", "Person", "Someone"

Intent: verb business-object
# Format: <approved-verb> <business-object>
# Approved verbs: create, read, update, delete, submit, approve, reject,
#                 cancel, archive, restore, export, import, view, search
# Examples: "create invoice", "approve purchase-order", "export report"
# Anti-pattern: Compound intents, UI language, technical jargon

Preconditions:
  - Precondition statement 1
  - Precondition statement 2
# System state that must be true BEFORE the intent can be executed
# Describes authentication, authorization, data existence
# Examples:
#   - "Customer authenticated"
#   - "Customer has active subscription"
#   - "Product exists in catalog"
# Anti-pattern: UI states, button states, technical implementation

Conditions:
  - Condition statement 1
  - Condition statement 2
# Contextual conditions that influence execution
# Describes business rules, timing, thresholds
# Examples:
#   - "Order total exceeds $1000"
#   - "Current date is within billing period"
#   - "Inventory level below reorder point"
# Can be empty if no conditional logic

Postconditions:
  - Postcondition statement 1
  - Postcondition statement 2
# System state that must be true AFTER successful execution
# Describes state transitions, data updates, system effects
# Examples:
#   - "Invoice status set to 'draft'"
#   - "Customer notified via email"
#   - "Audit log entry created"
# Anti-pattern: UI feedback, messages shown

Outcomes:
  - Outcome statement 1
  - Outcome statement 2
# Observable results from the Actor's perspective
# Describes what the Actor can verify happened
# Examples:
#   - "Invoice saved to database with unique ID"
#   - "Customer receives email confirmation"
#   - "Invoice appears in customer invoice list"
# Must be observable and verifiable

Invariants:
  - Invariant rule 1
  - Invariant rule 2
# Business rules that must ALWAYS be true
# Domain truths that cannot be violated
# Examples:
#   - "Invoice total = sum(line items) + tax + shipping"
#   - "Invoice number sequential and unique"
#   - "Line items must have at least one entry"
# Enforced in: database constraints, API logic, UI validation

NonFunctional:
  Performance:
    - Performance requirement 1
  Security:
    - Security requirement 1
  Scalability:
    - Scalability requirement 1
  Usability:
    - Usability requirement 1
  Reliability:
    - Reliability requirement 1
# Non-functional requirements organized by category
# Examples:
#   Performance: "Invoice creation completes in <2 seconds"
#   Security: "Requires JWT authentication"
#   Scalability: "Supports 10,000 concurrent users"

Errors:
  - error: "Error condition 1"
    message: "User-facing error message"
  - error: "Error condition 2"
    message: "User-facing error message"
# Error conditions and corresponding user-facing messages
# Format: Condition + Message
# Examples:
#   - error: "If line items empty"
#     message: "Invoice must have at least one line item"
#   - error: "If subscription inactive"
#     message: "Active subscription required to create invoices"
# Used for: API error responses, UI validation messages

ScopeBoundary:
  InScope:
    - In-scope item 1
    - In-scope item 2
  OutOfScope:
    - Out-of-scope item 1
    - Out-of-scope item 2
# Explicit scope definition
# InScope: What this requirement covers
# OutOfScope: What is explicitly excluded
# Examples:
#   InScope:
#     - "Create invoice with line items, tax, shipping"
#     - "Email confirmation to customer"
#   OutOfScope:
#     - "Invoice payment processing"
#     - "Invoice PDF generation"

OpenQuestions:
  - question: "Open question 1"
    status: OPEN | RESOLVED | DEFERRED
    resolution: "Resolution if resolved"
  - question: "Open question 2"
    status: OPEN | RESOLVED | DEFERRED
    resolution: ""
# Questions that need clarification or decision
# Status: OPEN (needs answer), RESOLVED (answered), DEFERRED (future)
# Examples:
#   - question: "Should invoice editing be allowed after submission?"
#     status: OPEN
#   - question: "Tax calculation: inclusive or exclusive?"
#     status: RESOLVED
#     resolution: "Exclusive - tax added to subtotal"

CopilotMode: STRICT | GUIDED | PERMISSIVE
# Validation strictness for AORDL processing
# STRICT: Reject any deviation from AORDL rules
# GUIDED: Warn on deviations, suggest corrections
# PERMISSIVE: Accept with best-effort interpretation
# Recommended: STRICT for production, GUIDED for development

# ============================================================================
# OPTIONAL METADATA
# ============================================================================

metadata:
  created: 2025-12-23
  author: RequirementAuthor
  version: 1.0
  priority: HIGH | MEDIUM | LOW
  epic: EPIC-XXX
  feature: FEATURE-XXX
  dependencies:
    - REQ-YYY
    - REQ-ZZZ
  tags:
    - tag1
    - tag2

# ============================================================================
# CHANGE HISTORY (Change Request Protocol)
# ============================================================================
# Track all changes to this requirement to preserve traceability
# Format: List of change records, most recent first

changeHistory:
  - changeRequest: CR-XXX
    date: YYYY-MM-DDTHH:MM:SSZ
    type: TERMINOLOGY_CHANGE | LOGIC_CHANGE | REQUIREMENT_CHANGE
    changes:
      - field: Actor
        oldValue: "Previous value"
        newValue: "New value"
      - field: Intent
        oldValue: "Previous value"
        newValue: "New value"
# Example:
# changeHistory:
#   - changeRequest: CR-001
#     date: 2025-12-26T14:00:00Z
#     type: TERMINOLOGY_CHANGE
#     changes:
#       - field: Actor
#         oldValue: CompanyAdmin
#         newValue: OrganisationAdmin
#       - field: Intent
#         oldValue: create_company_profile
#         newValue: create_organisation_profile

# ============================================================================
# VALIDATION RULES
# ============================================================================
# 1. All 13 required fields must be present
# 2. ID must be unique (REQ-###)
# 3. Actor must be a single, specific role (not "user")
# 4. Intent must use approved verb + business object
# 5. No UI language (click, button, screen, form)
# 6. No technical jargon (POST, SQL, endpoint, API)
# 7. No compound intents (multiple verbs)
# 8. Invariants must be domain truths (not implementation)
# 9. Errors must have both condition and message
# 10. Outcomes must be observable
