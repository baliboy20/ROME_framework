skill:
  name: generate-test-plan
  version: 1.0.0
  category: composition
  tier: 2
  description: Generate master test plan from all AORDL requirements

parameters:
  required:
    - name: requirements_directory
      type: string
      validation: directory_exists
      description: Directory containing AORDL requirement files

  optional:
    - name: output_file
      type: string
      description: File path to write master test plan

    - name: output_format
      type: string
      default: markdown
      allowed_values: [json, yaml, markdown]
      description: Output format for test plan

    - name: include_traceability
      type: boolean
      default: true
      description: Include requirement traceability matrix

    - name: group_by_priority
      type: boolean
      default: true
      description: Group test scenarios by priority

execution:
  timeout: 180000
  retry:
    enabled: true
    max_attempts: 2
    backoff: exponential

output:
  test_plan:
    type: object
    description: Complete master test plan
  total_scenarios:
    type: integer
    description: Total number of test scenarios
  coverage_summary:
    type: object
    description: Test coverage summary
