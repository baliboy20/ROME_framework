skill:
  name: generate-class-diagrams
  version: 1.0.0
  category: architecture
  tier: 2
  description: Generate UML class diagrams in Mermaid format

parameters:
  required:
    - name: component_structure_file
      type: string
      validation: file_exists

  optional:
    - name: output_file
      type: string

execution:
  timeout: 60000

output:
  diagrams_generated:
    type: integer
  diagram_content:
    type: string
