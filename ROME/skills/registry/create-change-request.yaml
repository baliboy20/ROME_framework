skill:
  name: create-change-request
  version: 1.0.0
  category: change-management
  tier: 1
  description: Create formal Change Request (CR) for managing changes to requirements, design, or code while preserving traceability
  proposal: ROME-PROP-015

parameters:
  required:
    - name: type
      type: string
      allowed_values: [TERMINOLOGY_CHANGE, LOGIC_CHANGE, SCHEMA_CHANGE, API_CHANGE, UI_CHANGE, REQUIREMENT_CHANGE]
      description: Type of change being requested

    - name: title
      type: string
      description: Short, clear description of the change (1-2 sentences)

    - name: description
      type: string
      description: Detailed description of what needs to change and why

  optional:
    - name: rationale
      type: string
      description: Business justification for the change

    - name: priority
      type: string
      default: MEDIUM
      allowed_values: [CRITICAL, HIGH, MEDIUM, LOW]
      description: Priority level of the change request

    - name: requested_by
      type: string
      default: User
      allowed_values: [User, Roma, Talib, PMA, Sarah, Lucien, Ashok, Reena, Charlie, Clara]
      description: Who initiated the change request

    - name: output_dir
      type: string
      default: ARTIFACTS/changes
      description: Directory to create CR file

    - name: cr_id
      type: string
      description: Custom CR ID (auto-generated if not provided)

execution:
  timeout: 10000
  retry:
    enabled: false

output:
  cr_id:
    type: string
    description: Generated CR ID (e.g., CR-001 or CR-20251226-143000)
  cr_file_path:
    type: string
    description: Path to created CR-###.yaml file
  status:
    type: string
    description: Initial status (always PROPOSED)
  next_steps:
    type: array
    description: Next steps in the workflow

# CR ID generation strategies
cr_id_strategies:
  sequential:
    pattern: "CR-{number:03d}"
    description: Sequential numbering (CR-001, CR-002, etc.)

  timestamp:
    pattern: "CR-{timestamp}"
    description: Timestamp-based (CR-20251226-143000)

  default: timestamp

# Change type characteristics
change_type_characteristics:
  TERMINOLOGY_CHANGE:
    typical_scope: "Names, labels, identifiers"
    breaking: true
    complexity: MEDIUM
    examples:
      - "Company → Organisation"
      - "TaskOwner → TaskAssignee"

  LOGIC_CHANGE:
    typical_scope: "Business rules, validation logic"
    breaking: depends
    complexity: LOW_TO_HIGH
    examples:
      - "Max file size 10MB → 50MB"
      - "Approval requires 1 manager → 2 managers"

  SCHEMA_CHANGE:
    typical_scope: "Database structure"
    breaking: depends
    complexity: MEDIUM
    examples:
      - "Add tax_id field to organisations table"
      - "Change status from VARCHAR to ENUM"

  API_CHANGE:
    typical_scope: "API contracts"
    breaking: true
    complexity: HIGH
    examples:
      - "Rename parameter companyId → organisationId"
      - "Add required parameter to endpoint"

  UI_CHANGE:
    typical_scope: "User interface"
    breaking: false
    complexity: LOW_TO_MEDIUM
    examples:
      - "Add new filter option"
      - "Change form layout"

  REQUIREMENT_CHANGE:
    typical_scope: "Fundamental requirements"
    breaking: true
    complexity: HIGH
    examples:
      - "REQ-003 scope expanded to include subsidiaries"
      - "REQ-012 now handles multi-currency"

# Required template sections
required_template_sections:
  - ID
  - Type
  - Status
  - Priority
  - Title
  - Description
  - Rationale
  - RequestedBy
  - RequestedDate

# Workflow phases
workflow_phases:
  - phase: 1
    name: "Request Creation"
    status: PROPOSED
    actors: [User, Roma, Any Robot]
    output: "CR-###.yaml file"

  - phase: 2
    name: "Impact Analysis"
    status: PROPOSED
    actors: [Roma, Relevant Robots]
    output: "Populated ImpactAnalysis section"

  - phase: 3
    name: "Approval"
    status: APPROVED/REJECTED
    actors: [Sarah]
    output: "ApprovedBy and ApprovedDate filled"

  - phase: 4
    name: "Implementation"
    status: IN_PROGRESS
    actors: [Assigned Robots]
    output: "Updated artifacts with change metadata"

  - phase: 5
    name: "Testing & Verification"
    status: IN_PROGRESS
    actors: [Sarah]
    output: "Verification section completed"

  - phase: 6
    name: "Completion or Rollback"
    status: COMPLETED/ROLLED_BACK
    actors: [Roma, Sarah]
    output: "CompletedDate or Rollback section filled"

# Integration with activity log
activity_log_events:
  created:
    type: CHANGE_REQUEST
    attributes:
      status: PROPOSED
      type: "{change_type}"
      title: "{title}"
      requestedBy: "{requested_by}"
      priority: "{priority}"
