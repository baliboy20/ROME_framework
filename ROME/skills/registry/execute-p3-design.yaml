skill:
  name: execute-p3-design
  version: 1.0.0
  category: orchestration
  tier: 2
  description: Execute complete P3 design phase pipeline

parameters:
  required:
    - name: artifacts_directory
      type: string
      validation: directory_exists
      description: Directory containing P2 artifacts

  optional:
    - name: design_output_directory
      type: string
      description: Output directory for design artifacts

execution:
  timeout: 180000

output:
  design_status:
    type: string
    description: SUCCESS or FAILED
  artifacts_generated:
    type: integer
  design_specs:
    type: object
