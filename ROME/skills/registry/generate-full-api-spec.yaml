skill:
  name: generate-full-api-spec
  version: 1.0.0
  category: composition
  tier: 2
  description: Generate unified OpenAPI specification from all AORDL requirements

parameters:
  required:
    - name: requirements_directory
      type: string
      validation: directory_exists
      description: Directory containing AORDL requirement files

  optional:
    - name: output_file
      type: string
      description: File path to write unified OpenAPI spec

    - name: api_version
      type: string
      default: "1.0.0"
      description: API version

    - name: api_title
      type: string
      default: "Generated API"
      description: API title

    - name: api_description
      type: string
      default: "API generated from AORDL requirements"
      description: API description

    - name: base_path
      type: string
      default: "/api/v1"
      description: Base path for API

    - name: group_by_resource
      type: boolean
      default: true
      description: Group endpoints by resource in tags

execution:
  timeout: 120000
  retry:
    enabled: true
    max_attempts: 2
    backoff: exponential

output:
  openapi_spec:
    type: object
    description: Unified OpenAPI 3.0 specification
  endpoint_count:
    type: integer
    description: Total number of endpoints
  resource_count:
    type: integer
    description: Number of unique resources
