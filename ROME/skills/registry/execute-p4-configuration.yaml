skill:
  name: execute-p4-configuration
  version: 1.0.0
  category: orchestration
  tier: 2
  description: Execute complete P4 configuration phase (all 10 Tier 1 skills)

parameters:
  required:
    - name: artifacts_directory
      type: string
      validation: directory_exists

    - name: config_output_directory
      type: string

execution:
  timeout: 120000

output:
  phase_status:
    type: string
  files_generated:
    type: integer
  config_artifacts:
    type: object
