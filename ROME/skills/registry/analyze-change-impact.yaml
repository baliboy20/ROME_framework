skill:
  name: analyze-change-impact
  version: 1.0.0
  category: change-management
  tier: 2
  description: Analyze impact of change request across requirements, design, and code to estimate effort and identify risks
  proposal: ROME-PROP-015

parameters:
  required:
    - name: cr_file
      type: string
      validation: file_exists
      description: Path to CR-###.yaml file

  optional:
    - name: artifacts_dir
      type: string
      default: ARTIFACTS
      description: Root directory of project artifacts

    - name: source_dir
      type: string
      default: src
      description: Root directory of source code

    - name: detailed
      type: boolean
      default: true
      description: Include detailed file-by-file analysis

    - name: estimate_effort
      type: boolean
      default: true
      description: Estimate implementation effort

execution:
  timeout: 30000
  retry:
    enabled: true
    max_attempts: 2
    backoff: linear

output:
  cr_id:
    type: string
    description: Change request ID

  impact_summary:
    type: object
    description: High-level impact summary

  requirements_affected:
    type: array
    description: List of affected requirement files with changes

  design_affected:
    type: array
    description: List of affected design documents with changes

  code_affected:
    type: array
    description: List of affected code files with changes

  estimated_effort:
    type: string
    description: Estimated effort (hours/days/weeks)

  risk_assessment:
    type: object
    description: Risk analysis (breaking, dataLoss, rollbackComplexity, etc.)

  robot_assignments:
    type: array
    description: Suggested robot assignments for implementation

# Impact analysis strategy
analysis_strategy:
  requirements:
    search_patterns:
      - "ARTIFACTS/dev/requirements/*.yaml"
      - "ARTIFACTS/*/requirements/*.yaml"
    search_for:
      - TERMINOLOGY_CHANGE: "Actor, Intent field values"
      - LOGIC_CHANGE: "Conditions, Invariants, Errors"
      - REQUIREMENT_CHANGE: "All fields"

  design:
    search_patterns:
      - "ARTIFACTS/dev/design/*.md"
      - "ARTIFACTS/dev/design/*.yaml"
    search_for:
      - TERMINOLOGY_CHANGE: "Entity names, field names"
      - SCHEMA_CHANGE: "db-schema.yaml"
      - API_CHANGE: "api-design.md, api-spec.yaml"

  code:
    search_patterns:
      - "src/**/*.{ts,js,dart,py,java}"
      - "lib/**/*.{dart}"
    search_for:
      - TERMINOLOGY_CHANGE: "Class names, variable names, type names"
      - LOGIC_CHANGE: "Validation logic, business rules"
      - SCHEMA_CHANGE: "Models, migrations, repositories"
      - API_CHANGE: "Controllers, DTOs, endpoints"
      - UI_CHANGE: "Components, widgets, views"

# Effort estimation heuristics
effort_estimation:
  base_metrics:
    requirements_file: 30  # minutes per requirement file
    design_file: 45        # minutes per design document
    code_file: 20          # minutes per code file
    test_file: 15          # minutes per test file
    migration: 60          # minutes for database migration

  complexity_multipliers:
    TERMINOLOGY_CHANGE: 1.5
    LOGIC_CHANGE: 1.0
    SCHEMA_CHANGE: 2.0
    API_CHANGE: 2.5
    UI_CHANGE: 1.0
    REQUIREMENT_CHANGE: 3.0

  breaking_change_overhead: 1.5
  testing_overhead: 0.3
  documentation_overhead: 0.2

# Risk assessment criteria
risk_assessment_criteria:
  breaking:
    TERMINOLOGY_CHANGE: high
    LOGIC_CHANGE: medium
    SCHEMA_CHANGE: high
    API_CHANGE: high
    UI_CHANGE: low
    REQUIREMENT_CHANGE: high

  dataLoss:
    SCHEMA_CHANGE: medium
    REQUIREMENT_CHANGE: low
    default: low

  rollbackComplexity:
    TERMINOLOGY_CHANGE: MEDIUM
    LOGIC_CHANGE: LOW
    SCHEMA_CHANGE: HIGH
    API_CHANGE: MEDIUM
    UI_CHANGE: LOW
    REQUIREMENT_CHANGE: HIGH

  testingRequired:
    all: true

  deploymentRisk:
    breaking_change: HIGH
    non_breaking: MEDIUM
    ui_only: LOW

# Robot assignment logic
robot_assignments_by_artifact:
  requirements:
    robot: Talib
    responsibility: "Update REQ-###.yaml files with change metadata"

  design:
    robot: PMA
    responsibility: "Update design documents (FUNC-###, UC-###, db-schema, api-design)"

  database:
    robot: Ashok
    responsibility: "Create migrations, update data models, create rollback scripts"

  api:
    robot: Reena
    responsibility: "Update API contracts, handle versioning, update DTOs"

  frontend:
    robot: Charlie
    responsibility: "Update UI components, forms, views"

  design_system:
    robot: Clara
    responsibility: "Update design system components, style guides"

# Integration with activity log
activity_log_events:
  analyzed:
    type: CHANGE_REQUEST
    attributes:
      status: ANALYZED
      requirementsAffected: "{count}"
      designDocsAffected: "{count}"
      codeFilesAffected: "{count}"
      estimatedEffort: "{effort}"
      breaking: "{boolean}"
