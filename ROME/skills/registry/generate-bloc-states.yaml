skill:
  name: generate-bloc-states
  version: 1.0.0
  category: generation
  tier: 1
  description: Generate BLoC state classes using native Dart sealed classes

parameters:
  required:
    - name: design_directory
      type: string
      validation: directory_exists

    - name: output_directory
      type: string

  optional:
    - name: entities
      type: array
      default: []

execution:
  timeout: 30000

output:
  files_generated:
    type: array
  states_created:
    type: integer
