skill:
  name: generate-complete-domain-layer
  version: 1.0.0
  category: composition
  tier: 2
  description: Generate complete domain layer (entities + repositories + result types)

parameters:
  required:
    - name: design_directory
      type: string
      validation: directory_exists

    - name: output_directory
      type: string

  optional:
    - name: entities
      type: array
      default: []

execution:
  timeout: 60000

output:
  files_generated:
    type: array
  components_created:
    type: object
