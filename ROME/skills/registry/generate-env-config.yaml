skill:
  name: generate-env-config
  version: 1.0.0
  category: configuration
  tier: 1
  description: Generate environment configuration files from design specifications

parameters:
  required:
    - name: design_directory
      type: string
      validation: directory_exists

    - name: output_directory
      type: string

  optional:
    - name: environments
      type: array
      default: ["development", "staging", "production"]

execution:
  timeout: 30000

output:
  files_generated:
    type: array
  environment_count:
    type: integer
