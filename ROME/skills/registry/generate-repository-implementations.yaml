skill:
  name: generate-repository-implementations
  version: 1.0.0
  category: generation
  tier: 1
  description: Generate concrete repository implementations using Parse SDK

parameters:
  required:
    - name: design_directory
      type: string
      validation: directory_exists

    - name: output_directory
      type: string

  optional:
    - name: entities
      type: array
      default: []

execution:
  timeout: 30000

output:
  files_generated:
    type: array
  implementations_created:
    type: integer
