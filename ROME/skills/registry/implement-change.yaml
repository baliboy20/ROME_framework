skill:
  name: implement-change
  version: 1.0.0
  category: change-management
  tier: 2
  description: Implement approved change request by coordinating robots to update artifacts with change metadata preservation
  proposal: ROME-PROP-015

parameters:
  required:
    - name: cr_file
      type: string
      validation: file_exists
      description: Path to approved CR-###.yaml file

  optional:
    - name: robot
      type: string
      allowed_values: [Talib, PMA, Ashok, Reena, Charlie, Clara]
      description: Specific robot to execute implementation (if orchestrating single robot)

    - name: artifact_type
      type: string
      allowed_values: [requirements, design, database, api, frontend, design_system]
      description: Type of artifact to update (corresponds to robot assignment)

    - name: dry_run
      type: boolean
      default: false
      description: Preview changes without actually modifying files

    - name: auto_commit
      type: boolean
      default: false
      description: Automatically commit changes with CR reference

execution:
  timeout: 60000
  retry:
    enabled: false
    reason: "Changes must be carefully reviewed, not retried automatically"

output:
  cr_id:
    type: string
    description: Change request ID

  artifacts_updated:
    type: array
    description: List of artifacts that were updated

  change_metadata_embedded:
    type: boolean
    description: Whether change metadata was successfully embedded

  git_commit_sha:
    type: string
    description: Git commit SHA if auto_commit enabled

  next_steps:
    type: array
    description: Next steps in workflow (typically verification)

# Implementation responsibilities by robot
robot_responsibilities:
  Talib:
    artifact_type: requirements
    tasks:
      - "Update REQ-###.yaml files affected by change"
      - "Embed changeHistory metadata in each requirement"
      - "Ensure AORDL validation still passes"
      - "Update requirements catalog if needed"

  PMA:
    artifact_type: design
    tasks:
      - "Update functional specs (FUNC-###)"
      - "Update use cases (UC-###)"
      - "Update entity models, data dictionary"
      - "Update db-schema.yaml or api-design.md if needed"
      - "Add Change History section to markdown docs"

  Ashok:
    artifact_type: database
    tasks:
      - "Create database migration scripts"
      - "Update data models, repositories"
      - "Create rollback scripts"
      - "Test migrations in staging"
      - "Update TRACEABILITY.md in affected features"

  Reena:
    artifact_type: api
    tasks:
      - "Handle API versioning for breaking changes"
      - "Update API contracts, DTOs, controllers"
      - "Create client migration guides"
      - "Test backward compatibility"
      - "Update TRACEABILITY.md in affected features"

  Charlie:
    artifact_type: frontend
    tasks:
      - "Update UI components, widgets, forms"
      - "Update navigation flows if needed"
      - "Update tests"
      - "Update TRACEABILITY.md in affected features"

  Clara:
    artifact_type: design_system
    tasks:
      - "Update design system components"
      - "Update design tokens if needed"
      - "Ensure consistency across UI"
      - "Update style guides"
      - "Update TRACEABILITY.md in design_system folder"

# Change metadata embedding format
change_metadata_formats:
  requirements_yaml:
    location: "changeHistory section"
    format: |
      changeHistory:
        - changeRequest: {cr_id}
          date: {iso_timestamp}
          type: {change_type}
          changes:
            - field: {field_name}
              oldValue: {old_value}
              newValue: {new_value}

  design_markdown:
    location: "## Change History section"
    format: |
      ## Change History
      - **{cr_id}** ({date}): {description}
        - Affected: {affected_scope}
        - Breaking: {yes_no}

  code_comments:
    location: "Top of file or near changed code"
    format: |
      // Changed: {cr_id} ({date}) - {description}

  traceability_md:
    location: "## Change History section"
    format: |
      ## Change History
      - **{cr_id}** ({date}): {description}
        - Affected: {files_or_scope}
        - Breaking: {yes_no}
        - Migration: {migration_file_if_applicable}

# Validation checks before implementation
pre_implementation_checks:
  - check: "CR status is APPROVED"
    error: "Cannot implement CR that is not approved by Sarah"

  - check: "ApprovedBy field is populated"
    error: "CR must have approval metadata"

  - check: "ImpactAnalysis section is complete"
    error: "Cannot implement without impact analysis"

  - check: "Git working directory is clean"
    warning: "Uncommitted changes present - may cause conflicts"

# Post-implementation steps
post_implementation_steps:
  - "Update CR-###.yaml ImplementedBy section"
  - "Update CR Status to IN_PROGRESS"
  - "Log implementation progress to activity log"
  - "If auto_commit: Create git commit with CR reference"
  - "Notify Sarah for verification via activity log"

# Git commit message format
git_commit_format: |
  {change_type}: {title}

  Implements {cr_id}

  {description}

  Breaking: {yes_no}
  Affected: {artifact_count} artifacts

  🤖 Generated with [Claude Code](https://claude.com/claude-code)

  Co-Authored-By: Claude Sonnet 4.5 <noreply@anthropic.com>

# Integration with activity log
activity_log_events:
  implementation_started:
    type: STORY
    attributes:
      id: "{cr_id}-{artifact_type}"
      status: IN_PROGRESS
      changeRequest: "{cr_id}"
      implementedBy: "{robot}"

  implementation_completed:
    type: STORY
    attributes:
      id: "{cr_id}-{artifact_type}"
      status: COMPLETED
      changeRequest: "{cr_id}"
      implementedBy: "{robot}"
      filesUpdated: "{file_list}"
