skill:
  name: generate-ci-pipeline
  version: 1.0.0
  category: configuration
  tier: 1
  description: Generate CI/CD pipeline configuration (GitHub Actions)

parameters:
  required:
    - name: design_directory
      type: string
      validation: directory_exists

    - name: output_directory
      type: string

  optional:
    - name: ci_provider
      type: string
      default: github-actions

execution:
  timeout: 30000

output:
  files_generated:
    type: array
