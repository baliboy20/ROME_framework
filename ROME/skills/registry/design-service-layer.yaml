skill:
  name: design-service-layer
  version: 1.0.0
  category: design
  tier: 1
  description: Design business logic service layer with transaction management

parameters:
  required:
    - name: data_dictionary_file
      type: string
      validation: file_exists
      description: Path to data dictionary JSON file

  optional:
    - name: output_file
      type: string
      description: File path to write service design specification

execution:
  timeout: 60000

output:
  services_designed:
    type: integer
  service_specs:
    type: array
