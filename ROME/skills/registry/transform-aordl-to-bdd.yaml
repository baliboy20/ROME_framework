skill:
  name: transform-aordl-to-bdd
  version: 1.0.0
  category: transformation
  tier: 1
  description: Transform AORDL requirement to BDD Gherkin format (Given-When-Then)

parameters:
  required:
    - name: requirement_file
      type: string
      validation: file_exists
      description: Path to AORDL requirement YAML file

  optional:
    - name: output_file
      type: string
      description: File path to write BDD feature file

    - name: include_error_scenarios
      type: boolean
      default: true
      description: Generate scenarios for error conditions

    - name: include_examples
      type: boolean
      default: true
      description: Include Scenario Outline with Examples

execution:
  timeout: 15000
  retry:
    enabled: true
    max_attempts: 2
    backoff: linear

output:
  feature_name:
    type: string
    description: Generated feature name
  scenarios:
    type: array
    description: List of generated scenarios
  gherkin_content:
    type: string
    description: Complete Gherkin feature file content

# Gherkin templates
gherkin_templates:
  feature:
    format: |
      Feature: {feature_name}
        As a {actor}
        I want to {intent}
        So that {business_value}

  scenario:
    format: |
      Scenario: {scenario_name}
        Given {preconditions}
        When {action}
        Then {outcomes}

  scenario_outline:
    format: |
      Scenario Outline: {scenario_name}
        Given {preconditions}
        When {action}
        Then {outcomes}

        Examples:
          | {param_headers} |
          | {param_values} |

  error_scenario:
    format: |
      Scenario: {error_condition}
        Given {preconditions}
        When {action}
        Then {error_message}

# Intent verb to user action mapping
verb_to_action:
  create: "I create a {object}"
  read: "I view the {object}"
  retrieve: "I retrieve the {object}"
  view: "I view the {object}"
  list: "I list all {object}s"
  search: "I search for {object}s"
  update: "I update the {object}"
  modify: "I modify the {object}"
  delete: "I delete the {object}"
  remove: "I remove the {object}"
  submit: "I submit the {object}"
  approve: "I approve the {object}"
  reject: "I reject the {object}"
  archive: "I archive the {object}"
  restore: "I restore the {object}"
  export: "I export {object}s"
  import: "I import {object}s"
