skill:
  name: extract-invariants
  version: 1.0.0
  category: extraction
  tier: 1
  description: Extract and classify business rules (invariants) from AORDL requirements

parameters:
  required:
    - name: requirement_file
      type: string
      validation: file_exists
      description: Path to AORDL requirement YAML file

  optional:
    - name: classify_rules
      type: boolean
      default: true
      description: Classify invariants by type (validation, constraint, business-policy)

    - name: output_format
      type: string
      default: json
      allowed_values: [json, yaml]
      description: Output format for extracted invariants

    - name: output_file
      type: string
      description: Optional file path to write extracted invariants

execution:
  timeout: 10000
  retry:
    enabled: true
    max_attempts: 2
    backoff: linear

output:
  invariants:
    type: array
    description: List of extracted invariants with classifications
  requirement_id:
    type: string
    description: ID of the analyzed requirement
  statistics:
    type: object
    description: Summary statistics about invariants

# Invariant classification patterns
rule_types:
  validation:
    description: Data validation rules (format, type, range)
    keywords:
      - must be
      - must have
      - must contain
      - must match
      - cannot be empty
      - cannot be null
      - required
      - valid
      - format

  constraint:
    description: Business constraints and limits
    keywords:
      - cannot exceed
      - maximum
      - minimum
      - limit
      - cannot be greater than
      - cannot be less than
      - must be between
      - range

  uniqueness:
    description: Uniqueness constraints
    keywords:
      - unique
      - duplicate
      - must be unique
      - cannot duplicate
      - already exists

  relationship:
    description: Entity relationship rules
    keywords:
      - must belong to
      - must be associated with
      - must reference
      - must exist
      - must have
      - orphan

  state:
    description: State transition and status rules
    keywords:
      - status must be
      - cannot change
      - immutable
      - permanent
      - once set
      - irreversible

  temporal:
    description: Time-based rules and ordering
    keywords:
      - after
      - before
      - during
      - must occur
      - timestamp
      - created date
      - modified date

  authorization:
    description: Access control and permission rules
    keywords:
      - only
      - permitted
      - allowed
      - restricted
      - authorized
      - permission
      - role

  business_policy:
    description: General business policy rules
    keywords:
      - policy
      - rule
      - always
      - never
      - all
      - every
