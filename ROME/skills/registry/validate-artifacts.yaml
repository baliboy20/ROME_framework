skill:
  name: validate-artifacts
  version: 1.0.0
  category: validation
  tier: 3
  description: Cross-validate all P2 artifacts for consistency and completeness

parameters:
  required:
    - name: artifacts_directory
      type: string
      validation: directory_exists
      description: Directory containing all P2 artifacts

  optional:
    - name: output_file
      type: string
      description: File path to write validation report

    - name: strict_mode
      type: boolean
      default: true
      description: Fail on warnings (not just errors)

    - name: check_all
      type: boolean
      default: true
      description: Run all validation checks

execution:
  timeout: 60000
  retry:
    enabled: true
    max_attempts: 2
    backoff: linear

output:
  validation_status:
    type: string
    description: PASS or FAIL
  checks_run:
    type: integer
    description: Number of validation checks performed
  issues_found:
    type: array
    description: List of validation issues
  recommendations:
    type: array
    description: Improvement recommendations

# Validation checks
validation_checks:
  - check: entity_schema_consistency
    description: Verify entities in data dictionary match database schema
    severity: ERROR

  - check: api_entity_consistency
    description: Verify API endpoints reference valid entities
    severity: ERROR

  - check: test_coverage_completeness
    description: Verify all requirements have test scenarios
    severity: WARNING

  - check: requirement_traceability
    description: Verify all requirements traced to artifacts
    severity: ERROR

  - check: schema_normalization
    description: Check database schema normalization
    severity: WARNING

  - check: api_rest_compliance
    description: Verify API follows REST conventions
    severity: WARNING
