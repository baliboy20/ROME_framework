skill:
  name: recommend-skills
  version: 1.0.0
  category: discovery
  tier: 2
  description: Recommends skills based on task description and context

parameters:
  required:
    - name: task_description
      type: string
      description: Description of the task you want to accomplish

  optional:
    - name: current_phase
      type: string
      description: Current phase (P1, P2, P3, P4, P5)

    - name: artifacts_available
      type: array
      default: []
      description: List of available artifacts (files, documents)

    - name: max_recommendations
      type: integer
      default: 5
      description: Maximum number of recommendations to return

execution:
  timeout: 10000

output:
  recommendations:
    type: array
    description: List of recommended skills with relevance scores
  total_analyzed:
    type: integer
    description: Total number of skills analyzed
  keywords_extracted:
    type: array
    description: Keywords extracted from task description
  context:
    type: object
    description: Context used for recommendations

examples:
  - description: Recommend skills for analyzing requirements
    usage: "/recommend-skills --task-description 'I need to analyze AORDL requirements and create user stories' --current-phase P2"

  - description: Recommend skills for API design
    usage: "/recommend-skills --task-description 'Design REST API endpoints for user management' --current-phase P3"

  - description: Recommend skills for code generation
    usage: "/recommend-skills --task-description 'Generate Flutter widgets for product listing' --current-phase P5"

  - description: Recommend skills with artifact context
    usage: "/recommend-skills --task-description 'Create deployment configuration' --current-phase P4 --artifacts-available '[\"tech-stack.md\", \"system-architecture.md\"]'"
