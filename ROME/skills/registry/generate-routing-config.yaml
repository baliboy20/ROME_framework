skill:
  name: generate-routing-config
  version: 1.0.0
  category: generation
  tier: 3
  description: Generate routing configuration using go_router for type-safe navigation

parameters:
  required:
    - name: code_directory
      type: string
      validation: directory_exists

    - name: output_file
      type: string

  optional:
    - name: entities
      type: array
      default: []

execution:
  timeout: 30000

output:
  file_generated:
    type: string
  routes_created:
    type: integer
