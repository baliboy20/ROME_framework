skill:
  name: generate-deployment-package
  version: 1.0.0
  category: composition
  tier: 2
  description: Generate complete deployment package with all configurations

parameters:
  required:
    - name: design_directory
      type: string
      validation: directory_exists

    - name: output_directory
      type: string

execution:
  timeout: 60000

output:
  files_generated:
    type: array
  package_ready:
    type: boolean
