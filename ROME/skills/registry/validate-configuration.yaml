skill:
  name: validate-configuration
  version: 1.0.0
  category: validation
  tier: 3
  description: Validate all configuration files for consistency, security, best practices

parameters:
  required:
    - name: config_directory
      type: string
      validation: directory_exists

    - name: output_file
      type: string

execution:
  timeout: 60000

output:
  validation_status:
    type: string
  issues_found:
    type: array
  security_score:
    type: integer
  consistency_score:
    type: integer
