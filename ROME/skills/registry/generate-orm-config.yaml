skill:
  name: generate-orm-config
  version: 1.0.0
  category: configuration
  tier: 1
  description: Generate ORM configuration (TypeORM/Prisma)

parameters:
  required:
    - name: design_directory
      type: string
      validation: directory_exists

    - name: output_directory
      type: string

  optional:
    - name: orm_type
      type: string
      default: typeorm

execution:
  timeout: 30000

output:
  files_generated:
    type: array
