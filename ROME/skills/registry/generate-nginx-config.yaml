skill:
  name: generate-nginx-config
  version: 1.0.0
  category: configuration
  tier: 1
  description: Generate Nginx reverse proxy configuration

parameters:
  required:
    - name: design_directory
      type: string
      validation: directory_exists

    - name: output_file
      type: string

  optional:
    - name: port
      type: integer
      default: 3000

execution:
  timeout: 30000

output:
  config_generated:
    type: boolean
