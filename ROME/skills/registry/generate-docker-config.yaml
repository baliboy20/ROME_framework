skill:
  name: generate-docker-config
  version: 1.0.0
  category: configuration
  tier: 1
  description: Generate Docker configuration files (Dockerfile, docker-compose.yml)

parameters:
  required:
    - name: design_directory
      type: string
      validation: directory_exists

    - name: output_directory
      type: string

  optional:
    - name: node_version
      type: string
      default: "18-alpine"

execution:
  timeout: 30000

output:
  files_generated:
    type: array
