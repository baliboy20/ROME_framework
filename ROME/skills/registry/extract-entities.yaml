skill:
  name: extract-entities
  version: 1.0.0
  category: extraction
  tier: 1
  description: Extract business entities from AORDL requirement files

parameters:
  required:
    - name: requirement_file
      type: string
      validation: file_exists
      description: Path to AORDL requirement YAML file

  optional:
    - name: output_format
      type: string
      default: json
      allowed_values: [json, yaml]
      description: Output format for extracted entities

    - name: include_relationships
      type: boolean
      default: true
      description: Whether to extract entity relationships

    - name: output_file
      type: string
      description: Optional file path to write extracted entities

execution:
  timeout: 15000
  retry:
    enabled: true
    max_attempts: 2
    backoff: linear

output:
  entities:
    type: array
    description: List of extracted entities with attributes
  relationships:
    type: array
    description: Entity relationships identified in requirement
  requirement_id:
    type: string
    description: ID of the analyzed requirement

# Common business entity patterns to recognize
entity_patterns:
  # Primary entities (capitalized nouns)
  primary:
    - pattern: "[A-Z][a-z]+"
      type: entity_name

  # Compound entities (hyphenated or camelCase)
  compound:
    - pattern: "[a-z]+-[a-z]+"
      type: compound_entity
    - pattern: "[A-Z][a-z]+[A-Z][a-z]+"
      type: camel_case_entity

# Relationship indicators
relationship_keywords:
  - belongs_to
  - has_many
  - has_one
  - associated_with
  - references
  - linked_to
  - part_of
  - contains
  - owned_by

# Attribute indicators (context clues for entity properties)
attribute_keywords:
  - name
  - title
  - description
  - status
  - type
  - date
  - time
  - user
  - owner
  - creator
  - assignee
