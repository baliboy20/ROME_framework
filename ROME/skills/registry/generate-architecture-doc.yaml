skill:
  name: generate-architecture-doc
  version: 1.0.0
  category: documentation
  tier: 3
  description: Generate Architecture Decision Records (ADR) documentation

parameters:
  required:
    - name: design_directory
      type: string
      validation: directory_exists

  optional:
    - name: output_file
      type: string

execution:
  timeout: 60000

output:
  adr_count:
    type: integer
  document_content:
    type: string
