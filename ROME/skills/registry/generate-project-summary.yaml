skill:
  name: generate-project-summary
  version: 1.0.0
  category: composition
  tier: 2
  description: Generate comprehensive project summary dashboard from all P2 artifacts

parameters:
  required:
    - name: artifacts_directory
      type: string
      validation: directory_exists
      description: Directory containing all P2 artifacts

  optional:
    - name: output_file
      type: string
      description: File path to write project summary

    - name: output_format
      type: string
      default: markdown
      allowed_values: [json, yaml, markdown, html]
      description: Output format

    - name: project_name
      type: string
      default: "Generated Project"
      description: Project name for summary

execution:
  timeout: 30000
  retry:
    enabled: true
    max_attempts: 2
    backoff: linear

output:
  summary:
    type: object
    description: Complete project summary
  output_file:
    type: string
    description: Path to generated summary file
