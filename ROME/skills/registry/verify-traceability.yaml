skill:
  name: verify-traceability
  version: 1.0.0
  category: change-management
  tier: 2
  description: Verify traceability chain remains intact after change implementation (REQ → FUNC → UC → Code)
  proposal: ROME-PROP-015
  integrates_with: ROME-PROP-016

parameters:
  required:
    - name: cr_file
      type: string
      validation: file_exists
      description: Path to CR-###.yaml file to verify

  optional:
    - name: artifacts_dir
      type: string
      default: ARTIFACTS
      description: Root directory of project artifacts

    - name: source_dir
      type: string
      default: src
      description: Root directory of source code

    - name: strict
      type: boolean
      default: true
      description: Fail verification if any traceability link is broken

    - name: check_tests
      type: boolean
      default: true
      description: Verify tests exist and pass for changed requirements

    - name: output_format
      type: string
      default: markdown
      allowed_values: [markdown, json, yaml]
      description: Format for verification report

execution:
  timeout: 30000
  retry:
    enabled: true
    max_attempts: 2
    backoff: linear

output:
  cr_id:
    type: string
    description: Change request ID

  traceability_intact:
    type: boolean
    description: Overall traceability status

  verification_results:
    type: object
    description: Detailed verification results

  broken_links:
    type: array
    description: List of broken traceability links (if any)

  missing_metadata:
    type: array
    description: List of artifacts missing change metadata

  tests_status:
    type: object
    description: Test execution results

  recommendations:
    type: array
    description: Recommendations to fix issues

# Traceability verification checklist
verification_checklist:
  - check: "All affected requirements have changeHistory metadata"
    severity: ERROR
    description: "Every REQ-###.yaml listed in ImpactAnalysis must have changeHistory entry"

  - check: "All affected design documents have Change History section"
    severity: ERROR
    description: "Every design doc listed in ImpactAnalysis must document the change"

  - check: "All affected code files have change comments or TRACEABILITY.md updated"
    severity: WARNING
    description: "Code should reference CR-### or TRACEABILITY.md should be updated"

  - check: "All TRACEABILITY.md files affected have Change History entries"
    severity: ERROR
    description: "Feature folders affected must update TRACEABILITY.md (ROME-PROP-016)"

  - check: "REQ → FUNC traceability links still valid"
    severity: ERROR
    description: "Requirements still map to correct features"

  - check: "FUNC → UC traceability links still valid"
    severity: ERROR
    description: "Features still map to correct use cases"

  - check: "UC → Code traceability links still valid"
    severity: WARNING
    description: "Use cases still map to correct code (via TRACEABILITY.md)"

  - check: "Tests exist for all changed requirements"
    severity: WARNING
    description: "Changed requirements should have corresponding tests"

  - check: "All tests pass"
    severity: ERROR
    description: "Test suite must pass after changes"

  - check: "Activity log updated with change progress"
    severity: WARNING
    description: "Change implementation should be logged"

  - check: "Git commits reference CR-###"
    severity: WARNING
    description: "Commits should reference change request for audit trail"

# Traceability chain validation
traceability_chain_validation:
  step_1:
    name: "Requirements Layer"
    artifacts:
      - "REQ-###.yaml files"
    checks:
      - "changeHistory field populated"
      - "CR-### referenced in changeHistory"
      - "Old and new values documented"
      - "AORDL validation still passes"

  step_2:
    name: "Design Layer"
    artifacts:
      - "FUNC-### (functional specs)"
      - "UC-### (use cases)"
      - "db-schema.yaml"
      - "api-design.md"
    checks:
      - "Change History section present"
      - "CR-### referenced"
      - "Requirements still traceable to features"
      - "Features still traceable to use cases"

  step_3:
    name: "Code Layer"
    artifacts:
      - "lib/features/*/TRACEABILITY.md"
      - "Source code files"
    checks:
      - "TRACEABILITY.md updated with Change History"
      - "CR-### referenced"
      - "Feature folders still map to requirements"
      - "Module structure documented"

  step_4:
    name: "Test Layer"
    artifacts:
      - "Test files"
    checks:
      - "Tests exist for changed requirements"
      - "Tests reference requirement IDs"
      - "All tests pass"

# Verification strategies by change type
verification_strategies:
  TERMINOLOGY_CHANGE:
    focus:
      - "Verify all references updated consistently"
      - "Check API contracts still valid"
      - "Verify database migrations complete"
      - "Ensure no stale references remain"

  LOGIC_CHANGE:
    focus:
      - "Verify Invariants updated in requirements"
      - "Check business logic in code matches requirements"
      - "Verify tests cover new logic"
      - "Ensure error handling updated"

  SCHEMA_CHANGE:
    focus:
      - "Verify migrations exist and tested"
      - "Check rollback scripts present"
      - "Verify data models updated"
      - "Ensure repositories handle new schema"

  API_CHANGE:
    focus:
      - "Verify API version bumped if breaking"
      - "Check DTOs updated"
      - "Verify client migration guide exists"
      - "Ensure backward compatibility if claimed"

  UI_CHANGE:
    focus:
      - "Verify widgets/components updated"
      - "Check use cases still implemented"
      - "Verify accessibility maintained"
      - "Ensure design system consistency"

  REQUIREMENT_CHANGE:
    focus:
      - "Verify entire chain updated (REQ → FUNC → UC → Code)"
      - "Check tests cover new requirement scope"
      - "Verify no orphaned artifacts"
      - "Ensure impact analysis was complete"

# Missing metadata detection
missing_metadata_patterns:
  requirements:
    search: "ARTIFACTS/*/requirements/*.yaml"
    must_contain: "changeHistory"
    if_listed_in: "ImpactAnalysis.requirements"

  design_markdown:
    search: "ARTIFACTS/*/design/*.md"
    must_contain: "## Change History"
    if_listed_in: "ImpactAnalysis.design"

  traceability_md:
    search: "lib/features/*/TRACEABILITY.md"
    must_contain: "## Change History"
    if_listed_in: "ImpactAnalysis.code"

# Test validation
test_validation:
  find_tests:
    patterns:
      - "**/*test.{ts,js,dart,py}"
      - "**/*_test.{ts,js,dart,py}"
      - "tests/**/*.{ts,js,dart,py}"

  test_naming_conventions:
    should_reference: "REQ-### or UC-### in test descriptions"
    example: "test('REQ-012: Preconditions[0] - rejects unauthenticated')"

  run_tests:
    command: "npm test || pytest || flutter test"
    timeout: 60000

# Verification report format
verification_report_template: |
  # Traceability Verification Report
  **CR:** {cr_id}
  **Date:** {iso_timestamp}
  **Status:** {PASS|FAIL}

  ## Summary
  - Traceability intact: {yes/no}
  - Broken links: {count}
  - Missing metadata: {count}
  - Tests passing: {yes/no}

  ## Traceability Chain
  ### REQ → FUNC
  {list_of_mappings_with_status}

  ### FUNC → UC
  {list_of_mappings_with_status}

  ### UC → Code
  {list_of_mappings_with_status}

  ## Change Metadata
  ### Requirements
  {list_of_requirements_with_metadata_status}

  ### Design Documents
  {list_of_design_docs_with_metadata_status}

  ### Code (TRACEABILITY.md)
  {list_of_features_with_metadata_status}

  ## Test Results
  {test_execution_results}

  ## Issues Found
  {list_of_issues_if_any}

  ## Recommendations
  {list_of_recommendations}

# Integration with activity log
activity_log_events:
  verification_started:
    type: CHANGE_REQUEST
    attributes:
      id: "{cr_id}"
      status: "VERIFICATION_IN_PROGRESS"

  verification_passed:
    type: CHANGE_REQUEST
    attributes:
      id: "{cr_id}"
      status: "VERIFIED"
      traceabilityIntact: true
      testsPass: true
      validatedBy: "Sarah"

  verification_failed:
    type: CHANGE_REQUEST
    attributes:
      id: "{cr_id}"
      status: "VERIFICATION_FAILED"
      traceabilityIntact: false
      brokenLinks: "{count}"
      missingMetadata: "{count}"
