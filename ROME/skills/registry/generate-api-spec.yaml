skill:
  name: generate-api-spec
  version: 1.0.0
  category: generation
  tier: 1
  description: Generate OpenAPI 3.0 specification from AORDL requirement

parameters:
  required:
    - name: requirement_file
      type: string
      validation: file_exists
      description: Path to AORDL requirement YAML file

  optional:
    - name: output_file
      type: string
      description: File path to write OpenAPI spec

    - name: api_version
      type: string
      default: "1.0.0"
      description: API version for the spec

    - name: base_path
      type: string
      default: "/api/v1"
      description: Base path for API endpoints

execution:
  timeout: 15000
  retry:
    enabled: true
    max_attempts: 2
    backoff: linear

output:
  openapi_spec:
    type: object
    description: Complete OpenAPI 3.0 specification
  endpoint_path:
    type: string
    description: Generated endpoint path

# OpenAPI response codes
response_codes:
  POST:
    success: "201"
    success_description: "Created"
  GET:
    success: "200"
    success_description: "OK"
  PUT:
    success: "200"
    success_description: "OK"
  PATCH:
    success: "200"
    success_description: "OK"
  DELETE:
    success: "204"
    success_description: "No Content"

# Common error responses
error_responses:
  - code: "400"
    description: "Bad Request - Invalid input"
  - code: "401"
    description: "Unauthorized - Authentication required"
  - code: "403"
    description: "Forbidden - Insufficient permissions"
  - code: "404"
    description: "Not Found - Resource not found"
  - code: "409"
    description: "Conflict - Resource already exists or state conflict"
  - code: "422"
    description: "Unprocessable Entity - Validation failed"
  - code: "500"
    description: "Internal Server Error"
