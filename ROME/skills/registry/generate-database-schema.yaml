skill:
  name: generate-database-schema
  version: 1.0.0
  category: configuration
  tier: 1
  description: Generate database schema SQL from data dictionary

parameters:
  required:
    - name: data_dictionary_file
      type: string
      validation: file_exists

    - name: output_file
      type: string

  optional:
    - name: database_type
      type: string
      default: postgresql

execution:
  timeout: 30000

output:
  tables_generated:
    type: integer
  indexes_generated:
    type: integer
  constraints_generated:
    type: integer
