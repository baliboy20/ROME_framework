skill:
  name: generate-parse-validation
  version: 1.0.0
  category: generation
  tier: 1
  description: Generate json_validation schemas for Parse Server responses

parameters:
  required:
    - name: design_directory
      type: string
      validation: directory_exists

    - name: output_directory
      type: string

  optional:
    - name: entities
      type: array
      default: []

execution:
  timeout: 30000

output:
  files_generated:
    type: array
  validators_created:
    type: integer
