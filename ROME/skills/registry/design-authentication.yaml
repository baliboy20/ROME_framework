skill:
  name: design-authentication
  version: 1.0.0
  category: design
  tier: 1
  description: Design authentication and authorization system architecture

parameters:
  required:
    - name: api_spec_file
      type: string
      validation: file_exists

  optional:
    - name: output_file
      type: string
    - name: auth_strategy
      type: string
      default: jwt
      description: Authentication strategy (jwt, oauth2, session)

execution:
  timeout: 60000

output:
  auth_components:
    type: integer
  auth_spec:
    type: object
