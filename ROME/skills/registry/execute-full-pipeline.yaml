skill:
  name: execute-full-pipeline
  version: 1.0.0
  category: orchestration
  tier: 3
  description: Execute complete P1→P2→P3 pipeline with validation and optimization

parameters:
  required:
    - name: requirements_directory
      type: string
      validation: directory_exists
      description: Directory containing AORDL requirement files

    - name: artifacts_directory
      type: string
      description: Directory for output artifacts

  optional:
    - name: validate_artifacts
      type: boolean
      default: true
      description: Run artifact validation

    - name: optimize_data_model
      type: boolean
      default: true
      description: Run data model optimization

    - name: analyze_dependencies
      type: boolean
      default: true
      description: Analyze requirement dependencies

    - name: generate_deployment_guide
      type: boolean
      default: true
      description: Generate deployment guide

    - name: strict_validation
      type: boolean
      default: true
      description: Use strict validation mode

execution:
  timeout: 300000
  retry:
    enabled: true
    max_attempts: 1
    backoff: linear

output:
  pipeline_status:
    type: string
    description: SUCCESS, PARTIAL_SUCCESS, or FAILED
  phases_completed:
    type: array
    description: List of completed phases
  total_artifacts:
    type: integer
    description: Total artifacts generated
  validation_status:
    type: string
    description: Validation result
  optimization_score:
    type: integer
    description: Data model optimization score

# Pipeline phases
pipeline_phases:
  - phase: P2_ANALYSIS
    description: Batch analysis and artifact generation
    skills:
      - execute-p2-analysis

  - phase: VALIDATION
    description: Cross-artifact validation
    skills:
      - validate-artifacts

  - phase: OPTIMIZATION
    description: Data model optimization
    skills:
      - optimize-data-model

  - phase: DEPENDENCY_ANALYSIS
    description: Requirement dependency analysis
    skills:
      - analyze-dependencies

  - phase: DOCUMENTATION
    description: Summary and deployment guide generation
    skills:
      - generate-project-summary
      - generate-deployment-guide
