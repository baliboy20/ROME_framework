skill:
  name: design-component-structure
  version: 1.0.0
  category: design
  tier: 1
  description: Design component hierarchy and structure from data dictionary entities

parameters:
  required:
    - name: data_dictionary_file
      type: string
      validation: file_exists
      description: Path to data dictionary JSON file

  optional:
    - name: output_file
      type: string
      description: File path to write component design specification

    - name: architecture_style
      type: string
      default: layered
      description: Architecture style (layered, clean, hexagonal)

    - name: language_target
      type: string
      default: typescript
      description: Target language (typescript, java, python, csharp)

execution:
  timeout: 60000
  retry:
    enabled: true
    max_attempts: 2
    backoff: linear

output:
  components_designed:
    type: integer
    description: Number of components designed
  component_specs:
    type: array
    description: List of component specifications
  layer_distribution:
    type: object
    description: Components per architectural layer

# Component layers
component_layers:
  - layer: entity
    description: Domain entities/models

  - layer: dto
    description: Data Transfer Objects

  - layer: repository
    description: Data access layer

  - layer: service
    description: Business logic layer

  - layer: controller
    description: API/presentation layer
