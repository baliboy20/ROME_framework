skill:
  name: generate-dependency-injection
  version: 1.0.0
  category: generation
  tier: 3
  description: Generate dependency injection setup using get_it service locator

parameters:
  required:
    - name: code_directory
      type: string
      validation: directory_exists

    - name: output_file
      type: string

  optional:
    - name: entities
      type: array
      default: []

execution:
  timeout: 30000

output:
  file_generated:
    type: string
  dependencies_registered:
    type: integer
