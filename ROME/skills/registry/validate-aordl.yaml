skill:
  name: validate-aordl
  version: 1.0.0
  category: validation
  tier: 1
  description: Validate AORDL requirement file format and content

parameters:
  required:
    - name: requirement_file
      type: string
      validation: file_exists
      description: Path to AORDL requirement YAML file

  optional:
    - name: mode
      type: string
      default: STRICT
      description: Validation mode (STRICT, GUIDED, PERMISSIVE)
    - name: output_report
      type: string
      default: null
      description: Path to write validation report (optional)

returns:
  type: object
  schema:
    status:
      type: string
      enum: [PASS, FAIL]
    violations:
      type: array
      items:
        type: object
        properties:
          field: string
          violation: string
          severity: string
    report_path:
      type: string
      nullable: true

execution:
  timeout: 30000
  retry:
    enabled: true
    max_attempts: 3
    backoff: exponential

aordl_integration:
  consumes_aordl: true
  aordl_fields_used:
    - ID
    - Actor
    - Intent
    - Preconditions
    - Conditions
    - Postconditions
    - Outcomes
    - Invariants
    - NonFunctional
    - Errors
    - ScopeBoundary
    - OpenQuestions
    - CopilotMode
  validates_structure: true

anti_patterns:
  ui_keywords:
    - click
    - button
    - screen
    - form
    - menu
    - tab
    - dropdown
    - modal
    - dialog
  technical_keywords:
    - POST
    - GET
    - PUT
    - DELETE
    - PATCH
    - SQL
    - API
    - endpoint
    - JSON
    - HTTP
  generic_actors:
    - user
    - person
    - someone
    - anyone
  ambiguous_verbs:
    - manage
    - handle
    - process
    - deal with
    - work with

approved_verbs:
  - create
  - read
  - update
  - delete
  - submit
  - approve
  - reject
  - cancel
  - archive
  - restore
  - export
  - import
  - view
  - search
  - authenticate
  - assign
  - list

required_fields:
  - ID
  - Actor
  - Intent
  - Preconditions
  - Conditions
  - Postconditions
  - Outcomes
  - Invariants
  - NonFunctional
  - Errors
  - ScopeBoundary
  - OpenQuestions
  - CopilotMode
