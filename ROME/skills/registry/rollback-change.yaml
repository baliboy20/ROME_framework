skill:
  name: rollback-change
  version: 1.0.0
  category: change-management
  tier: 3
  description: Rollback implemented change request in reverse dependency order with traceability preservation
  proposal: ROME-PROP-015

parameters:
  required:
    - name: cr_file
      type: string
      validation: file_exists
      description: Path to CR-###.yaml file to rollback

    - name: reason
      type: string
      description: Reason for rollback (will be documented in CR and activity log)

  optional:
    - name: rollback_strategy
      type: string
      default: git_revert
      allowed_values: [git_revert, manual, restore_point]
      description: Strategy for rolling back changes

    - name: restore_point
      type: string
      description: Git commit SHA or backup reference to restore to

    - name: dry_run
      type: boolean
      default: false
      description: Preview rollback actions without executing

    - name: skip_tests
      type: boolean
      default: false
      description: Skip running tests after rollback (not recommended)

execution:
  timeout: 120000
  retry:
    enabled: false
    reason: "Rollback is critical operation, must not retry automatically"

output:
  cr_id:
    type: string
    description: Change request ID

  rollback_status:
    type: string
    description: SUCCESS or FAILED

  artifacts_reverted:
    type: array
    description: List of artifacts that were reverted

  git_revert_commit:
    type: string
    description: Git commit SHA of revert commit (if git_revert strategy)

  rollback_issues:
    type: array
    description: Any issues encountered during rollback

  tests_passed:
    type: boolean
    description: Whether tests pass after rollback

  next_steps:
    type: array
    description: Next steps after rollback

# Rollback execution order (reverse dependency order)
rollback_execution_order:
  - stage: 1
    name: "Revert Code"
    artifacts:
      - "Frontend code (Charlie)"
      - "API code (Reena)"
      - "Database code (Ashok)"
    reason: "Code depends on design, must be reverted first"

  - stage: 2
    name: "Run Database Rollback Migration"
    artifacts:
      - "Rollback migrations (Ashok)"
    reason: "Restore database schema to previous state"

  - stage: 3
    name: "Revert Design Documents"
    artifacts:
      - "Design docs (PMA)"
      - "FUNC-###, UC-###, db-schema, api-design"
    reason: "Design depends on requirements"

  - stage: 4
    name: "Revert Requirements"
    artifacts:
      - "REQ-###.yaml files (Talib)"
    reason: "Requirements are the foundation"

  - stage: 5
    name: "Update Change Request"
    artifacts:
      - "CR-###.yaml"
    reason: "Document rollback in CR file"

  - stage: 6
    name: "Verify Rollback"
    artifacts:
      - "Run tests"
      - "Verify traceability"
    reason: "Ensure system is in clean state"

# Rollback strategies
rollback_strategies:
  git_revert:
    description: "Use git revert to create new commit that undoes changes"
    steps:
      - "Find all commits related to CR-###"
      - "Create revert commits in reverse order"
      - "Run database rollback migrations"
      - "Update CR-###.yaml with rollback metadata"
      - "Run tests to verify"
    preserves_history: true
    recommended_for: "Most changes, especially after deployment"

  manual:
    description: "Manually undo changes file by file"
    steps:
      - "Read changeHistory metadata from each artifact"
      - "Restore oldValue for each change"
      - "Run database rollback migrations"
      - "Update CR-###.yaml with rollback metadata"
      - "Run tests to verify"
    preserves_history: true
    recommended_for: "Complex changes where git revert may not work cleanly"

  restore_point:
    description: "Hard reset to specific commit or backup"
    steps:
      - "git reset --hard {restore_point}"
      - "git push --force (WARNING: destructive)"
      - "Restore database from backup"
      - "Update CR-###.yaml"
    preserves_history: false
    recommended_for: "Critical failures only (USE WITH CAUTION)"

# Pre-rollback safety checks
pre_rollback_checks:
  - check: "CR status is COMPLETED or IN_PROGRESS"
    error: "Can only rollback implemented changes"

  - check: "Reason is provided and non-empty"
    error: "Rollback reason is required for audit trail"

  - check: "Git working directory is clean"
    error: "Uncommitted changes present - commit or stash first"

  - check: "Rollback migrations exist (for SCHEMA_CHANGE)"
    warning: "Database rollback may fail without migration scripts"

  - check: "Confirm rollback with user (if interactive)"
    error: "Rollback is destructive operation - confirmation required"

# Rollback metadata format
rollback_metadata_format:
  cr_yaml_section: |
    Status: ROLLED_BACK
    Rollback:
      reason: "{reason}"
      rolledBackBy: "{robot}"
      rolledBackDate: "{iso_timestamp}"
      restorePoint: "{git_commit_sha_or_backup}"
      strategy: "{git_revert|manual|restore_point}"

  requirements_yaml: |
    changeHistory:
      - changeRequest: {cr_id}
        date: {rollback_timestamp}
        type: ROLLBACK
        reason: "{reason}"
        changes:
          - field: {field_name}
            rolledBackFrom: {new_value}
            restoredTo: {old_value}

  design_markdown: |
    ## Change History
    - **{cr_id}** ({date}): ROLLED BACK - {reason}
      - Reverted changes from {implementation_date}

  traceability_md: |
    ## Change History
    - **{cr_id}** ({date}): ROLLED BACK - {reason}
      - All changes reverted
      - Database restored to previous state

# Database rollback handling
database_rollback:
  for_schema_changes:
    - "Locate rollback migration script (should exist from PROP-015 implementation)"
    - "Execute: migrations/{timestamp}_rollback_{cr_id}.sql"
    - "Verify database schema matches pre-change state"
    - "Verify data integrity (no data loss)"

  if_no_rollback_script:
    - "Attempt to generate inverse migration from forward migration"
    - "Warn user if automatic generation may cause data loss"
    - "Require manual confirmation before proceeding"

# API rollback handling
api_rollback:
  for_breaking_changes:
    - "Restore previous API version"
    - "Update API routing to remove new version"
    - "Notify clients of rollback via status endpoint"
    - "Update API documentation"

  for_non_breaking_changes:
    - "Revert code changes"
    - "No API version change needed"

# Post-rollback verification
post_rollback_verification:
  - "Run full test suite"
  - "Verify traceability chain intact (using verify-traceability skill)"
  - "Verify database schema matches pre-change state"
  - "Verify API contracts valid"
  - "Verify UI renders correctly"
  - "Check application builds without errors"

# Git commit message for rollback
git_rollback_commit_format: |
  revert: rollback {cr_id} - {title}

  Reason: {reason}
  Rolled back by: {robot}
  Original change: {original_commit_sha}

  This reverts the following changes:
  {list_of_reverted_artifacts}

  Breaking: {if_original_was_breaking}

  🤖 Generated with [Claude Code](https://claude.com/claude-code)

  Co-Authored-By: Claude Sonnet 4.5 <noreply@anthropic.com>

# Integration with activity log
activity_log_events:
  rollback_started:
    type: CHANGE_REQUEST
    attributes:
      id: "{cr_id}"
      status: "ROLLBACK_IN_PROGRESS"
      reason: "{reason}"
      rolledBackBy: "{robot}"

  rollback_completed:
    type: CHANGE_REQUEST
    attributes:
      id: "{cr_id}"
      status: "ROLLED_BACK"
      rolledBackDate: "{iso_timestamp}"
      testsPass: "{boolean}"
      traceabilityIntact: "{boolean}"

  rollback_failed:
    type: CHANGE_REQUEST
    attributes:
      id: "{cr_id}"
      status: "ROLLBACK_FAILED"
      reason: "{reason}"
      issues: "{issue_list}"
      requiresManualIntervention: true

# Error handling
error_scenarios:
  merge_conflicts:
    description: "Git revert causes merge conflicts"
    action: "Switch to manual rollback strategy"

  data_loss_risk:
    description: "Database rollback may lose data"
    action: "Halt rollback, require user confirmation with data loss acknowledgment"

  test_failures_after_rollback:
    description: "Tests fail after rollback"
    action: "Mark rollback as incomplete, investigate test failures"

  missing_rollback_migrations:
    description: "No rollback migration found for schema change"
    action: "Halt rollback, require manual migration creation"

  api_client_incompatibility:
    description: "Rolling back API breaks deployed clients"
    action: "Warn user, may require coordinated client rollback"

# Success criteria
rollback_success_criteria:
  - "All artifacts reverted successfully"
  - "Database schema restored to pre-change state"
  - "All tests pass"
  - "Traceability chain intact"
  - "Application builds without errors"
  - "CR-###.yaml updated with rollback metadata"
  - "Activity log updated with rollback event"
  - "Git history documents rollback"
