skill:
  name: generate-infrastructure-as-code
  version: 1.0.0
  category: generation
  tier: 3
  description: Generate Infrastructure as Code using Terraform

parameters:
  required:
    - name: design_directory
      type: string
      validation: directory_exists

    - name: output_directory
      type: string

  optional:
    - name: cloud_provider
      type: string
      default: "aws"

execution:
  timeout: 60000

output:
  files_generated:
    type: array
  resources_defined:
    type: integer
