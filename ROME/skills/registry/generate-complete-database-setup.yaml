skill:
  name: generate-complete-database-setup
  version: 1.0.0
  category: composition
  tier: 2
  description: Generate complete database setup (schema + ORM + config)

parameters:
  required:
    - name: data_dictionary_file
      type: string
      validation: file_exists

    - name: design_directory
      type: string
      validation: directory_exists

    - name: output_directory
      type: string

execution:
  timeout: 60000

output:
  files_generated:
    type: array
  tables_created:
    type: integer
