skill:
  name: optimize-code-structure
  version: 1.0.0
  category: optimization
  tier: 3
  description: Analyze and optimize code structure for performance and maintainability

parameters:
  required:
    - name: code_directory
      type: string
      validation: directory_exists

    - name: output_file
      type: string

execution:
  timeout: 60000

output:
  optimization_score:
    type: integer
  recommendations:
    type: array
